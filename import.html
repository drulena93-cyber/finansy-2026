const API = '/api/db';

function log(msg, cls='') {
  const d = document.getElementById('log');
  d.style.display = 'block';
  d.innerHTML += `<div class="${cls}">${msg}</div>`;
  d.scrollTop = d.scrollHeight;
}

async function q(sql, params=[]) {
  const r = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({query:sql, params})});
  const d = await r.json();
  if(d.error) throw new Error(d.error);
  return d;
}

async function startImport() {
  const btn = document.getElementById('btn');
  const prog = document.getElementById('progress');
  const bar = document.getElementById('progress-bar');
  btn.disabled = true;
  prog.style.display = 'block';
  
  log('🚀 Начинаем загрузку ' + RECORDS.length + ' записей...', 'info');
  
  let ok = 0, err = 0;
  const total = RECORDS.length;
  
  for(let i = 0; i < total; i++) {
    const r = RECORDS[i];
    try {
      await q(
        'INSERT INTO records(month,bank_id,type,amount,category,description,op_date) VALUES($1,$2,$3,$4,$5,$6,$7)',
        [r.month, r.bank_id, r.type, r.amount, r.category, r.description, r.op_date]
      );
      ok++;
      bar.style.width = Math.round((i+1)/total*100) + '%';
      if(ok % 30 === 0) log(`✓ Загружено ${ok} из ${total}...`, 'ok');
    } catch(e) {
      err++;
      log(`✗ Ошибка запись ${i}: ${e.message}`, 'err');
    }
  }
  
  bar.style.width = '100%';
  bar.style.background = err > 0 ? '#dc2626' : '#16a34a';
  log('', '');
  log(`✅ Готово! Загружено: ${ok} записей. Ошибок: ${err}.`, 'ok');
  btn.textContent = '✅ Импорт завершён!';
  
  log('', '');
  log('👉 <a href="/">Перейти на дашборд</a>', 'info');
}
