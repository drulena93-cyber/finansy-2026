  { key: 'Фото', get: (it) => `<button class="btn secondary inventory-photos-btn" data-id="${it.id}" style="padding:2px 8px;font-size:12px;vertical-align:middle;">📷${it.photoCount ? ' ' + it.photoCount : ''}</button>` },
];

// Настраиваемые списки "Здание" и "Помещение" — хранятся в settings как JSON-массив строк,
// управляются через отдельную модалку (⚙️ Списки), тем же принципом, что и категории Кассы.
async function getInventoryBuildingsList() {
  const rows = await db(`select value from settings where key='inventory_buildings_list'`);
  return rows.length > 0 ? rows[0].value : [];
}
async function saveInventoryBuildingsList(list) {
  await db(`insert into settings (key, value) values ('inventory_buildings_list', $1) on conflict (key) do update set value=$1, updated_at=now()`, [JSON.stringify(list)]);
}
async function getInventoryRoomsList() {
  const rows = await db(`select value from settings where key='inventory_rooms_list'`);
  return rows.length > 0 ? rows[0].value : [];
}
async function saveInventoryRoomsList(list) {
  await db(`insert into settings (key, value) values ('inventory_rooms_list', $1) on conflict (key) do update set value=$1, updated_at=now()`, [JSON.stringify(list)]);
}
// "Группа" и "Подгруппа" — такие же настраиваемые списки, как Здания/Помещения (раньше
// автодополнение по этим полям бралось просто из уже встречающихся в данных значений — этого
// было недостаточно, чтобы заранее завести новое значение или поправить/удалить старое).
async function getInventoryGroupsList() {
  const rows = await db(`select value from settings where key='inventory_groups_list'`);
  if (rows.length > 0 && rows[0].value && rows[0].value.length > 0) return rows[0].value;
  // Список ещё ни разу не сохраняли вручную через ⚙️ — подхватываем то, что уже реально
  // встречается в позициях склада, и сразу сохраняем как стартовый список, чтобы дальше
  // его можно было редактировать (добавлять/удалять) обычным способом.
  const existing = await db(`select distinct group_name from inventory_items where group_name is not null and group_name != '' order by group_name`);
  const list = existing.map(r => r.group_name);
  if (list.length > 0) await saveInventoryGroupsList(list);
  return list;
}
async function saveInventoryGroupsList(list) {
  await db(`insert into settings (key, value) values ('inventory_groups_list', $1) on conflict (key) do update set value=$1, updated_at=now()`, [JSON.stringify(list)]);
}
async function getInventorySubgroupsList() {
  const rows = await db(`select value from settings where key='inventory_subgroups_list'`);
  if (rows.length > 0 && rows[0].value && rows[0].value.length > 0) return rows[0].value;
  const existing = await db(`select distinct subgroup from inventory_items where subgroup is not null and subgroup != '' order by subgroup`);
  const list = existing.map(r => r.subgroup);
  if (list.length > 0) await saveInventorySubgroupsList(list);
  return list;
}
async function saveInventorySubgroupsList(list) {
  await db(`insert into settings (key, value) values ('inventory_subgroups_list', $1) on conflict (key) do update set value=$1, updated_at=now()`, [JSON.stringify(list)]);
}
// "Назначение" — список вариантов для одноимённого столбца (редактируемый select в таблице,
// см. purposeCell в renderInventoryTable), по просьбе Елены список заполняет она сама через ⚙️.
async function getInventoryPurposeList() {
  const rows = await db(`select value from settings where key='inventory_purpose_list'`);
  return rows.length > 0 ? rows[0].value : [];
}
async function saveInventoryPurposeList(list) {
  await db(`insert into settings (key, value) values ('inventory_purpose_list', $1) on conflict (key) do update set value=$1, updated_at=now()`, [JSON.stringify(list)]);
}

// Ссылка на видео — своя у КАЖДОГО помещения (не у здания целиком), поэтому ключ —
// "здание::помещение" (тот же приём, что buildingTypes в Коммуналке). Храним единым JSON-
// объектом в settings, а не отдельной колонкой/таблицей — помещения здесь не отдельная
// сущность в базе, только строки в inventory_items.
async function getInventoryRoomVideos() {
  const rows = await db(`select value from settings where key='inventory_room_videos'`);
  return rows.length > 0 ? rows[0].value : {};
}
async function saveInventoryRoomVideo(building, room, url) {
  const map = await getInventoryRoomVideos();
  const key = (building || '') + '::' + (room || '');
  if (url) map[key] = url; else delete map[key];
  await db(`insert into settings (key, value) values ('inventory_room_videos', $1) on conflict (key) do update set value=$1, updated_at=now()`, [JSON.stringify(map)]);
  return map;
}
function openInventoryRoomVideoModal(building, room, roomVideos) {
  const key = building + '::' + room;
  const current = (roomVideos && roomVideos[key]) || '';
  const html = `
    <div style="background:var(--surface2);border-radius:var(--radius);padding:16px;max-width:380px;">
      <div style="font-weight:700;margin-bottom:10px;">🎥 Видео — «${escHtml(room)}» (${escHtml(building)})</div>
      <label>Ссылка на видео</label>
      <input type="text" id="invRoomVideoUrl" style="width:100%;margin-bottom:12px;" value="${escHtml(current)}" placeholder="https://…">
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;">
        <button class="btn" id="invRoomVideoSave">Сохранить</button>
        ${current ? `<a href="${escHtml(current)}" target="_blank" rel="noopener" class="btn secondary" style="text-decoration:none;display:inline-flex;align-items:center;">Открыть</a>
        <button class="btn secondary" id="invRoomVideoDelete">Удалить ссылку</button>` : ''}
        <button class="btn secondary" id="invRoomVideoCancel">Закрыть</button>
      </div>
      <div id="invRoomVideoMsg"></div>
    </div>
  `;
  showModal(html);
  document.getElementById('invRoomVideoCancel').addEventListener('click', closeModal);
  document.getElementById('invRoomVideoSave').addEventListener('click', async () => {
    const url = document.getElementById('invRoomVideoUrl').value.trim();
    try {
      await saveInventoryRoomVideo(building, room, url);
      closeModal();
      await loadInventory();
    } catch (err) { showMsg('invRoomVideoMsg', 'Ошибка: ' + err.message, 'err'); }
  });
  const delBtn = document.getElementById('invRoomVideoDelete');
  if (delBtn) delBtn.addEventListener('click', async () => {
    try {
      await saveInventoryRoomVideo(building, room, '');
      closeModal();
      await loadInventory();
    } catch (err) { showMsg('invRoomVideoMsg', 'Ошибка: ' + err.message, 'err'); }
  });
}

async function openInventoryListsSettings() {
  const [buildings, rooms, groups, subgroups, purposes] = await Promise.all([
    getInventoryBuildingsList(), getInventoryRoomsList(), getInventoryGroupsList(), getInventorySubgroupsList(), getInventoryPurposeList(),
  ]);
  function listBlock(title, items, kind) {
    return `
      <div style="flex:1;min-width:200px;">
        <div style="font-weight:700;margin-bottom:8px;">${title}</div>
        <div id="invList${kind}" style="max-height:260px;overflow-y:auto;margin-bottom:8px;">
          ${items.map((v, i) => `<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 0;">
            <span>${escHtml(v)}</span>
            <button class="icon-btn inv-list-remove" data-kind="${kind}" data-idx="${i}" style="padding:0 6px;">✕</button>
          </div>`).join('') || '<div style="color:var(--text3);font-size:12px;">Список пуст</div>'}
        </div>
        <input type="text" id="invListNew${kind}" placeholder="Новое значение" style="width:100%;margin-bottom:6px;">
        <button class="btn secondary inv-list-add" data-kind="${kind}" style="width:100%;">+ Добавить</button>
      </div>
    `;
  }
  const html = `
    <div style="background:var(--surface2);border-radius:var(--radius);padding:16px;max-width:520px;max-height:90vh;overflow-y:auto;">
      <div style="font-weight:700;margin-bottom:12px;">Настройка списков склада</div>
      <div style="display:flex;gap:20px;flex-wrap:wrap;">
        ${listBlock('Здания', buildings, 'Building')}
        ${listBlock('Помещения', rooms, 'Room')}
        ${listBlock('Группы', groups, 'Group')}
        ${listBlock('Подгруппы', subgroups, 'Subgroup')}
        ${listBlock('Назначение', purposes, 'Purpose')}
      </div>
      <div style="margin-top:14px;"><button class="btn secondary" id="invListsClose">Закрыть</button></div>
    </div>
  `;
  showModal(html);
  let currentBuildings = buildings.slice(), currentRooms = rooms.slice(), currentGroups = groups.slice(), currentSubgroups = subgroups.slice(), currentPurposes = purposes.slice();
  async function refresh() {
    closeModal();
    await openInventoryListsSettings();
  }
  document.getElementById('invListsClose').addEventListener('click', closeModal);
  document.querySelectorAll('.inv-list-add').forEach(b => {
    b.addEventListener('click', async () => {
      const kind = b.dataset.kind;
      const input = document.getElementById(`invListNew${kind}`);
      const val = input.value.trim();
      if (!val) return;
      if (kind === 'Building') {
        if (!currentBuildings.includes(val)) { currentBuildings.push(val); currentBuildings.sort(); await saveInventoryBuildingsList(currentBuildings); }
      } else if (kind === 'Room') {
        if (!currentRooms.includes(val)) { currentRooms.push(val); currentRooms.sort(); await saveInventoryRoomsList(currentRooms); }
      } else if (kind === 'Group') {
        if (!currentGroups.includes(val)) { currentGroups.push(val); currentGroups.sort(); await saveInventoryGroupsList(currentGroups); }
      } else if (kind === 'Subgroup') {
        if (!currentSubgroups.includes(val)) { currentSubgroups.push(val); currentSubgroups.sort(); await saveInventorySubgroupsList(currentSubgroups); }
      } else if (kind === 'Purpose') {
        if (!currentPurposes.includes(val)) { currentPurposes.push(val); currentPurposes.sort(); await saveInventoryPurposeList(currentPurposes); }
      }
      await refresh();
    });
  });
  document.querySelectorAll('.inv-list-remove').forEach(b => {
    b.addEventListener('click', async () => {
      const kind = b.dataset.kind;
      const idx = Number(b.dataset.idx);
      if (kind === 'Building') { currentBuildings.splice(idx, 1); await saveInventoryBuildingsList(currentBuildings); }
      else if (kind === 'Room') { currentRooms.splice(idx, 1); await saveInventoryRoomsList(currentRooms); }
      else if (kind === 'Group') { currentGroups.splice(idx, 1); await saveInventoryGroupsList(currentGroups); }
      else if (kind === 'Subgroup') { currentSubgroups.splice(idx, 1); await saveInventorySubgroupsList(currentSubgroups); }
      else if (kind === 'Purpose') { currentPurposes.splice(idx, 1); await saveInventoryPurposeList(currentPurposes); }
      await refresh();
    });
  });
}

// ============================================================
// СТРАНИЦА: Сводка по складу — группировка по зданию/помещению с итогами; клик по
// помещению (или по цифрам в строке здания) переключает в "Детализация" с уже
// применённым фильтром по этому зданию/помещению.
// ============================================================
async function pageInventorySummary() {
  main.innerHTML = `
    <h1>Склад — Сводка</h1>
    <div class="page-tabs" id="inventorySummaryPageTabs" style="margin-bottom:12px;">
      <div class="page-tab active" data-page="inventory-summary">Сводка</div>
      <div class="page-tab" data-page="inventory">Детализация</div>
      <div class="page-tab" data-page="inventory-photos">Фото склада</div>
    </div>
    <div id="inventorySummaryWrap">Загрузка…</div>
  `;
  document.getElementById('inventorySummaryPageTabs').addEventListener('click', (e) => {
    const t = e.target.closest('.page-tab');
    if (!t) return;
    navigateTo(t.dataset.page);
  });
  await loadInventorySummary();
}

async function loadInventorySummary() {
  const wrap = document.getElementById('inventorySummaryWrap');
  wrap.innerHTML = 'Загрузка…';
  try {
    const [items, txRows] = await Promise.all([
      db(`select id, building, room, opening_balance, price from inventory_items`),
      db(`select item_id, change from inventory_transactions`),
    ]);
    const txSumByItem = {};
    txRows.forEach(t => { txSumByItem[t.item_id] = (txSumByItem[t.item_id] || 0) + (Number(t.change) || 0); });
    items.forEach(it => {
      it.balance = (Number(it.opening_balance) || 0) + (txSumByItem[it.id] || 0);
      it.sum = it.balance * (Number(it.price) || 0);
    });

    const byBuilding = {};
    items.forEach(it => {
      const b = it.building || 'Не определено';
      const r = it.room || '—';
      byBuilding[b] = byBuilding[b] || { count: 0, balance: 0, sum: 0, rooms: {} };
      byBuilding[b].count++; byBuilding[b].balance += it.balance; byBuilding[b].sum += it.sum;
      byBuilding[b].rooms[r] = byBuilding[b].rooms[r] || { count: 0, balance: 0, sum: 0 };
      byBuilding[b].rooms[r].count++; byBuilding[b].rooms[r].balance += it.balance; byBuilding[b].rooms[r].sum += it.sum;
    });

    const grandCount = items.length;
    const grandBalance = items.reduce((s, it) => s + it.balance, 0);
    const grandSum = items.reduce((s, it) => s + it.sum, 0);
    const buildings = sortByExcelOrder(Object.keys(byBuilding));

    let html = `
      <div style="margin-bottom:16px;padding:14px 18px;border-radius:10px;background:var(--accent-l);border:1px solid var(--accent);max-width:460px;">
        <div style="font-weight:700;color:var(--accent-d);font-size:15px;margin-bottom:6px;">Всего по складу</div>
        <div style="display:flex;gap:28px;flex-wrap:wrap;font-size:14px;">
          <div><span style="color:var(--text3);">Позиций:</span> <b>${grandCount}</b></div>
          <div><span style="color:var(--text3);">Остаток:</span> <b>${grandBalance}</b></div>
          <div><span style="color:var(--text3);">Сумма:</span> <b>${fmtMoney(grandSum)}</b></div>
        </div>
      </div>
      <table class="data-table"><thead><tr>
        <th>Здание / Помещение</th><th style="text-align:right;">Позиций</th><th style="text-align:right;">Остаток</th><th style="text-align:right;">Сумма</th>
      </tr></thead><tbody>`;
    buildings.forEach(b => {
      const bd = byBuilding[b];
      html += `<tr class="inv-sum-building-row" data-building="${escHtml(b)}" style="font-weight:700;background:var(--surface2);">
        <td style="cursor:pointer;"><span class="inv-sum-toggle">▸</span> ${escHtml(b)}</td>
        <td style="text-align:right;cursor:pointer;">${bd.count}</td>
        <td style="text-align:right;cursor:pointer;">${bd.balance}</td>
        <td style="text-align:right;cursor:pointer;">${fmtMoney(bd.sum)}</td>
      </tr>`;
      const rooms = sortByExcelOrder(Object.keys(bd.rooms));
      rooms.forEach(r => {
        const rd = bd.rooms[r];
        html += `<tr class="inv-sum-room-row" data-group="${escHtml(b)}" style="display:none;cursor:pointer;" data-building="${escHtml(b)}" data-room="${r === '—' ? '' : escHtml(r)}">
          <td style="padding-left:28px;">${escHtml(r)}</td>
          <td style="text-align:right;">${rd.count}</td>
          <td style="text-align:right;">${rd.balance}</td>
          <td style="text-align:right;">${fmtMoney(rd.sum)}</td>
        </tr>`;
      });
    });
    html += '</tbody></table>';
    wrap.innerHTML = html;

    // Клик по названию здания — свернуть/развернуть список его помещений.
    wrap.querySelectorAll('.inv-sum-building-row').forEach(row => {
      row.querySelector('td:first-child').addEventListener('click', (e) => {
        e.stopPropagation();
        const b = row.dataset.building;
        const toggle = row.querySelector('.inv-sum-toggle');
        const expand = toggle.textContent === '▸';
        toggle.textContent = expand ? '▾' : '▸';
        wrap.querySelectorAll(`.inv-sum-room-row[data-group="${CSS.escape(b)}"]`).forEach(r => { r.style.display = expand ? '' : 'none'; });
      });
      // Клик по цифрам в строке здания — перейти в детализацию по всему зданию целиком.
      row.querySelectorAll('td:not(:first-child)').forEach(td => {
        td.addEventListener('click', () => {
          inventoryBuilding = row.dataset.building || null;
          inventoryRoom = null;
          navigateTo('inventory');
        });
      });
    });
    // Клик по строке помещения — перейти в детализацию, уже отфильтрованную по
    // этому зданию и помещению.
    wrap.querySelectorAll('.inv-sum-room-row').forEach(row => {
      row.addEventListener('click', () => {
        inventoryBuilding = row.dataset.building || null;
        inventoryRoom = row.dataset.room || null;
        navigateTo('inventory');
      });
    });
  } catch (err) {
    wrap.innerHTML = `<div class="status-msg err">Ошибка: ${err.message}</div>`;
  }
}

async function loadInventory() {
  const wrap = document.getElementById('inventoryWrap');
  wrap.innerHTML = 'Загрузка…';
  try {
    const [items, txRows, photoRows, firstPhotoRows, purposeList, roomVideos, buildingsListCfg, roomsListCfg, groupsListCfg, subgroupsListCfg] = await Promise.all([
      db(`select * from inventory_items order by building, room, group_name, subgroup, name`),
      db(`select item_id, change from inventory_transactions`),
      db(`select item_id, count(*) as cnt from inventory_item_photos group by item_id`),
      // Одно (самое свежее) фото на позицию — для превью по наведению прямо в строке таблицы,
      // без захода в галерею.
      db(`select distinct on (item_id) item_id, photo_data from inventory_item_photos order by item_id, created_at desc`),
      getInventoryPurposeList(),
      getInventoryRoomVideos(),
      getInventoryBuildingsList(),
      getInventoryRoomsList(),
      getInventoryGroupsList(),
      getInventorySubgroupsList(),
    ]);
    const txSumByItem = {};
    txRows.forEach(t => { txSumByItem[t.item_id] = (txSumByItem[t.item_id] || 0) + (Number(t.change) || 0); });
    const photoCountByItem = {};
    photoRows.forEach(p => { photoCountByItem[p.item_id] = Number(p.cnt); });
    const firstPhotoByItem = {};
    firstPhotoRows.forEach(p => { firstPhotoByItem[p.item_id] = p.photo_data; });
    items.forEach(it => {
      it.balance = (Number(it.opening_balance) || 0) + (txSumByItem[it.id] || 0);
      it.sum = it.balance * (Number(it.price) || 0);
      it.photoCount = photoCountByItem[it.id] || 0;
      it.firstPhoto = firstPhotoByItem[it.id] || null;
      it.color = detectInventoryColor(it.name);
    });
    window.__inventoryData = { items, purposeList, roomVideos, buildingsListCfg, roomsListCfg, groupsListCfg, subgroupsListCfg };

    const buildings = sortByExcelOrder([...new Set(items.map(it => it.building).filter(Boolean))]);
    const bldTabsEl = document.getElementById('inventoryBuildingTabs');
    bldTabsEl.innerHTML =
      `<div class="month-tab ${!inventoryBuilding ? 'active' : ''}" data-building="">Все здания</div>` +
      buildings.map(b => `<div class="month-tab ${b === inventoryBuilding ? 'active' : ''}" data-building="${escHtml(b)}">${escHtml(b)}</div>`).join('');
    bldTabsEl.onclick = (e) => {
      const tab = e.target.closest('.month-tab');
      if (!tab) return;
      inventoryBuilding = tab.dataset.building || null;
      loadInventory();
    };

    // "Помещение" — выпадающий список, пока не выбрано конкретное здание (все помещения во
    // всех зданиях — удобнее искать в списке). Как только выбрано здание — переключается на
    // цветные вкладки-переключатели (их в рамках одного здания немного, удобно кликать).
    const roomsSrc = inventoryBuilding ? items.filter(it => it.building === inventoryBuilding) : items;
    const rooms = sortByExcelOrder([...new Set(roomsSrc.map(it => it.room).filter(Boolean))]);
    if (rooms.length > 0 && !rooms.includes(inventoryRoom)) inventoryRoom = null;
    const roomSelectEl = document.getElementById('inventoryRoomSelect');
    const roomTabsEl = document.getElementById('inventoryRoomTabs');
    if (roomSelectEl && roomTabsEl) {
      if (inventoryBuilding) {
        roomSelectEl.style.display = 'none';
        roomTabsEl.style.display = rooms.length ? 'flex' : 'none';
        roomTabsEl.innerHTML = rooms.length === 0 ? '' :
          `<div class="month-tab ${!inventoryRoom ? 'active' : ''}" data-room="">Все помещения</div>` +
          rooms.map(r => `<div class="month-tab ${r === inventoryRoom ? 'active' : ''}" data-room="${escHtml(r)}">${escHtml(r)}</div>`).join('');
        roomTabsEl.onclick = (e) => {
          const tab = e.target.closest('.month-tab');
          if (!tab) return;
          inventoryRoom = tab.dataset.room || null;
          loadInventory();
        };
      } else {
        roomTabsEl.style.display = 'none';
        roomSelectEl.style.display = '';
        roomSelectEl.innerHTML = `<option value="">Все помещения</option>` + rooms.map(r => `<option value="${escHtml(r)}" ${r === inventoryRoom ? 'selected' : ''}>${escHtml(r)}</option>`).join('');
        roomSelectEl.onchange = () => { inventoryRoom = roomSelectEl.value || null; loadInventory(); };
      }
    }

    // "Назначение" — выпадающий фильтр по уже заполненному в таблице столбцу "Назначение"
    // (список вариантов — тот же, что заполняется через ⚙️).
    const purposeSelectEl = document.getElementById('inventoryPurposeSelect');
    if (purposeSelectEl) {
      purposeSelectEl.innerHTML = `<option value="">Все назначения</option>` + (purposeList || []).map(p => `<option value="${escHtml(p)}" ${p === inventoryPurposeFilter ? 'selected' : ''}>${escHtml(p)}</option>`).join('');
      purposeSelectEl.onchange = () => { inventoryPurposeFilter = purposeSelectEl.value || null; renderInventoryTable(window.__inventoryData); };
    }

    // 🎥 Видео — своё у каждого конкретного помещения, поэтому кнопки видны только когда
    // выбраны и здание, и помещение одновременно (иначе непонятно, к какой паре привязывать).
    // Если ссылка уже есть — "👁 Просмотр помещения" сразу открывает её в новой вкладке, без
    // захода в модалку; отдельная маленькая кнопка 🎥 — только для добавления/изменения ссылки.
    const videoOpenBtn = document.getElementById('inventoryRoomVideoOpenBtn');
    const videoEditBtn = document.getElementById('inventoryRoomVideoEditBtn');
    if (videoOpenBtn && videoEditBtn) {
      if (inventoryBuilding && inventoryRoom) {
        const videoUrl = roomVideos && roomVideos[inventoryBuilding + '::' + inventoryRoom];
        videoEditBtn.style.display = '';
        videoEditBtn.classList.toggle('active', !!videoUrl);
        videoEditBtn.title = videoUrl ? 'Изменить/удалить ссылку на видео' : 'Добавить ссылку на видео для этого помещения';
        videoEditBtn.onclick = () => openInventoryRoomVideoModal(inventoryBuilding, inventoryRoom, roomVideos);
        if (videoUrl) {
          videoOpenBtn.style.display = '';
          videoOpenBtn.onclick = () => window.open(videoUrl, '_blank', 'noopener');
        } else {
          videoOpenBtn.style.display = 'none';
        }
      } else {
        videoOpenBtn.style.display = 'none';
        videoEditBtn.style.display = 'none';
      }
    }

    // "Группа" — всегда выпадающий список (и когда выбраны все здания, и когда выбрано
    // конкретное) — список вариантов сужается по выбранному зданию.
    const groupsSrc = inventoryBuilding ? items.filter(it => it.building === inventoryBuilding) : items;
    const groups = sortByExcelOrder([...new Set(groupsSrc.map(it => it.group_name).filter(Boolean))]);
    if (groups.length > 0 && !groups.includes(inventoryGroup)) inventoryGroup = null;
    const groupSelectEl = document.getElementById('inventoryGroupSelect');
    if (groupSelectEl) {
      groupSelectEl.innerHTML = `<option value="">Все группы</option>` + groups.map(g => `<option value="${escHtml(g)}" ${g === inventoryGroup ? 'selected' : ''}>${escHtml(g)}</option>`).join('');
      groupSelectEl.onchange = () => { inventoryGroup = groupSelectEl.value || null; loadInventory(); };
    }

    renderInventoryTable(window.__inventoryData);
  } catch (err) {
    wrap.innerHTML = `<div class="status-msg err">Ошибка: ${err.message}</div>`;
  }
}

async function renderInventoryTable(data) {
  const wrap = document.getElementById('inventoryWrap');
  const search = inventorySearch.trim().toLowerCase();
  let items = data.items;
  if (inventoryBuilding) items = items.filter(it => it.building === inventoryBuilding);
  if (inventoryRoom) items = items.filter(it => it.room === inventoryRoom);
  if (inventoryGroup) items = items.filter(it => it.group_name === inventoryGroup);
  if (inventoryPurposeFilter) items = items.filter(it => (it.purpose || '') === inventoryPurposeFilter);
  if (search) items = items.filter(it => it.name.toLowerCase().includes(search));

  if (items.length === 0) {
    wrap.innerHTML = `<div class="empty-state">Ничего не найдено</div>`;
    return;
  }

  const cfg = await getColumnSettings('inventory-detail-cols');
  const hidden = new Set(cfg.hidden || []);
  // Если выбраны и конкретное здание, и конкретное помещение — столбцы "Здание"/"Помещение"
  // избыточны (они одинаковы для всех строк), скрываем автоматически — независимо от
  // настроек видимости, которые относятся к ручному выбору пользователя.
  const autoHide = new Set();
  if (inventoryBuilding && inventoryRoom) { autoHide.add('Здание'); autoHide.add('Помещение'); }

  let cols = INVENTORY_DETAIL_COLUMNS.slice();
  if (cfg.order && cfg.order.length) {
    cols.sort((a, b) => {
      const ia = cfg.order.indexOf(a.key), ib = cfg.order.indexOf(b.key);
      return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
    });
  }
  cols = cols.filter(c => !hidden.has(c.key) && !autoHide.has(c.key));
  // "Группа"/"Подгруппа" — такой же настраиваемый список через ⚙️, как здания/помещения
  // (а не просто то, что уже встречается в данных) — чтобы можно было завести новое значение
  // заранее или поправить/удалить старое.
  const unitsList = [...new Set(data.items.map(i => i.unit).filter(Boolean))].sort();
  const ctx = {
    purposeList: data.purposeList || [],
    editMode: inventoryEditMode,
    bulkMode: inventoryBulkMode,
    buildingsList: data.buildingsListCfg || [],
    roomsList: data.roomsListCfg || [],
    groupsList: data.groupsListCfg || [],
    subgroupsList: data.subgroupsListCfg || [],
    unitsList,
  };
  const alignStyle = (c) => c.align === 'right' ? 'text-align:right;' : c.align === 'center' ? 'text-align:center;' : '';

  const totalBalance = items.reduce((s, it) => s + it.balance, 0);
  const totalSum = items.reduce((s, it) => s + it.sum, 0);
  const extraCols = inventoryBulkMode ? 1 : 0;

  // Чекбокс-колонка — первая, только когда включён режим "☑️ Массовое редактирование"
  // (см. initBulkEditBar ниже). Обычное построчное редактирование (select "Назначение",
  // инпут "Комментарий", и, в режиме ✏️, базовые поля) работает само по себе, независимо
  // от того, включён ли этот режим и отмечена ли строка.
  let html = '';
  if (inventoryEditMode) {
    // Общие даталисты для автодополнения при редактировании "базовых" полей — списки берём
    // из уже загруженных данных (здание/помещение — из настроенных списков ⚙️, остальное —
    // из фактически встречающихся значений), отдельный запрос в базу не нужен.
    html += `
      <datalist id="invBuildingsDL">${ctx.buildingsList.map(v => `<option value="${escHtml(v)}">`).join('')}</datalist>
      <datalist id="invRoomsDL">${ctx.roomsList.map(v => `<option value="${escHtml(v)}">`).join('')}</datalist>
      <datalist id="invGroupsDL">${ctx.groupsList.map(v => `<option value="${escHtml(v)}">`).join('')}</datalist>
      <datalist id="invSubgroupsDL">${ctx.subgroupsList.map(v => `<option value="${escHtml(v)}">`).join('')}</datalist>
      <datalist id="invUnitsDL">${ctx.unitsList.map(v => `<option value="${escHtml(v)}">`).join('')}</datalist>
    `;
  }
  html += `<table class="data-table" id="inventoryDetailTable"><thead><tr>`;
  if (inventoryBulkMode) html += `<th data-col-key="☑" style="width:28px;"><input type="checkbox" class="bulk-select-all" data-bulk-group="inventory-detail"></th>`;
  cols.forEach(c => { html += `<th data-col-key="${escHtml(c.key)}" style="${alignStyle(c)}">${escHtml(c.key)}</th>`; });
  html += `<th data-col-key="Действия">Действия</th></tr></thead><tbody><tr class="tots-row">`;
  if (inventoryBulkMode) html += `<td></td>`;
  cols.forEach((c, idx) => {
    if (c.key === 'Остаток') html += `<td style="text-align:right;">${totalBalance}</td>`;
    else if (c.key === 'Сумма') html += `<td style="text-align:right;">${fmtMoney(totalSum)}</td>`;
    else if (idx === 0) html += `<td>Итого (${items.length})</td>`;
    else html += `<td></td>`;
  });
  html += `<td></td></tr>`;

  for (const it of items) {
    html += `<tr>`;
    if (inventoryBulkMode) html += `<td><input type="checkbox" class="bulk-row-check" data-bulk-group="inventory-detail" data-bulk-id="${it.id}"></td>`;
    cols.forEach(c => { html += `<td style="${alignStyle(c)}">${c.get(it, ctx)}</td>`; });
    html += `<td style="white-space:nowrap;">
        <button class="btn secondary inventory-writeoff-btn" data-id="${it.id}" style="padding:2px 8px;font-size:12px;">Списать</button>
        <button class="btn secondary inventory-transfer-btn" data-id="${it.id}" style="padding:2px 8px;font-size:12px;">Переместить</button>
        <button class="btn secondary inventory-history-btn" data-id="${it.id}" style="padding:2px 8px;font-size:12px;">История</button>
      </td>
    </tr>
    <tr class="inventory-history-row" data-history-for="${it.id}" style="display:none;"><td colspan="${cols.length + 1 + extraCols}"></td></tr>`;
  }
  html += '</tbody></table>';
  wrap.innerHTML = html;

  wrap.querySelectorAll('.inventory-writeoff-btn').forEach(b => {
    b.addEventListener('click', () => openInventoryWriteoffForm(b.dataset.id, data));
  });
  wrap.querySelectorAll('.inventory-transfer-btn').forEach(b => {
    b.addEventListener('click', () => openInventoryTransferForm(b.dataset.id, data));
  });
  wrap.querySelectorAll('.inventory-history-btn').forEach(b => {
    b.addEventListener('click', () => toggleInventoryHistory(b.dataset.id));
  });
  wrap.querySelectorAll('.inventory-photos-btn').forEach(b => {
    b.addEventListener('click', () => { hideInventoryPhotoPreview(); openInventoryPhotosModal(b.dataset.id, data); });
    const it = data.items.find(x => String(x.id) === String(b.dataset.id));
    if (it && it.firstPhoto) {
      b.addEventListener('mouseenter', () => showInventoryPhotoPreview(b, it));
      b.addEventListener('mouseleave', hideInventoryPhotoPreview);
    }
  });
  wrap.querySelectorAll('.inv-purpose-select').forEach(sel => {
    sel.addEventListener('change', async () => {
      try {
        await db(`update inventory_items set purpose=$1 where id=$2`, [sel.value || null, sel.dataset.id]);
        const it = data.items.find(x => String(x.id) === String(sel.dataset.id));
        if (it) it.purpose = sel.value || null;
      } catch (err) {
        alert('Ошибка сохранения назначения: ' + err.message);
      }
    });
  });
  wrap.querySelectorAll('.inv-comment-input').forEach(inp => {
    inp.addEventListener('change', async () => {
      try {
        await db(`update inventory_items set comment=$1 where id=$2`, [inp.value || null, inp.dataset.id]);
        const it = data.items.find(x => String(x.id) === String(inp.dataset.id));
        if (it) it.comment = inp.value || null;
      } catch (err) {
        alert('Ошибка сохранения комментария: ' + err.message);
      }
    });
  });
  // Режим ✏️ — исправление ошибок ввода в "базовых" полях прямо в ячейке. В отличие от
  // кнопки "Переместить" (которая создаёт операцию перемещения остатка между позициями),
  // здесь просто правится сама позиция — остаток/история операций не трогаются.
  // Пишем все 7 полей разом (как в exp-edit у Кассы) — проще и не зависит от того, какое
  // именно поле поменяли.
  wrap.querySelectorAll('.inv-base-edit').forEach(el => {
    const evt = el.tagName === 'SELECT' ? 'change' : 'blur';
    el.addEventListener(evt, async () => {
      const it = data.items.find(x => String(x.id) === String(el.dataset.id));
      if (!it) return;
      const field = el.dataset.field;
      const newVal = field === 'price' ? (Number(el.value) || 0) : el.value.trim();
      if ((field === 'building' || field === 'name') && !newVal) {
        alert(field === 'building' ? 'Здание не может быть пустым' : 'Наименование не может быть пустым');
        el.value = it[field] || '';
        return;
      }
      if (it[field] === newVal) return; // не поменялось — лишний запрос не нужен
      it[field] = newVal;
      try {
        await db(`
          update inventory_items set building=$1, room=$2, group_name=$3, subgroup=$4, name=$5, unit=$6, price=$7
          where id=$8
        `, [it.building, it.room || null, it.group_name || null, it.subgroup || null, it.name, it.unit || null, it.price || 0, it.id]);
        // Здание/помещение/группа меняют состав вкладок-фильтров и список помещений —
        // поэтому полная перезагрузка (а не точечное обновление), как и у Переместить/Списать.
        await loadInventory();
      } catch (err) {
        alert('Ошибка сохранения: ' + err.message);
        await loadInventory();
      }
    });
  });

  const table = wrap.querySelector('#inventoryDetailTable');
  await makeTableColumnsAdjustable(table, 'inventory-detail-cols', (th) => th.dataset.colKey);
  await makeTableColumnsReorderable(table, 'inventory-detail-cols', cols.map(c => c.key));

  // Массовое редактирование "Назначения" сразу у нескольких отмеченных строк — только
  // когда включён режим ☑️ (иначе чекбоксов на экране просто нет). Плашка внизу экрана
  // появляется, как только отмечена хотя бы одна строка (initBulkEditBar).
  if (inventoryBulkMode) {
    initBulkEditBar('inventory-detail', {
      getCheckboxes: () => [...wrap.querySelectorAll('.bulk-row-check[data-bulk-group="inventory-detail"]')],
      fields: [{
        label: 'Назначение',
        buildOptions: () => ['<option value="">—</option>'].concat((data.purposeList || []).map(p => `<option value="${escHtml(p)}">${escHtml(p)}</option>`)).join(''),
        onApply: async (ids, value) => {
          for (const id of ids) {
            await db(`update inventory_items set purpose=$1 where id=$2`, [value || null, id]);
            const it = data.items.find(x => String(x.id) === String(id));
            if (it) it.purpose = value || null;
          }
        },
      }],
      onAfterApply: async () => { await renderInventoryTable(data); },
    });
  } else {
    hideBulkEditBar('inventory-detail');
  }
}

      let destItem = data.items.find(it => it.building === destBuilding && (it.room || null) === destRoom
        && normalizeName(it.name) === normalizeName(item.name)
        && (it.group_name || '') === (item.group_name || '') && (it.unit || '') === (item.unit || ''));
      let destItemId;
      if (destItem) {
        destItemId = destItem.id;
      } else {
        const inserted = await db(`
          insert into inventory_items (building, room, group_name, subgroup, name, unit, price, opening_balance)
          values ($1, $2, $3, $4, $5, $6, $7, 0) returning id
        `, [destBuilding, destRoom, item.group_name, item.subgroup, item.name, item.unit, item.price]);
        destItemId = inserted[0].id;
      }
      const transferGroupId = crypto.randomUUID();
      const comment = document.getElementById('invTrComment').value;
      const destLabel = destBuilding + (destRoom ? ', ' + destRoom : '');
      const srcLabel = item.building + (item.room ? ', ' + item.room : '');
      await db(`insert into inventory_transactions (item_id, date, change, reason, comment, transfer_group_id) values ($1, current_date, $2, $3, $4, $5)`,
        [itemId, -qty, `Перемещено в «${destLabel}»`, comment, transferGroupId]);
      await db(`insert into inventory_transactions (item_id, date, change, reason, comment, transfer_group_id) values ($1, current_date, $2, $3, $4, $5)`,
        [destItemId, qty, `Перемещено из «${srcLabel}»`, comment, transferGroupId]);
      closeModal();
      await loadInventory();
    } catch (err) {
      showMsg('invTrMsg', 'Ошибка: ' + err.message, 'err');
    }
  });
}

// Фото — храним base64 прямо в базе (в портале пока нет отдельного файлового хранилища).
// ВАЖНО: перед сохранением ужимаем (длинная сторона макс. 1280px, JPEG ~82%). Сырое фото с
// телефона (несколько МБ) после кодирования в base64 раздувается ещё на треть — похоже,
// именно из-за этого где-то по пути браузер → /api/db → база обрывался/обрезался запрос, и
// фото сохранялось "битым" (баг, который словила Елена — миниатюра превращалась в нечитаемый
// узор). Сжатое фото весит на порядок меньше, этого разрешения достаточно для каталога
// позиций склада, и грузится/открывается быстрее.
function compressImageFile(file, maxSide, quality) {
  maxSide = maxSide || 1280;
  quality = quality || 0.82;
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let width = img.naturalWidth, height = img.naturalHeight;
      if (width > maxSide || height > maxSide) {
        const scale = maxSide / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Не удалось прочитать изображение — возможно, повреждённый файл')); };
    img.src = url;
  });
}
async function uploadInventoryPhotos(itemId, fileList) {
  for (const file of fileList) {
    const dataUrl = await compressImageFile(file);
    await db(`insert into inventory_item_photos (item_id, photo_data) values ($1, $2)`, [itemId, dataUrl]);
  }
}

async function loadInventoryPhotosGallery() {
  const wrap = document.getElementById('invGalWrap');
  wrap.innerHTML = 'Загрузка…';
  try {
    const rows = await db(`
      select p.id, p.item_id, p.photo_data, p.created_at,
             i.building, i.room, i.group_name, i.subgroup, i.name
      from inventory_item_photos p
      join inventory_items i on i.id = p.item_id
      order by i.building, i.room, i.group_name, i.name, p.created_at desc
    `);
    rows.forEach(r => { r.color = detectInventoryColor(r.name); });
    window.__invGalData = { rows };

    const buildings = sortByExcelOrder([...new Set(rows.map(r => r.building).filter(Boolean))]);
    const bldEl = document.getElementById('invGalBuildingTabs');
    bldEl.innerHTML = buildings.length === 0 ? '' :
      `<div class="month-tab ${!invGalBuilding ? 'active' : ''}" data-building="">Все здания</div>` +
      buildings.map(b => `<div class="month-tab ${b === invGalBuilding ? 'active' : ''}" data-building="${escHtml(b)}">${escHtml(b)}</div>`).join('');
    bldEl.onclick = (e) => { const t = e.target.closest('.month-tab'); if (!t) return; invGalBuilding = t.dataset.building || null; loadInventoryPhotosGallery(); };

    const roomsSrc = invGalBuilding ? rows.filter(r => r.building === invGalBuilding) : rows;
    const rooms = sortByExcelOrder([...new Set(roomsSrc.map(r => r.room).filter(Boolean))]);
    const roomEl = document.getElementById('invGalRoomTabs');
    roomEl.innerHTML = rooms.length === 0 ? '' :
      `<div class="month-tab ${!invGalRoom ? 'active' : ''}" data-room="">Все помещения</div>` +
      rooms.map(r => `<div class="month-tab ${r === invGalRoom ? 'active' : ''}" data-room="${escHtml(r)}">${escHtml(r)}</div>`).join('');
    roomEl.onclick = (e) => { const t = e.target.closest('.month-tab'); if (!t) return; invGalRoom = t.dataset.room || null; loadInventoryPhotosGallery(); };

    const groups = sortByExcelOrder([...new Set(rows.map(r => r.group_name).filter(Boolean))]);
    const groupEl = document.getElementById('invGalGroupTabs');
    groupEl.innerHTML = groups.length === 0 ? '' :
      `<div class="month-tab ${!invGalGroup ? 'active' : ''}" data-group="">Все группы</div>` +
      groups.map(g => `<div class="month-tab ${g === invGalGroup ? 'active' : ''}" data-group="${escHtml(g)}">${escHtml(g)}</div>`).join('');
    groupEl.onclick = (e) => { const t = e.target.closest('.month-tab'); if (!t) return; invGalGroup = t.dataset.group || null; loadInventoryPhotosGallery(); };

    // Цвета — по тем же наименованиям, что определились выше (detectInventoryColor);
    // показываем только реально встречающиеся, в их фирменном цвете на вкладке.
    const colorsPresent = [...new Set(rows.map(r => r.color && r.color.label).filter(Boolean))];
    const colorEl = document.getElementById('invGalColorTabs');
    colorEl.innerHTML = colorsPresent.length === 0 ? '' :
      `<div class="month-tab ${!invGalColor ? 'active' : ''}" data-color="">Все цвета</div>` +
      colorsPresent.map(c => {
        const hex = (INVENTORY_COLOR_MAP.find(([, label]) => label === c) || [])[2] || '#999';
        return `<div class="month-tab ${c === invGalColor ? 'active' : ''}" data-color="${escHtml(c)}" style="display:flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;border-radius:50%;background:${hex};border:1px solid var(--border2);display:inline-block;"></span>${escHtml(c)}</div>`;
      }).join('');
    colorEl.onclick = (e) => { const t = e.target.closest('.month-tab'); if (!t) return; invGalColor = t.dataset.color || null; loadInventoryPhotosGallery(); };

    renderInventoryPhotosGallery(window.__invGalData);
  } catch (err) {
    wrap.innerHTML = `<div class="status-msg err">Ошибка: ${err.message}</div>`;
  }
}

function renderInventoryPhotosGallery(data) {
  const wrap = document.getElementById('invGalWrap');
  const search = invGalSearch.trim().toLowerCase();
  let rows = data.rows;
  if (invGalBuilding) rows = rows.filter(r => r.building === invGalBuilding);
  if (invGalRoom) rows = rows.filter(r => r.room === invGalRoom);
  if (invGalGroup) rows = rows.filter(r => r.group_name === invGalGroup);
  if (invGalColor) rows = rows.filter(r => r.color && r.color.label === invGalColor);
  if (search) rows = rows.filter(r => r.name.toLowerCase().includes(search));

  if (rows.length === 0) {
    wrap.innerHTML = `<div class="empty-state">Фото не найдено</div>`;
    return;
  }
  wrap.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:14px;">
    ${rows.map(r => `
      <div style="width:160px;">
        <img src="${escHtml(r.photo_data)}" onerror="${INVENTORY_PHOTO_ONERROR}" class="inv-gal-photo" data-src="${escHtml(r.photo_data)}" style="width:160px;height:160px;object-fit:cover;border-radius:8px;cursor:pointer;display:block;margin-bottom:6px;border:1px solid var(--border2);">
        <div style="font-size:12.5px;font-weight:600;line-height:1.3;">${escHtml(r.name)}</div>
        <div style="font-size:11.5px;color:var(--text3);line-height:1.3;">${escHtml(r.building || '')}${r.room ? ', ' + escHtml(r.room) : ''}${r.group_name ? ' — ' + escHtml(r.group_name) : ''}</div>
      </div>
    `).join('')}
  </div>`;
  wrap.querySelectorAll('.inv-gal-photo').forEach(img => {
    img.addEventListener('click', () => openImageLightbox(img.dataset.src));
  });
}

let meterFilterBuilding = null;
let meterEditMode = false;

  const allBuildings = await getAllBuildings();
  main.innerHTML = `

async function loadMeters() {
  const wrap = document.getElementById('metersWrap');
  wrap.innerHTML = 'Загрузка…';
  try {
    const rows = await db(`
      select id, property, meter_name, unit_code, meter_type, reading_start, reading_end, tariff, amount, paid_owner, paid_tenant
      from meter_readings
      where period = $1
      order by property, meter_name
    `, [meterFilterPeriod]);

    let buildings = sortByExcelOrder([...new Set(rows.map(r => r.property))]);
    const buildingTabsEl = document.getElementById('meterBuildingTabs');
    function renderBuildingTabs() {
      buildingTabsEl.innerHTML =
        `<div class="month-tab ${!meterFilterBuilding ? 'active' : ''}" data-building="">Все здания</div>` +
        buildings.map(b => `<div class="month-tab ${b === meterFilterBuilding ? 'active' : ''}" data-building="${escHtml(b)}">${escHtml(b)}</div>`).join('');
    }
    renderBuildingTabs();
    buildingTabsEl.addEventListener('click', (e) => {
      const tab = e.target.closest('.month-tab');
      if (!tab) return;
      meterFilterBuilding = tab.dataset.building || null;
      renderBuildingTabs();
      renderMeterRows(visibleRows());
    });

    function visibleRows() {
      return meterFilterBuilding ? rows.filter(r => r.property === meterFilterBuilding) : rows;
    }

    if (rows.length === 0) {
      wrap.innerHTML = `<div class="empty-state">За ${periodLabel(meterFilterPeriod)} показаний ещё нет.</div>`;
      return;
    }
    renderMeterRows(visibleRows());

    function renderMeterRows(visRows) {
      if (visRows.length === 0) {
        wrap.innerHTML = `<div class="empty-state">По этому зданию показаний нет.</div>`;
        return;
      }
      const sum = { amount: 0, paid_owner: 0, paid_tenant: 0 };
      visRows.forEach(r => {
        sum.amount += Number(r.amount) || 0;
        sum.paid_owner += Number(r.paid_owner) || 0;
        sum.paid_tenant += Number(r.paid_tenant) || 0;
      });
      let html = `<table class="data-table compact-table"><thead><tr>
        <th>Здание</th><th>Счётчик</th><th>Помещение</th><th>Тип</th><th>Было${meterEditMode ? ' ✏️' : ''}</th><th>Стало${meterEditMode ? ' ✏️' : ''}</th><th>Тариф${meterEditMode ? ' ✏️' : ''}</th><th class="bh">Начислено</th><th class="gh">Опл. собственник${meterEditMode ? ' ✏️' : ''}</th><th class="gh">Опл. арендатор${meterEditMode ? ' ✏️' : ''}</th><th class="rh">Долг</th><th></th>
      </tr></thead><tbody>
      <tr class="tots-row"><td colspan="7">Итого (${visRows.length})</td><td>${fmtMoney(sum.amount)}</td><td>${fmtMoney(sum.paid_owner)}</td><td>${fmtMoney(sum.paid_tenant)}</td><td>${fmtMoney(sum.amount - sum.paid_owner - sum.paid_tenant)}</td><td></td></tr>`;
      for (const r of visRows) {
        const amount = Number(r.amount) || 0;
        const debt = amount - (Number(r.paid_owner) || 0) - (Number(r.paid_tenant) || 0);
        html += `<tr data-id="${r.id}">
          <td>${escHtml(r.property)}</td>
          <td>${escHtml(r.meter_name || '')}</td>
          <td>${escHtml(r.unit_code || '')}</td>
          <td>${escHtml(r.meter_type || '')}</td>
          <td>${meterEditMode ? `<input type="number" class="meter-edit" data-field="reading_start" value="${r.reading_start ?? ''}" style="width:80px;">` : (r.reading_start ?? '—')}</td>
          <td>${meterEditMode ? `<input type="number" class="meter-edit" data-field="reading_end" value="${r.reading_end ?? ''}" style="width:80px;">` : (r.reading_end ?? '—')}</td>
          <td>${meterEditMode ? `<input type="number" class="meter-edit" data-field="tariff" value="${r.tariff ?? ''}" style="width:70px;">` : (r.tariff ?? '—')}</td>
          <td>${r.amount != null ? fmtMoney(r.amount) : '<span style="color:#9ca3af">нет «стало»</span>'}</td>
          <td>${meterEditMode ? `<input type="number" class="meter-edit" data-field="paid_owner" value="${r.paid_owner ?? 0}" style="width:80px;">` : fmtMoney(r.paid_owner)}</td>
          <td>${meterEditMode ? `<input type="number" class="meter-edit" data-field="paid_tenant" value="${r.paid_tenant ?? 0}" style="width:80px;">` : fmtMoney(r.paid_tenant)}</td>
          <td class="${debt > 0 ? 'debt-positive' : 'debt-zero'}">${fmtMoney(debt)}</td>
          <td>${meterEditMode ? '<button class="row-delete-btn meter-delete-btn" title="Удалить">✕</button>' : ''}</td>
        </tr>`;
      }
      html += '</tbody></table>';
      wrap.innerHTML = html;

      wrap.querySelectorAll('.meter-edit').forEach(input => {
        input.addEventListener('blur', async () => {
          const tr = input.closest('tr');
          const id = tr.dataset.id;
          const row = rows.find(r => r.id === id);
          if (!row) return;
          const field = input.dataset.field;
          row[field] = input.value === '' ? null : Number(input.value);
          if (row.reading_start != null && row.reading_end != null && row.tariff != null) {
            row.amount = (row.reading_end - row.reading_start) * row.tariff;
          }
          try {
            await db(`update meter_readings set reading_start=$2, reading_end=$3, tariff=$4, amount=$5, paid_owner=$6, paid_tenant=$7 where id=$1`,
              [id, row.reading_start, row.reading_end, row.tariff, row.amount, row.paid_owner || 0, row.paid_tenant || 0]);
            showMsg('metersMsg', 'Сохранено', 'ok');
            renderMeterRows(visibleRows());
          } catch (err) {
            showMsg('metersMsg', 'Ошибка: ' + err.message, 'err');
          }
        });
      });

      wrap.querySelectorAll('.meter-delete-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const tr = e.target.closest('tr');
          const id = tr.dataset.id;
          try {
            await db(`delete from meter_readings where id=$1`, [id]);
            showMsg('metersMsg', 'Удалено', 'ok');
            loadMeters();
          } catch (err) {
            showMsg('metersMsg', 'Ошибка: ' + err.message, 'err');
          }
        });
      });
    }
  } catch (err) {
    wrap.innerHTML = `<div class="status-msg err">Ошибка: ${err.message}</div>`;
  }
}

async function syncTenants(silent) {
  const btn = document.getElementById('syncBtn');
  if (!silent) { btn.disabled = true; btn.textContent = 'Синхронизация…'; }
  try {
    const resp = await fetch('/api/sync-tenants', { method: 'POST' });
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    if (!silent || data.added > 0 || data.archived > 0 || data.restored > 0 || data.removedLinks > 0 || data.deleted > 0 || data.cleanupSkipped) {
      showMsg('tenantsMsg', `Добавлено: ${data.added}, обновлено: ${data.updated}, в архив: ${data.archived}, восстановлено: ${data.restored}${data.deleted ? `, удалено насовсем из CRM: ${data.deleted}` : ''}${data.removedLinks ? `, убрано устаревших связок с объектами: ${data.removedLinks}` : ''}${data.cleanupSkipped ? ' ⚠️ Чистка устаревших связок пропущена — ответ CRM выглядел неполным' : ''}`, data.cleanupSkipped ? 'err' : 'ok');
    }
    delete sessionDataCache.__activeTenants; // список арендаторов мог измениться
    tenantsByBuildingCache = null;
    cachedBuildingMap = null;
    allBuildingsCache = null;
    realCrmBuildingsCache = null;
    invalidateArendaHistoryCache(); // теперь эта история включает и список арендаторов/объектов
    await loadTenantsTable();
  } catch (err) {
    if (!silent) showMsg('tenantsMsg', 'Ошибка синхронизации: ' + err.message, 'err');
  } finally {
    if (!silent) { btn.disabled = false; btn.textContent = '🔄 Обновить из CRM'; }
  }
}

async function loadTenantsTable() {
  const showArchived = document.getElementById('showArchived').checked;
  const wrap = document.getElementById('tenantsWrap');
  const countEl = document.getElementById('tenantsCount');
  wrap.innerHTML = 'Загрузка…';
  try {
    const counts = await db(`
      select
        count(*) filter (where status='active')   as active_count,
        count(*) filter (where status='archived') as archived_count
      from tenants_sync
    `);
    if (countEl && counts.length > 0) {
      const { active_count, archived_count } = counts[0];
      countEl.textContent = `— активных: ${active_count}, в архиве: ${archived_count}`;
    }

    // Арендаторов берём согласно фильтру (все активные, либо все архивные) — это то,
    // что реально показываем построчно. А вот количество ОБЪЕКТОВ в шапке каждого
    // здания считаем по ВСЕМ tenant_objects без учёта фильтра — чтобы число объектов
    // всегда совпадало с CRM, независимо от того, что сейчас выбрано в фильтре.
    const [allRows, tenantObjRows] = await Promise.all([
      db(`
        select t.id as tenant_id, t.name, t.tenant_type, t.crm_object_name, t.crm_office, t.status, t.last_synced_at, t.created_at,
          (select date from tenant_archive_log where tenant_id=t.id and action='archived' order by date desc limit 1) as archived_date
        from tenants_sync t
        ${showArchived ? "where t.status='archived'" : "where t.status='active'"}
        order by t.name
      `),
      db(`select tenant_id, id as tenant_object_id, object_name, office, building from tenant_objects`),
    ]);
    const tenantToObjectId = {};
    const tenantToBuilding = {};
    tenantObjRows.forEach(r => { if (!tenantToObjectId[r.tenant_id]) { tenantToObjectId[r.tenant_id] = r.tenant_object_id; tenantToBuilding[r.tenant_id] = r.building; } });
    const buildingMap = await getTenantObjectBuildingMap();
    allRows.forEach(r => { r.building = resolveBuilding(tenantToBuilding[r.tenant_id], buildingMap, tenantToObjectId[r.tenant_id], r.crm_object_name); });

    // Сводка по зданиям — считаем по ВСЕМ объектам (не только первому на арендатора,
    // как в строках списка), чтобы точно отражать реальное число помещений, как на
    // странице "Здания" в самой CRM. Арендатор с несколькими объектами засчитывается
    // в "объектах" несколько раз, но в "арендаторах" — один.
    const buildingStats = {};
    tenantObjRows.forEach(r => {
      const b = resolveBuilding(r.building, buildingMap, r.tenant_object_id, null);
      if (!buildingStats[b]) buildingStats[b] = { objectCount: 0, tenantIds: new Set() };
      buildingStats[b].objectCount++;
      buildingStats[b].tenantIds.add(r.tenant_id);
    });
    let buildings = sortByExcelOrder(Object.keys(buildingStats).filter(b => b !== 'Не определено'));
    if (buildingStats['Не определено']) buildings.push('Не определено');
    buildings = await applySavedTabOrder('tenants-buildings', buildings);
    const totalObjects = Object.values(buildingStats).reduce((s, v) => s + v.objectCount, 0);
    const totalTenantsAllObjects = new Set(tenantObjRows.map(r => r.tenant_id)).size;

    if (allRows.length === 0) {
      wrap.innerHTML = `<div class="empty-state">Арендаторов пока нет. Нажми «Обновить из CRM», чтобы загрузить их.</div>`;
      return;
    }

    const now = Date.now();
    const NEW_HIGHLIGHT_DAYS = 7;
    function tenantRowHtml(r, building) {
      const dt = r.last_synced_at ? new Date(r.last_synced_at).toLocaleString('ru-RU') : '—';
      const isNew = r.created_at && (now - new Date(r.created_at).getTime()) < NEW_HIGHLIGHT_DAYS * 86400000;
      const rowStyle = r.status === 'archived' ? 'background:var(--red-bg);' : (isNew ? 'background:var(--green-bg);' : '');
      let statusExtra = '';
      if (r.status === 'archived' && r.archived_date) {
        const archMonth = r.archived_date.slice(0, 7);
        const nextMonth = shiftPeriod(archMonth, 1);
        statusExtra = `<div style="font-size:11px;color:var(--red);margin-top:2px;">выехал ${new Date(r.archived_date).toLocaleDateString('ru-RU')} — не числится с ${periodLabel(nextMonth)}</div>`;
      }
      return `<tr data-building-sub="${escHtml(building)}" style="display:none;${rowStyle}">
        <td style="padding-left:28px;">${r.name}${isNew ? ' <span class="badge" style="background:var(--green);color:#fff;">🆕 Новый</span>' : ''}</td>
        <td>${r.tenant_type || ''}</td>
        <td>${r.crm_object_name || ''} ${r.crm_office || ''}</td>
        <td><span class="badge ${r.status}">${r.status === 'active' ? 'Активен' : 'Архив'}</span>${statusExtra}</td>
        <td>${dt}</td>
      </tr>`;
    }

    let html = `<table class="data-table"><thead><tr>
      <th>Здание / Имя</th><th>Тип</th><th>Объект</th><th>Статус</th><th>Синхронизировано</th>
    </tr></thead><tbody>
      <tr class="tots-row"><td>Итого (как в CRM)</td><td colspan="2">${totalObjects} объектов, ${totalTenantsAllObjects} арендаторов</td><td colspan="2"></td></tr>`;
    for (const b of buildings) {
      const stats = buildingStats[b];
      const bTenantRows = allRows.filter(r => r.building === b);
      html += `<tr class="tenants-building-toggle" data-building-toggle="${escHtml(b)}" style="cursor:pointer;background:var(--surface2);">
        <td><span class="metric-arrow">▸</span> <strong>${escHtml(b)}</strong>${b === 'Не определено' ? ' ⚠️' : ''}</td>
        <td colspan="2">${stats.objectCount} объектов, ${stats.tenantIds.size} арендаторов (показано: ${bTenantRows.length})</td>
        <td colspan="2"></td>
      </tr>`;
      for (const r of bTenantRows) html += tenantRowHtml(r, b);
    }
    html += '</tbody></table>';
    wrap.innerHTML = html;

    wrap.querySelectorAll('.tenants-building-toggle').forEach(tr => {
      tr.addEventListener('click', () => {
        const b = tr.dataset.buildingToggle;
        const subRows = wrap.querySelectorAll(`[data-building-sub="${CSS.escape(b)}"]`);
        const arrow = tr.querySelector('.metric-arrow');
        const isOpen = subRows.length && subRows[0].style.display !== 'none';
        subRows.forEach(sr => { sr.style.display = isOpen ? 'none' : ''; });
        if (arrow) arrow.textContent = isOpen ? '▸' : '▾';
      });
    });
  } catch (err) {
    wrap.innerHTML = `<div class="status-msg err">Ошибка: ${err.message}</div>`;
  }
}

// Порядок зданий — как они реально идут в самом Excel-файле, не по алфавиту
const RENT_PROPERTY_ORDER = [
  '2-я Дачная', '2-я Дачная (2)', 'Сенной', 'Строителей 2', 'Шехурдина 28',
  'Октябрьская 71', 'Луговая', 'Танкистов', 'Выселочная', 'Выселочная -16/18/15',
];
function sortByExcelOrder(properties) {
  return properties.slice().sort((a, b) => {
    const sa = a || 'Не определено здание';
    const sb = b || 'Не определено здание';
    const ia = RENT_PROPERTY_ORDER.indexOf(sa);
    const ib = RENT_PROPERTY_ORDER.indexOf(sb);
    if (ia === -1 && ib === -1) return sa.localeCompare(sb);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
}

// Распознаёт здание по названию объекта из CRM (там нет отдельного чистого поля "здание",
// только object_name текстом) — ищем совпадение по ключевым словам известных зданий.
const BUILDING_KEYWORDS = [
  ['2-я Дачная', ['дачная', '2-я дач']],
  ['Сенной', ['сенной']],
  ['Строителей 2', ['строител']],
  ['Шехурдина 28', ['шехурдин']],
  ['Октябрьская 71', ['октябрьск']],
  ['Луговая', ['луговая']],
  ['Танкистов', ['танкист']],
  ['Выселочная -16/18/15', ['16/18/15', 'выселочная -16', 'выселочная-16']],
  ['Выселочная', ['выселочная', 'выселки']],
];
function guessBuilding(objectName) {
  if (!objectName) return 'Не определено';
  const s = objectName.toLowerCase();
  for (const [name, keys] of BUILDING_KEYWORDS) {
    if (keys.some(k => s.includes(k))) return name;
  }
  return 'Не определено';
}

// Раньше здесь был запасной вариант через сопоставление с Excel-снимком (таблица
// excel_snapshot) — сам раздел "По Excel" и таблица удалены, реальное здание теперь
// всегда приходит напрямую из CRM через resolveBuilding(realBuilding, ...). Эта карта
// оставлена пустой для обратной совместимости мест, которые её ещё запрашивают —
// в качестве последнего резерва там используется guessBuilding() по ключевым словам.
let cachedBuildingMap = null;
async function getTenantObjectBuildingMap() {
  return cachedBuildingMap || {};
}
// Здание теперь в первую очередь берём напрямую из CRM (поле objects.type, прилетает через
// синхронизацию как tenant_objects.building) — это настоящий источник истины. Старые способы
// (сопоставление с Excel-снимком, угадывание по ключевым словам в названии) остаются только
// как запасной вариант — например, для объектов, которые ещё не переcинхронизированы.
// manualOverrides (необязательный параметр) — ручные привязки из Сводки для арендаторов,
// у которых в CRM вообще нет ни одного объекта (см. getManualBuildingOverrides) — стоят
// ПОСЛЕ tenantObjectId/buildingMap (у объекта из CRM всегда приоритет), но ПЕРЕД угадыванием
// по ключевым словам, так как это осознанный выбор человека, а не догадка.
function resolveBuilding(realBuilding, buildingMap, tenantObjectId, objectName, tenantId, manualOverrides) {
  if (realBuilding) return realBuilding;
  if (tenantObjectId && buildingMap[tenantObjectId]) return buildingMap[tenantObjectId];
  if (tenantId && manualOverrides && manualOverrides[tenantId]) return manualOverrides[tenantId];
  return guessBuilding(objectName);
}

// Из полного адреса объекта оставляем только часть про этаж/офис — здание и так понятно
// из того, в какой группе/списке показана строка, полный адрес только загромождает вид.
function shortObjectLabel(fullText) {
  if (!fullText) return '—';
  const idx = fullText.toLowerCase().indexOf('этаж');
  return idx >= 0 ? fullText.slice(idx) : fullText;
}

// object_name из CRM иногда уже содержит номер офиса в конце текста, а поле office
// дублирует то же самое число отдельно — склеиваем их с проверкой, чтобы не получалось
// "...ОФ №15 15". Если object_name уже заканчивается на office — просто не добавляем его.
function combineObjectFields(objectName, office) {
  const name = (objectName || '').trim();
  const off = (office != null ? String(office) : '').trim();
  if (!name) return off;
  if (!off) return name;
  if (name.toLowerCase().endsWith(off.toLowerCase())) return name;
  return `${name} ${off}`;
}

// Кэш настроек столбцов в памяти на время сессии — по одному объекту на tableId
const columnSettingsCache = {};

async function getColumnSettings(tableId) {
  if (columnSettingsCache[tableId]) return columnSettingsCache[tableId];
  try {
    const rows = await db(`select value from settings where key=$1`, [`colsettings_${tableId}`]);
    columnSettingsCache[tableId] = rows.length > 0 ? rows[0].value : { widths: {}, hidden: [] };
  } catch (e) {
    columnSettingsCache[tableId] = { widths: {}, hidden: [] };
  }
  return columnSettingsCache[tableId];
}
async function saveColumnSettings(tableId, cfg) {
  columnSettingsCache[tableId] = cfg;
  await db(`
    insert into settings (key, value) values ($1, $2)
    on conflict (key) do update set value = $2, updated_at = now()
  `, [`colsettings_${tableId}`, JSON.stringify(cfg)]);
}

// Делает вкладки-таблетки (здания, счета и т.п.) перетаскиваемыми — порядок сохраняется
// в базу под ключом storageKey.
async function applySavedTabOrder(storageKey, items) {
  try {
    const rows = await db(`select value from settings where key=$1`, [`tab_order_${storageKey}`]);
    if (rows.length > 0 && Array.isArray(rows[0].value)) {
      const saved = rows[0].value;
      const knownSet = new Set(items);
      const ordered = saved.filter(s => knownSet.has(s));
      const extra = items.filter(i => !ordered.includes(i));
      return [...ordered, ...extra];
    }
  } catch (e) { /* порядок ещё не сохранён — используем как есть */ }
  return items;
}
function makeTabsDraggable(containerEl, storageKey, onReorder) {
  if (!containerEl || containerEl.dataset.dragBound) return;
  containerEl.dataset.dragBound = '1';
  let dragEl = null;
  containerEl.addEventListener('dragstart', (e) => {
    const tab = e.target.closest('.month-tab, .pill-btn');
    if (!tab) return;
    dragEl = tab;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => tab.style.opacity = '0.4', 0);
  });
  containerEl.addEventListener('dragend', (e) => {
    const tab = e.target.closest('.month-tab, .pill-btn');
    if (tab) tab.style.opacity = '';
    dragEl = null;
  });
  containerEl.addEventListener('dragover', (e) => {
    e.preventDefault();
    const target = e.target.closest('.month-tab, .pill-btn');
    if (!target || target === dragEl || !dragEl) return;
    const rect = target.getBoundingClientRect();
    const before = (e.clientX - rect.left) < rect.width / 2;
    target.parentElement.insertBefore(dragEl, before ? target : target.nextSibling);
  });
  containerEl.addEventListener('drop', async (e) => {
    e.preventDefault();
    const newOrder = [...containerEl.children].map(el => el.dataset.tabValue).filter(Boolean);
    await db(`
      insert into settings (key, value) values ($1, $2)
      on conflict (key) do update set value = $2, updated_at = now()
    `, [`tab_order_${storageKey}`, JSON.stringify(newOrder)]);
    if (onReorder) onReorder(newOrder);
  });
}
function bindDraggableTabs(containerEl) {
  if (!containerEl) return;
  containerEl.querySelectorAll('.month-tab, .pill-btn').forEach(tab => { tab.draggable = true; });
}

// Делает столбцы таблицы регулируемыми и скрываемыми, с сохранением в базу по tableId.
async function makeTableColumnsAdjustable(table, tableId, columnKeyFn) {
  if (!table || !tableId) return;
  const headRow = table.querySelector('thead tr:last-child');
  if (!headRow) return;
  const cfg = await getColumnSettings(tableId);
  const keyFn = columnKeyFn || ((th, i) => (th.textContent || '').trim().replace(/[▲▼✏️]/g, '').trim() || ('col' + i));

  const ths = [...headRow.querySelectorAll('th')];
  ths.forEach((th, i) => {
    const key = keyFn(th, i);
    th.dataset.colKey = key;
    if (cfg.hidden && cfg.hidden.includes(key)) {
      th.style.display = 'none';
      const colIdx = [...th.parentElement.children].indexOf(th);
      table.querySelectorAll('tbody tr').forEach(tr => {
        if (tr.children[colIdx]) tr.children[colIdx].style.display = 'none';
      });
    }
    if (cfg.widths && cfg.widths[key]) {
      th.style.width = cfg.widths[key] + 'px';
      th.style.minWidth = cfg.widths[key] + 'px';
      th.style.maxWidth = cfg.widths[key] + 'px';
    }
    if (getComputedStyle(th).position === 'static') th.style.position = 'relative';

    if (!th.querySelector('.col-resize-handle')) {
      const handle = document.createElement('div');
      handle.className = 'col-resize-handle';
      handle.style.cssText = 'position:absolute;top:0;right:0;width:6px;height:100%;cursor:col-resize;user-select:none;z-index:4;';
      th.appendChild(handle);
      handle.addEventListener('mousedown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const startX = e.pageX;
        const startWidth = th.offsetWidth;
        function onMove(e2) {
          const newWidth = Math.max(40, startWidth + (e2.pageX - startX));
          th.style.width = newWidth + 'px';
          th.style.minWidth = newWidth + 'px';
          th.style.maxWidth = newWidth + 'px';
        }
        async function onUp() {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          const c = await getColumnSettings(tableId);
          c.widths = c.widths || {};
          c.widths[key] = th.offsetWidth;
          await saveColumnSettings(tableId, c);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    }
  });
}

// Делает столбцы таблицы перетаскиваемыми местами (порядок сохраняется в cfg.order,
// рядом с widths/hidden — та же запись в settings по tableId). Перетаскивать можно только
// столбцы из reorderableKeys — закреплённый служебный столбец ("Действия") туда не входит
// и всегда остаётся последним.
async function makeTableColumnsReorderable(table, tableId, reorderableKeys) {
  if (!table || !tableId) return;
  const headRow = table.querySelector('thead tr:last-child');
  if (!headRow) return;
  const reorderable = new Set(reorderableKeys || []);
  let dragTh = null;
  [...headRow.querySelectorAll('th')].forEach(th => {
    const key = th.dataset.colKey;
    if (!key || !reorderable.has(key)) return;
    th.draggable = true;
    th.style.cursor = 'grab';
    th.addEventListener('dragstart', (e) => {
      dragTh = th;
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => { th.style.opacity = '0.4'; }, 0);
    });
    th.addEventListener('dragend', () => { th.style.opacity = ''; dragTh = null; });
    th.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (!dragTh || dragTh === th) return;
      const rect = th.getBoundingClientRect();
      const before = (e.clientX - rect.left) < rect.width / 2;
      th.parentElement.insertBefore(dragTh, before ? th : th.nextSibling);
    });
    th.addEventListener('drop', async (e) => {
      e.preventDefault();
      const newOrder = [...headRow.querySelectorAll('th')].map(t => t.dataset.colKey).filter(Boolean);
      const c = await getColumnSettings(tableId);
      c.order = newOrder;
      await saveColumnSettings(tableId, c);
      if (typeof window.__reloadCurrentTable === 'function') window.__reloadCurrentTable();
    });
  });
}

// Кнопка "👁️ Столбцы" — открывает список всех столбцов таблицы, скрытые можно вернуть
async function showColumnVisibilityMenu(tableId, allColumnKeys, anchorEl) {
  const cfg = await getColumnSettings(tableId);
  const existing = document.getElementById('colVisMenu');
  if (existing) existing.remove();
  const menu = document.createElement('div');
  menu.id = 'colVisMenu';
  menu.style.cssText = 'position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.15);padding:10px;z-index:9999;min-width:180px;';
  const rect = anchorEl.getBoundingClientRect();
  menu.style.top = (rect.bottom + window.scrollY + 4) + 'px';
  menu.style.left = (rect.left + window.scrollX) + 'px';
  menu.innerHTML = allColumnKeys.map(key => {
    const isHidden = (cfg.hidden || []).includes(key);
    return `<label style="display:flex;align-items:center;gap:8px;padding:4px 2px;font-size:13px;cursor:pointer;">
      <input type="checkbox" class="col-vis-checkbox" data-key="${escHtml(key)}" ${isHidden ? '' : 'checked'}>
      ${escHtml(key)}
    </label>`;
  }).join('');
  document.body.appendChild(menu);
  menu.querySelectorAll('.col-vis-checkbox').forEach(cb => {
    cb.addEventListener('change', async () => {
      const c = await getColumnSettings(tableId);
      c.hidden = c.hidden || [];
      if (cb.checked) c.hidden = c.hidden.filter(k => k !== cb.dataset.key);
      else if (!c.hidden.includes(cb.dataset.key)) c.hidden.push(cb.dataset.key);
      await saveColumnSettings(tableId, c);
      menu.remove();
      if (typeof window.__reloadCurrentTable === 'function') window.__reloadCurrentTable();
    });
  });
  setTimeout(() => {
    document.addEventListener('click', function onDocClick(e) {
      if (!menu.contains(e.target) && e.target !== anchorEl) {
        menu.remove();
        document.removeEventListener('click', onDocClick);
      }
    });
  }, 10);
}

// ============================================================
// Массовое редактирование — чекбоксы у строк + плавающая плашка "применить ко всем
// выбранным", для любой таблицы с редактируемым select-столбцом. Не заменяет обычное
// построчное редактирование (тот же select в ячейке продолжает работать как раньше для
// одной строки) — это ДОПОЛНИТЕЛЬНЫЙ способ поменять значение сразу у многих строк.
// Каждая страница сама добавляет чекбокс-колонку в разметку таблицы (структуры разные),
// а эти функции только отслеживают выбор и рисуют/обрабатывают плашку применения.
// ============================================================
const bulkEditState = {}; // { [groupId]: Set<rowId> }

// options:
//   getCheckboxes: () => массив <input type=checkbox class="bulk-row-check" data-bulk-id="...">
//   fields: [{ label, buildOptions: () => '<option>…', onApply: async (ids, value) => {} }]
//   onAfterApply: async () => {}  — перерисовать таблицу (используется и после применения, и после "снять выделение")
function initBulkEditBar(groupId, options) {
  const checkboxes = options.getCheckboxes();
  bulkEditState[groupId] = bulkEditState[groupId] || new Set();
  const selected = bulkEditState[groupId];
  // Если после перезагрузки/смены фильтра строка пропала с экрана — её id из выбора убираем.
  const presentIds = new Set(checkboxes.map(cb => cb.dataset.bulkId));
  [...selected].forEach(id => { if (!presentIds.has(id)) selected.delete(id); });

  checkboxes.forEach(cb => {
    cb.checked = selected.has(cb.dataset.bulkId);
    cb.addEventListener('change', () => {
      if (cb.checked) selected.add(cb.dataset.bulkId);
      else selected.delete(cb.dataset.bulkId);
      renderBulkEditBar(groupId, options);
    });
  });
  const selectAllCb = document.querySelector(`.bulk-select-all[data-bulk-group="${groupId}"]`);
  if (selectAllCb) {
    selectAllCb.checked = checkboxes.length > 0 && checkboxes.every(cb => selected.has(cb.dataset.bulkId));
    selectAllCb.onchange = () => {
      checkboxes.forEach(cb => {
        cb.checked = selectAllCb.checked;
        if (selectAllCb.checked) selected.add(cb.dataset.bulkId); else selected.delete(cb.dataset.bulkId);
      });
      renderBulkEditBar(groupId, options);
    };
  }
  renderBulkEditBar(groupId, options);
}

function hideBulkEditBar(groupId) {
  const bar = document.getElementById(`bulkEditBar_${groupId}`);
  if (bar) bar.remove();
}

function renderBulkEditBar(groupId, options) {
  const selected = bulkEditState[groupId] || new Set();
  let bar = document.getElementById(`bulkEditBar_${groupId}`);
  if (selected.size === 0) {
    if (bar) bar.remove();
    return;
  }
  if (!bar) {
    bar = document.createElement('div');
    bar.id = `bulkEditBar_${groupId}`;
    bar.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 28px rgba(0,0,0,.25);padding:10px 16px;z-index:5000;display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:92vw;';
    document.body.appendChild(bar);
  }
  bar.innerHTML = `
    <div style="font-weight:600;font-size:13px;">Выбрано: ${selected.size}</div>
    ${options.fields.map((f, fi) => `
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="font-size:12.5px;color:var(--text3);">${escHtml(f.label)}:</span>
        <select class="bulk-apply-select" data-field-idx="${fi}" style="font-size:12.5px;">${f.buildOptions()}</select>
        <button class="btn secondary bulk-apply-btn" data-field-idx="${fi}" style="padding:2px 10px;font-size:12px;">Применить</button>
      </div>
    `).join('')}
    <button class="btn secondary" id="bulkClear_${groupId}" style="padding:2px 10px;font-size:12px;">Снять выделение</button>
    <div id="bulkMsg_${groupId}" style="font-size:12px;"></div>
  `;
  bar.querySelectorAll('.bulk-apply-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const fi = Number(btn.dataset.fieldIdx);
      const field = options.fields[fi];
      const sel = bar.querySelector(`.bulk-apply-select[data-field-idx="${fi}"]`);
      const value = sel.value;
      const ids = [...selected];
      const msg = document.getElementById(`bulkMsg_${groupId}`);
      btn.disabled = true;
      try {
        await field.onApply(ids, value);
        selected.clear();
        if (msg) { msg.textContent = `Готово (${ids.length})`; msg.style.color = 'var(--green)'; }
        if (options.onAfterApply) await options.onAfterApply();
      } catch (err) {
        btn.disabled = false;
        if (msg) { msg.textContent = 'Ошибка: ' + err.message; msg.style.color = 'var(--red)'; }
      }
    });
  });
  const clearBtn = document.getElementById(`bulkClear_${groupId}`);
  if (clearBtn) clearBtn.addEventListener('click', async () => {
    selected.clear();
    if (options.onAfterApply) await options.onAfterApply();
    else renderBulkEditBar(groupId, options);
  });
}

// Журнал изменений (колокольчик) — фиксирует правки данных на портале
// ============================================================
let changeLogSessionSeenCount = 0;

async function logChange(page, description) {
  try {
    await db(`insert into change_log (page, description) values ($1, $2)`, [page, description]);
    updateBellDot();
  } catch (e) { /* если не получилось залогировать — не мешаем основной операции */ }
}

async function updateBellDot() {
  try {
    const rows = await db(`select count(*) as cnt from change_log`);
    const total = Number(rows[0]?.cnt) || 0;
    const dot = document.getElementById('bellDot');
    if (dot) dot.style.display = total > changeLogSessionSeenCount ? 'block' : 'none';
  } catch (e) { /* таблицы может не быть — не страшно */ }
}

async function toggleChangeLogPanel() {
  const panel = document.getElementById('changeLogPanel');
  if (panel.style.display !== 'none') { panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  panel.innerHTML = 'Загрузка…';
  try {
    const rows = await db(`select page, description, created_at from change_log order by created_at desc limit 50`);
    changeLogSessionSeenCount = rows.length;
    const dot = document.getElementById('bellDot');
    if (dot) dot.style.display = 'none';
    if (rows.length === 0) {
      panel.innerHTML = `<div style="font-weight:700;margin-bottom:10px;">🔔 Журнал изменений</div><div class="empty-state">Пока ничего не записано</div>`;
      return;
    }
    let html = `<div style="font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
      <span>🔔 Журнал изменений</span>
      <button id="closeChangeLogBtn" style="border:none;background:none;cursor:pointer;font-size:16px;">✕</button>
    </div>`;
    for (const r of rows) {
      const dt = new Date(r.created_at).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      html += `<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;">
        <div style="color:var(--text3);font-size:11.5px;">${dt} · ${escHtml(r.page)}</div>
        <div>${escHtml(r.description)}</div>
      </div>`;
    }
    panel.innerHTML = html;
    document.getElementById('closeChangeLogBtn').addEventListener('click', () => { panel.style.display = 'none'; });
  } catch (err) {
    panel.innerHTML = `<div style="font-weight:700;margin-bottom:10px;">🔔 Журнал изменений</div><div class="status-msg err">Таблица change_log ещё не создана — прогони migration_v13.sql</div>`;
  }
}
