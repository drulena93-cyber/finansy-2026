async function renderRawCashYearSummary() {
  const content = document.getElementById('rawCashContent');
  content.innerHTML = `<div id="rawCashYearWrap">Загрузка…</div>`;
  const wrap = document.getElementById('rawCashYearWrap');
  try {
    const periods = (await db(`select distinct period from cash_ledger_raw order by period`)).map(p => p.period);
    const rows = await db(`
      select account, period,
        coalesce(sum(amount) filter (where direction='income'), 0) as income,
        coalesce(sum(amount) filter (where direction='expense'), 0) as expense
      from cash_ledger_raw
      group by account, period
    `);

    if (periods.length === 0) {
      wrap.innerHTML = `<div class="empty-state">Данных ещё нет.</div>`;
      return;
    }

    const incomeByAccPeriod = {};
    const expenseByAccPeriod = {};
    CASH_ACCOUNTS.forEach(acc => {
      incomeByAccPeriod[acc] = {}; expenseByAccPeriod[acc] = {};
      periods.forEach(p => { incomeByAccPeriod[acc][p] = 0; expenseByAccPeriod[acc][p] = 0; });
    });
    rows.forEach(r => {
      if (!incomeByAccPeriod[r.account]) return;
      incomeByAccPeriod[r.account][r.period] = Number(r.income) || 0;
      expenseByAccPeriod[r.account][r.period] = Number(r.expense) || 0;
    });

    const balanceChains = {};
    for (const acc of CASH_ACCOUNTS) balanceChains[acc] = await computeBalanceChain(acc, periods);

    const combinedIncome = (per) => CASH_ACCOUNTS.reduce((s, acc) => s + incomeByAccPeriod[acc][per], 0);
    const combinedExpense = (per) => CASH_ACCOUNTS.reduce((s, acc) => s + expenseByAccPeriod[acc][per], 0);
    const combinedOpening = (per) => CASH_ACCOUNTS.reduce((s, acc) => s + (balanceChains[acc][per]?.opening ?? 0), 0);
    const combinedClosing = (per) => CASH_ACCOUNTS.reduce((s, acc) => s + (balanceChains[acc][per]?.closing ?? 0), 0);

    // Каждая из 4 строк-метрик — со сворачиваемой разбивкой по трём банкам (те же месяцы-столбцы)
    function metricRow(key, label, cls, mainValFn, accValFn, yearTotalMode) {
      const yearTotal = yearTotalMode === 'sum' ? periods.reduce((s, p) => s + mainValFn(p), 0)
        : yearTotalMode === 'first' ? mainValFn(periods[0])
        : mainValFn(periods[periods.length - 1]);
      let html = `<tr class="year-metric-row ${cls}" data-metric="${key}" style="cursor:pointer;">
        <td class="year-metric-toggle" data-metric-toggle="${key}"><span class="metric-arrow">▸</span> ${label}</td>
        ${periods.map(p => `<td style="text-align:right;">${fmtMoney(mainValFn(p))}</td>`).join('')}
        <td style="text-align:right;font-weight:700;">${fmtMoney(yearTotal)}</td>
      </tr>`;
      CASH_ACCOUNTS.forEach(acc => {
        const accYearTotal = yearTotalMode === 'sum' ? periods.reduce((s, p) => s + accValFn(acc, p), 0)
          : yearTotalMode === 'first' ? accValFn(acc, periods[0])
          : accValFn(acc, periods[periods.length - 1]);
        html += `<tr class="year-metric-subrow" data-metric-sub="${key}" style="display:none;background:var(--surface2);">
          <td style="padding-left:28px;font-size:13px;color:var(--text2);">${escHtml(acc)}</td>
          ${periods.map(p => `<td style="text-align:right;"><a href="#" class="cash-year-link" data-account="${escHtml(acc)}" data-period="${p}" style="color:inherit;text-decoration:none;">${fmtMoney(accValFn(acc, p))}</a></td>`).join('')}
          <td style="text-align:right;">${fmtMoney(accYearTotal)}</td>
        </tr>`;
      });
      return html;
    }

    let html = `<div class="mirror-scroll"><table class="data-table" style="white-space:nowrap;"><thead><tr>
      <th></th>
      ${periods.map(per => `<th style="text-align:right;">${periodLabel(per)}</th>`).join('')}
      <th style="text-align:right;">Итого за год</th>
    </tr></thead><tbody>`;
    html += metricRow('opening', 'Остаток на начало', 'bh', combinedOpening, (acc, per) => balanceChains[acc][per]?.opening ?? 0, 'first');
    html += metricRow('income', 'Приход', 'gh', combinedIncome, (acc, per) => incomeByAccPeriod[acc][per], 'sum');
    html += metricRow('expense', 'Расход', 'rh', combinedExpense, (acc, per) => expenseByAccPeriod[acc][per], 'sum');
    html += metricRow('closing', 'Остаток на конец', 'bh', combinedClosing, (acc, per) => balanceChains[acc][per]?.closing ?? 0, 'last');
    html += '</tbody></table></div>';
    wrap.innerHTML = html;

    wrap.querySelectorAll('.year-metric-toggle').forEach(td => {
      td.addEventListener('click', () => {
        const key = td.dataset.metricToggle;
        const subrows = wrap.querySelectorAll(`[data-metric-sub="${CSS.escape(key)}"]`);
        const arrow = td.querySelector('.metric-arrow');
        const isOpen = subrows.length && subrows[0].style.display !== 'none';
        subrows.forEach(tr => { tr.style.display = isOpen ? 'none' : ''; });
        if (arrow) arrow.textContent = isOpen ? '▸' : '▾';
      });
    });
    wrap.querySelectorAll('.cash-year-link').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        goToCashJournal(a.dataset.account, a.dataset.period);
      });
    });
  } catch (err) {
    wrap.innerHTML = `<div class="status-msg err">Ошибка: ${err.message}</div>`;
  }
}

// ============================================================
// Вид "Сводка" — по счетам и по типам за выбранный месяц
// ============================================================
async function renderRawCashSummary() {
  const content = document.getElementById('rawCashContent');
  content.innerHTML = `<div id="rawCashSummaryWrap">Загрузка…</div>`;
  const wrap = document.getElementById('rawCashSummaryWrap');

  try {
    // В режиме "Весь год" period-фильтр — весь год целиком (period like 'YYYY-%'),
    // иначе — как обычно, один выбранный месяц.
    const periodFilter = rawCashSummaryFullYear ? `${rawCashYear}-%` : rawCashPeriod;
    const periodFilterOp = rawCashSummaryFullYear ? 'like' : '=';
    const byAccountRaw = await db(`
      select account,
        coalesce(sum(amount) filter (where direction='income' and category != $2), 0) as income,
        coalesce(sum(amount) filter (where direction='expense' and category != $2), 0) as expense,
        coalesce(sum(amount) filter (where direction='income' and category = $2), 0) as transfer_in,
        coalesce(sum(amount) filter (where direction='expense' and category = $2), 0) as transfer_out
      from cash_ledger_raw
      where period ${periodFilterOp} $1
      group by account
    `, [periodFilter, TRANSFER_CATEGORY]);
    const byAccountMap = {};
    byAccountRaw.forEach(r => { byAccountMap[r.account] = r; });
    // Показываем ВСЕ банки всегда, даже если по счёту в этом месяце вообще нет операций —
    // остаток на начало/конец всё равно считается через цепочку переносов
    const byAccount = CASH_ACCOUNTS.map(acc => ({
      account: acc,
      income: Number(byAccountMap[acc]?.income) || 0,
      expense: Number(byAccountMap[acc]?.expense) || 0,
      transferIn: Number(byAccountMap[acc]?.transfer_in) || 0,
      transferOut: Number(byAccountMap[acc]?.transfer_out) || 0,
    }));

    // Остаток на начало/конец — с переносом из предыдущего месяца. В режиме "Весь год":
    // "на начало" берём на начало января этого года, "на конец" — на конец декабря.
    const allPeriods = fillPeriodsThroughYearEnd(
      (await db(`select distinct period from cash_ledger_raw order by period`)).map(p => p.period)
    );
    const openingPeriod = rawCashSummaryFullYear ? `${rawCashYear}-01` : rawCashPeriod;
    const closingPeriod = rawCashSummaryFullYear ? `${rawCashYear}-12` : rawCashPeriod;
    for (const r of byAccount) {
      const chain = await computeBalanceChain(r.account, allPeriods);
      r.balanceOpening = chain[openingPeriod]?.opening ?? 0;
      r.balanceClosing = chain[closingPeriod]?.closing ?? 0;
    }

    // Блок "Сводка подотчётных средств (Виталя)" — та же логика переноса остатка, что и
    // у банковских счетов, но по двум конкретным категориям сразу по всем банкам.
    const vitalyaChain = await computeVitalyaChain(allPeriods);
    const vitalyaOpening = vitalyaChain[openingPeriod]?.opening ?? 0;
    const vitalyaClosing = vitalyaChain[closingPeriod]?.closing ?? 0;
    // ВАЖНО: категории намеренно "перевёрнуты" — см. пояснение в computeVitalyaChain.
    const vitalyaFlowRows = await db(`
      select
        coalesce(sum(amount) filter (where category = $3 and direction='expense'), 0) as income,
        coalesce(sum(amount) filter (where category = $2 and direction='income'), 0) as expense
      from cash_ledger_raw
      where period ${periodFilterOp} $1
    `, [periodFilter, VITALYA_INCOME_CATEGORY, VITALYA_EXPENSE_CATEGORY]);
    const vitalyaIncome = Number(vitalyaFlowRows[0]?.income) || 0;
    const vitalyaExpense = Number(vitalyaFlowRows[0]?.expense) || 0;

    // По категориям и банкам сразу — используем и для Finansy-блоков, и для Excel-таблицы
    const byCategory = await db(`
      select account, category, max(direction) as direction, coalesce(sum(amount), 0) as total
      from cash_ledger_raw
      where period ${periodFilterOp} $1 and category != $2
      group by account, category
    `, [periodFilter, TRANSFER_CATEGORY]);

    // ===== Блок "По счетам" — всегда все банки, без "Разницы" =====
    function accountSummaryTable() {
      const grandOpening = byAccount.reduce((s,r)=>s+r.balanceOpening,0);
      const grandClosing = byAccount.reduce((s,r)=>s+r.balanceClosing,0);
      const grandIncome = byAccount.reduce((s,r)=>s+r.income,0);
      const grandExpense = byAccount.reduce((s,r)=>s+r.expense,0);
      const grandTransferIn = byAccount.reduce((s,r)=>s+r.transferIn,0);
      const grandTransferOut = byAccount.reduce((s,r)=>s+r.transferOut,0);
      let html = `<div style="display:flex;align-items:center;gap:10px;margin:0 0 8px;">
        <div style="font-size:12px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.03em;">По счетам</div>
        <button class="btn secondary summary-toggle-btn" data-target="rawCashByAccountTable" style="padding:2px 10px;font-size:11px;">Скрыть</button>
      </div>`;

        <th>Счёт</th><th class="bh">Остаток на начало</th><th class="gh">Приход</th><th class="rh">Расход</th>
        <th style="background:var(--purple-bg);color:var(--purple);">Перевод +</th><th style="background:var(--purple-bg);color:var(--purple);">Перевод −</th>
        <th class="bh">Остаток на конец</th>
      </tr></thead><tbody>
      <tr class="tots-row">
        <td>Итого</td><td>${fmtMoney(grandOpening)}</td><td>${fmtMoney(grandIncome)}</td><td>${fmtMoney(grandExpense)}</td>
        <td>${fmtMoney(grandTransferIn)}</td><td>${fmtMoney(grandTransferOut)}</td><td>${fmtMoney(grandClosing)}</td>
      </tr>`;
      for (const r of byAccount) {
        html += `<tr>
          <td>${escHtml(r.account)}</td>
          <td>${fmtMoney(r.balanceOpening)}</td>
          <td>${r.income ? `<a href="#" class="cash-drill-link" data-account="${escHtml(r.account)}" data-dir="income" style="color:inherit;text-decoration:none;border-bottom:1px dashed currentColor;">${fmtMoney(r.income)}</a>` : fmtMoney(r.income)}</td>
          <td>${r.expense ? `<a href="#" class="cash-drill-link" data-account="${escHtml(r.account)}" data-dir="expense" style="color:inherit;text-decoration:none;border-bottom:1px dashed currentColor;">${fmtMoney(r.expense)}</a>` : fmtMoney(r.expense)}</td>
          <td>${r.transferIn ? `<a href="#" class="cash-drill-link" data-account="${escHtml(r.account)}" data-dir="transfer" style="color:var(--purple);text-decoration:none;border-bottom:1px dashed currentColor;">${fmtMoney(r.transferIn)}</a>` : fmtMoney(r.transferIn)}</td>
          <td>${r.transferOut ? `<a href="#" class="cash-drill-link" data-account="${escHtml(r.account)}" data-dir="transfer" style="color:var(--purple);text-decoration:none;border-bottom:1px dashed currentColor;">${fmtMoney(r.transferOut)}</a>` : fmtMoney(r.transferOut)}</td>

      html += '</tbody></table></div>';
      return html;

    // ===== Блок "Сводка подотчётных средств (Виталя)" — сворачиваемая мини-таблица,
    // сразу после "По счетам". Считается по всем банкам сразу, без разбивки по счетам. =====
    function vitalyaSummaryTable() {
      const targetPeriod = rawCashSummaryFullYear ? `${rawCashYear}-01` : rawCashPeriod;
      const isManual = vitalyaChain[targetPeriod]?.isManual;
      let html = `<div style="display:flex;align-items:center;gap:10px;margin:0 0 8px;flex-wrap:wrap;">
        <div style="font-size:12px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.03em;">Сводка подотчётных средств (Виталя)</div>
        <span style="font-size:11px;color:var(--text3);font-weight:400;text-transform:none;letter-spacing:normal;" title="Категория «ПО/ПРИХОД» здесь считается расходом Виталя, а «расх/денег» — приходом">ⓘ Приход/расход показаны от лица Виталя — наоборот от названий категорий в Кассе</span>
        <button class="btn secondary summary-toggle-btn" data-target="rawCashVitalyaTable" style="padding:2px 10px;font-size:11px;">Скрыть</button>
      </div>`;
      html += `<div id="rawCashVitalyaTable" style="margin-bottom:20px;">
        <table class="data-table" style="max-width:640px;"><thead><tr>
          <th class="bh">Остаток на начало</th><th class="gh">Приход</th><th class="rh">Расход</th><th class="bh">Остаток на конец</th>
        </tr></thead><tbody>
        <tr>
          <td>${fmtMoney(vitalyaOpening)} <button class="row-delete-btn" id="vitalyaOpeningEditBtn" title="Изменить остаток на начало вручную" style="color:var(--text3);vertical-align:middle;">✏️</button></td>
          <td>${vitalyaIncome ? `<a href="#" class="vitalya-drill-link" data-dir="income" style="color:inherit;text-decoration:none;border-bottom:1px dashed currentColor;">${fmtMoney(vitalyaIncome)}</a>` : fmtMoney(vitalyaIncome)}</td>
          <td>${vitalyaExpense ? `<a href="#" class="vitalya-drill-link" data-dir="expense" style="color:inherit;text-decoration:none;border-bottom:1px dashed currentColor;">${fmtMoney(vitalyaExpense)}</a>` : fmtMoney(vitalyaExpense)}</td>

    // ===== Блок "По категориям" — в стиле Finansy: расходы и доходы отдельными
    // блоками с барами, каждая категория раскрывается по банкам =====
    function categoryFinansyBlocks() {
      const catDirTotals = {}; // "категория|направление" -> сумма по всем банкам
      const catAccBreakdown = {}; // "категория|направление" -> { банк: сумма }
      byCategory.forEach(r => {
        const key = r.category + '|' + r.direction;
        catDirTotals[key] = (catDirTotals[key] || 0) + (Number(r.total) || 0);
        if (!catAccBreakdown[key]) catAccBreakdown[key] = {};
        catAccBreakdown[key][r.account] = (catAccBreakdown[key][r.account] || 0) + (Number(r.total) || 0);
      });

      function buildBlock(direction, title, colorVar, arrow) {
        const items = Object.keys(catDirTotals)
          .filter(k => k.endsWith('|' + direction))
          .map(k => ({ category: k.slice(0, -(direction.length + 1)), total: catDirTotals[k], key: k }))
          .sort((a, b) => b.total - a.total);
        const grandTotal = items.reduce((s, i) => s + i.total, 0);
        const maxVal = items.length ? items[0].total : 1;
        const blockId = 'catBlock_' + direction;
        let html = `<div style="flex:1;min-width:320px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <div style="font-weight:700;font-size:14px;">${arrow} ${title} по категориям · ${rawCashSummaryFullYear ? rawCashYear : periodLabel(rawCashPeriod)}</div>
            <div style="font-weight:800;font-size:15px;color:${colorVar};">${fmtMoney(grandTotal)}</div>
          </div>
          <div id="${blockId}" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;">`;
        if (items.length === 0) {
          html += `<div style="color:var(--text3);font-size:13px;padding:8px 0;">Нет данных за этот месяц</div>`;
        }
        for (const item of items) {
          const pct = maxVal ? Math.max(4, Math.round(item.total / maxVal * 100)) : 0;
          const breakdown = catAccBreakdown[item.key] || {};
          html += `<div class="cat-fin-row" style="padding:6px 0;border-bottom:1px solid var(--border);">
            <div style="display:flex;align-items:center;gap:10px;">
              <button type="button" class="cat-fin-toggle" data-cat-toggle="${escHtml(item.key)}" style="border:none;background:none;cursor:pointer;color:var(--text3);font-size:11px;width:14px;flex-shrink:0;">▸</button>
              <div style="flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(item.category)}</div>
              <div style="flex:2;background:var(--surface2);border-radius:4px;height:8px;overflow:hidden;min-width:60px;">
                <div style="width:${pct}%;height:100%;background:${colorVar};border-radius:4px;"></div>
              </div>
              <a href="#" class="cash-drill-link" data-category="${escHtml(item.category)}" data-dir="${direction}" style="width:90px;text-align:right;flex-shrink:0;font-weight:700;font-size:13.5px;color:${colorVar};text-decoration:none;">${fmtMoney(item.total)}</a>
            </div>
            <div class="cat-fin-breakdown" data-cat-breakdown="${escHtml(item.key)}" style="display:none;padding:8px 0 4px 24px;">
              ${CASH_ACCOUNTS.map(acc => `<div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--text2);padding:2px 0;">
                <span>${escHtml(acc)}</span>

    // Широкий формат "как в Excel" — итоговые суммы по категориям, итог кликабелен
    function categoryWideTable() {
      const allCats = [];

      byCategory.forEach(r => { if (matrix[r.account]) matrix[r.account][r.category] = Number(r.total) || 0; });

      let totalsCells = allCats.map(c => {
        const sum = CASH_ACCOUNTS.reduce((s, acc) => s + matrix[acc][c.category], 0);

      }).join('');
      let html = `<div style="display:flex;align-items:center;gap:10px;margin:0 0 8px;">
        <div style="font-size:12px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.03em;">По категориям (как в Excel)</div>
        <button class="btn secondary summary-toggle-btn" data-target="rawCashByCategoryTable" style="padding:2px 10px;font-size:11px;">Скрыть</button>

      html += `<div id="rawCashByCategoryTable"><div class="mirror-scroll"><table class="data-table" style="white-space:nowrap;margin-bottom:20px;"><thead><tr>
        <th>Счёт</th>
        ${allCats.map(c => `<th class="${c.direction === 'income' ? 'gh' : 'rh'}">${escHtml(c.category)}</th>`).join('')}
      </tr></thead><tbody>
      <tr class="tots-row"><td>Итого</td>${totalsCells}</tr>`;
      for (const acc of CASH_ACCOUNTS) {
        html += `<tr><td><strong>${escHtml(acc)}</strong></td>
          ${allCats.map(c => `<td>${matrix[acc][c.category] ? `<a href="#" class="cash-drill-link" data-account="${escHtml(acc)}" data-category="${escHtml(c.category)}" data-dir="${c.direction}" style="color:inherit;text-decoration:none;border-bottom:1px dashed currentColor;">${fmtMoney(matrix[acc][c.category])}</a>` : ''}</td>`).join('')}

      }
      html += '</tbody></table></div></div>';
      return html;
    }

    wrap.innerHTML =
      accountSummaryTable() +
      vitalyaSummaryTable() +
      categoryFinansyBlocks() +

    // Строка "Итого" закреплена сразу под шапкой (шапка уже закреплена глобальным CSS)
    wrap.querySelectorAll('table').forEach(tbl => {
      const headRow = tbl.querySelector('thead tr');
      const totalsRow = tbl.querySelector('tbody tr.tots-row, tbody tr:first-child');
      if (headRow && totalsRow) {
        const h = headRow.getBoundingClientRect().height;
        totalsRow.querySelectorAll('td').forEach(td => { td.style.position = 'sticky'; td.style.top = h + 'px'; td.style.zIndex = 2; td.style.background = td.style.background || 'var(--surface)'; });
      }
    });

    wrap.querySelectorAll('.summary-toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(btn.dataset.target);
        const hidden = target.style.display === 'none';
        target.style.display = hidden ? '' : 'none';
        btn.textContent = hidden ? 'Скрыть' : 'Показать';
      });
    });
    wrap.querySelectorAll('.cat-fin-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.catToggle;
        const detail = wrap.querySelector(`.cat-fin-breakdown[data-cat-breakdown="${CSS.escape(key)}"]`);
        if (!detail) return;
        const isOpen = detail.style.display !== 'none';
        detail.style.display = isOpen ? 'none' : 'block';
        btn.textContent = isOpen ? '▸' : '▾';
      });
    });
    wrap.querySelectorAll('.cash-drill-link').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        cameFromCashSummary = true;
        cashDrillDirection = a.dataset.dir || null;
        cashDrillCategory = a.dataset.category || null;
        cashDrillFullYear = rawCashSummaryFullYear;
        // Запоминаем, из какого именно блока сводки был клик — чтобы "Назад" вернул точно туда
        const blockWrap = a.closest('[id$="Table"]') || a.closest('table')?.parentElement;
        cashSummaryScrollTarget = blockWrap ? blockWrap.id : null;
        if (a.dataset.account) rawCashAccount = a.dataset.account;
        pageRawCash('journal');
      });
    });

    // Виталя — переход в журнал всегда по всем банкам сразу (rawCashAccount = null),
    // с фильтром именно по категории прихода/расхода подотчёта.
    wrap.querySelectorAll('.vitalya-drill-link').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        cameFromCashSummary = true;
        // ВАЖНО: категории "перевёрнуты" — клик по "Приход" (для Виталя) ведёт на операции
        // категории "расх/денег" (в базе у них direction='expense'), а клик по "Расход" —
        // на "ПО/ПРИХОД" (в базе direction='income'). Фильтр по направлению в Кассе должен
        // совпадать с тем, что реально хранится в операции, а не с тем, как она подписана
        // здесь для Виталя.
        cashDrillDirection = a.dataset.dir === 'income' ? 'expense' : 'income';
        cashDrillCategory = a.dataset.dir === 'income' ? VITALYA_EXPENSE_CATEGORY : VITALYA_INCOME_CATEGORY;
        cashDrillFullYear = rawCashSummaryFullYear;
        cashSummaryScrollTarget = 'rawCashVitalyaTable';
        rawCashAccount = null;
        pageRawCash('journal');
      });
    });

    const vitalyaEditBtn = document.getElementById('vitalyaOpeningEditBtn');
    if (vitalyaEditBtn) vitalyaEditBtn.addEventListener('click', () => {
      const editWrap = document.getElementById('vitalyaOpeningEditWrap');
      const targetPeriod = rawCashSummaryFullYear ? `${rawCashYear}-01` : rawCashPeriod;
      const current = vitalyaChain[targetPeriod]?.isManual ? vitalyaChain[targetPeriod].opening : null;
      const carried = vitalyaOpening;
      editWrap.style.display = 'block';
      editWrap.innerHTML = `
        <div style="background:var(--amber-bg);border:1px solid var(--amber-b);border-radius:var(--radius);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <span style="font-weight:700;color:var(--amber);">Остаток на начало — ${escHtml(periodLabel(targetPeriod))}:</span>
          <input type="number" id="vitalyaOpeningInput" value="${current != null ? current : ''}" placeholder="${fmtMoney(carried)}" style="width:140px;">
          <button class="btn" id="vitalyaOpeningSaveBtn">Сохранить</button>
          <span id="vitalyaOpeningMsg" style="font-size:13px;"></span>
        </div>`;
      document.getElementById('vitalyaOpeningSaveBtn').addEventListener('click', async () => {
        const raw = document.getElementById('vitalyaOpeningInput').value;
        const key = `opening_balance:vitalya:${targetPeriod}`;
        try {
          if (raw === '') {
            await db(`delete from settings where key=$1`, [key]);
          } else {
            await db(`
              insert into settings (key, value) values ($1, $2)
              on conflict (key) do update set value = $2, updated_at = now()
            `, [key, JSON.stringify({ amount: Number(raw) || 0 })]);
          }
          showMsg('vitalyaOpeningMsg', 'Сохранено', 'ok');
          renderRawCashSummary();
        } catch (err) {
          showMsg('vitalyaOpeningMsg', 'Ошибка: ' + err.message, 'err');
        }
      });
    });
  } catch (err) {
    wrap.innerHTML = `<div class="status-msg err">Ошибка: ${err.message}</div>`;
  }
}

// ============================================================
// Цепочка остатков по счёту: остаток на начало месяца = остаток на конец
// предыдущего, если для этого месяца не внесено вручную своё значение.
// Считается один раз на все месяцы сразу — используется и в Сводке, и в Годовой сводке.
// ============================================================
async function computeBalanceChain(account, allPeriodsSorted) {
  const manualRows = await db(`select key, value from settings where key like $1`, [`opening_balance:${account}:%`]);
  const manualByPeriod = {};
  manualRows.forEach(r => { manualByPeriod[r.key.split(':')[2]] = Number(r.value.amount) || 0; });

  const moneyRows = await db(`
    select period,
      coalesce(sum(amount) filter (where direction='income'), 0) as income,
      coalesce(sum(amount) filter (where direction='expense'), 0) as expense
    from cash_ledger_raw where account=$1 group by period
  `, [account]);
  const moneyByPeriod = {};
  moneyRows.forEach(r => { moneyByPeriod[r.period] = { income: Number(r.income) || 0, expense: Number(r.expense) || 0 }; });

  const chain = {};
  let carry = 0;
  for (const per of allPeriodsSorted) {
    const opening = manualByPeriod[per] !== undefined ? manualByPeriod[per] : carry;
    const income = moneyByPeriod[per]?.income || 0;
    const expense = moneyByPeriod[per]?.expense || 0;
    const closing = opening + income - expense;
    chain[per] = { opening, income, expense, closing, isManual: manualByPeriod[per] !== undefined };
    carry = closing;
  }
  return chain;
}

// Та же логика переноса остатка, что и computeBalanceChain, но не по счёту, а по двум
// категориям подотчёта (Виталя) сразу по всем банкам — см. VITALYA_INCOME_CATEGORY/
// VITALYA_EXPENSE_CATEGORY. Настройки хранятся под отдельным ключом 'opening_balance:vitalya:*',
// он не пересекается с ключами реальных счетов (там всегда настоящее название банка).
async function computeVitalyaChain(allPeriodsSorted) {
  const manualRows = await db(`select key, value from settings where key like 'opening_balance:vitalya:%'`);
  const manualByPeriod = {};
  manualRows.forEach(r => { manualByPeriod[r.key.split(':')[2]] = Number(r.value.amount) || 0; });

  // ВАЖНО: с точки зрения самого Виталия приход и расход — наоборот от того, как называются
  // категории в базе. То, что для бизнеса "приход" (ПО/ПРИХОД — деньги выданы Виталю под
  // отчёт), для Виталя — расход (он их потратил/должен потратить); а "расх/денег" (бизнес
  // списывает как расход) для Виталя — приход (отчитался/вернул). Поэтому здесь категории
  // намеренно "перевёрнуты" относительно своих названий.
  const moneyRows = await db(`
    select period,
      coalesce(sum(amount) filter (where category = $2 and direction='expense'), 0) as income,
      coalesce(sum(amount) filter (where category = $1 and direction='income'), 0) as expense
    from cash_ledger_raw
    where category in ($1, $2)
    group by period
  `, [VITALYA_INCOME_CATEGORY, VITALYA_EXPENSE_CATEGORY]);
  const moneyByPeriod = {};
  moneyRows.forEach(r => { moneyByPeriod[r.period] = { income: Number(r.income) || 0, expense: Number(r.expense) || 0 }; });

  const chain = {};
  let carry = 0;
  for (const per of allPeriodsSorted) {
    const opening = manualByPeriod[per] !== undefined ? manualByPeriod[per] : carry;
    const income = moneyByPeriod[per]?.income || 0;
    const expense = moneyByPeriod[per]?.expense || 0;
    const closing = opening + income - expense;
    chain[per] = { opening, income, expense, closing, isManual: manualByPeriod[per] !== undefined };
    carry = closing;
  }
  return chain;
}

// ============================================================
// Вид "Журнал операций"
// ============================================================
// Остаток на начало месяца — отдельно от обычных операций (не приход и не расход,
// поэтому не смешиваем с ними, храним отдельно в settings, а не в cash_ledger_raw)
async function renderOpeningBalancePanel(forceExpand) {
  const panel = document.getElementById('rawCashOpeningBalancePanel');
  if (!rawCashAccount) { panel.innerHTML = ''; return; } // "Все банки" — у остатка нет одного конкретного счёта для расчёта
  const key = `opening_balance:${rawCashAccount}:${rawCashPeriod}`;
  let current = null;
  try {
    const rows = await db(`select value from settings where key=$1`, [key]);
    if (rows.length > 0) current = rows[0].value.amount;
  } catch (e) { /* нет ещё такой настройки — это нормально */ }

  const allPeriods = fillPeriodsThroughYearEnd(
    (await db(`select distinct period from cash_ledger_raw order by period`)).map(p => p.period)
  );
  const chain = await computeBalanceChain(rawCashAccount, allPeriods);
  const carried = chain[rawCashPeriod]?.opening ?? 0;

  // "Самый первый месяц" для этого счёта — единственный, где остаток на начало
  // по-настоящему неоткуда взять сам. Определяем по самой ранней реальной операции
  // (не по заполненному до конца года списку месяцев).
  const realPeriodsForAccount = (
    await db(`select distinct period from cash_ledger_raw where account=$1 order by period`, [rawCashAccount])
  ).map(r => r.period);
  const earliestReal = realPeriodsForAccount[0] || null;
  const isVeryFirstPeriod = !earliestReal || rawCashPeriod <= earliestReal;

  // Число и так видно ниже, в общей строке банка (Остаток на начало / Приход / Расход / ...) —
  // отдельную плашку показываем только если: (а) это самый первый месяц, куда ещё нужно
  // вписать стартовое число, или (б) остаток когда-то правили вручную (стоит явно показать,
  // что тут отклонение от автопереноса). В остальных случаях — молча ничего не показываем.
  if (!forceExpand && current == null && !isVeryFirstPeriod) {
    panel.innerHTML = '';
    return;
  }
  if (!forceExpand && (current != null || !isVeryFirstPeriod)) {
    const shownValue = current != null ? current : carried;
    panel.innerHTML = `
      <div style="background:var(--surface2);border-radius:var(--radius);padding:6px 14px;margin-bottom:12px;font-size:12.5px;color:var(--text2);display:flex;align-items:center;gap:8px;">
        💰 Остаток на начало месяца (${escHtml(rawCashAccount)}, ${periodLabel(rawCashPeriod)}): <strong>${fmtMoney(shownValue)}</strong>
        ${current == null ? '<span style="color:var(--text3);">(перенесено автоматически)</span>' : ''}
        <button class="btn secondary" id="openingBalanceEditLink" style="padding:1px 9px;font-size:11px;">Изменить</button>
      </div>
    `;
    document.getElementById('openingBalanceEditLink').addEventListener('click', () => renderOpeningBalancePanel(true));
    return;
  }

  const hint = current == null
    ? `Это самый первый месяц с данными по этому счёту — остаток на начало неоткуда перенести автоматически, впиши его один раз.`
    : `Внесено вручную. Чтобы вернуть автоматический перенос (${fmtMoney(carried)}) — очисти поле и сохрани.`;

  panel.innerHTML = `
    <div style="background:var(--amber-bg);border:1px solid var(--amber-b);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div style="font-weight:700;color:var(--amber);">💰 Остаток на начало месяца — ${escHtml(rawCashAccount)}, ${periodLabel(rawCashPeriod)}:</div>
        <input type="number" id="openingBalanceInput" value="${current != null ? current : ''}" placeholder="${fmtMoney(carried)}" style="width:140px;">
        <button class="btn" id="openingBalanceSaveBtn">Сохранить</button>
        <span id="openingBalanceMsg" style="font-size:13px;"></span>
      </div>
      <div style="font-size:12.5px;color:var(--text2);margin-top:6px;">${hint}</div>
    </div>
  `;
  document.getElementById('openingBalanceSaveBtn').addEventListener('click', async () => {
    const raw = document.getElementById('openingBalanceInput').value;
    try {
      if (raw === '') {
        await db(`delete from settings where key=$1`, [key]);
      } else {
        await db(`
          insert into settings (key, value) values ($1, $2)
          on conflict (key) do update set value = $2, updated_at = now()
        `, [key, JSON.stringify({ amount: Number(raw) || 0 })]);
      }
      showMsg('openingBalanceMsg', 'Сохранено', 'ok');
      renderOpeningBalancePanel(); // сворачиваем плашку после сохранения
      renderBankSummaryStrip(); // и обновляем цифру в общей строке банка тоже
    } catch (err) {
      showMsg('openingBalanceMsg', 'Ошибка: ' + err.message, 'err');
    }
  });
}

      select

        coalesce(sum(amount) filter (where direction='income' and category = $3), 0) as transfer_in,

// Карта "здание -> арендаторы этого здания" из CRM (активные И архивные) — используется
// для каскадного выбора "Здание -> Арендатор" в Кассе, чтобы корреспондент гарантированно
// совпадал с настоящим арендатором CRM, а не вводился вручную текстом.
let tenantsByBuildingCache = null;
async function getTenantsByBuildingMap() {
  if (tenantsByBuildingCache) return tenantsByBuildingCache;
  const [allTenants, tenantObjRows, buildingMap, manualOverrides] = await Promise.all([
    db(`select id, name, status from tenants_sync`),
    db(`select id as tenant_object_id, tenant_id, object_name, office, building from tenant_objects`),
    getTenantObjectBuildingMap(),
    getManualBuildingOverrides(),
  ]);
  const tenantById = {};
  allTenants.forEach(t => { tenantById[t.id] = t; });
  const tenantObjsByTenant = {};
  tenantObjRows.forEach(o => { (tenantObjsByTenant[o.tenant_id] = tenantObjsByTenant[o.tenant_id] || []).push(o); });

  // Один арендатор может занимать НЕСКОЛЬКО разных помещений — в том числе в одном и том же
  // здании (напр. офис №1 и офис №2). Раньше все его платежи схлопывались в одну запись по
  // имени. Теперь при выборе арендатора с несколькими помещениями нужно уточнить, какое
  // именно — поэтому список содержит отдельную запись НА КАЖДОЕ помещение, с меткой
  // этаж/офис для различения. У арендаторов с одним (или без) помещением — как раньше,
  // одна запись без уточнения.
  const map = {};
  function addEntry(building, entry) {
    if (!map[building]) map[building] = [];
    map[building].push(entry);
  }
  allTenants.forEach(t => {
    const objs = tenantObjsByTenant[t.id] || [];
    if (objs.length <= 1) {
      const obj = objs[0] || null;
      // Ручная привязка (settings, см. getManualBuildingOverrides) подхватывается здесь
      // же через resolveBuilding — арендатор без единого объекта в CRM (например, уже
      // съехавший, но с ещё не закрытыми операциями) всё равно попадёт в каскад своего
      // здания, если ты привязала его вручную в Сводке.
      const building = resolveBuilding(obj ? obj.building : null, buildingMap, obj ? obj.tenant_object_id : null, obj ? obj.object_name : null, t.id, manualOverrides);
      addEntry(building, { id: t.id, name: t.name, status: t.status, tenantObjectId: obj ? obj.tenant_object_id : null, label: t.name });
    } else {
      const buildingsForTenant = new Set();
      objs.forEach(obj => {
        const building = resolveBuilding(obj.building, buildingMap, obj.tenant_object_id, obj.object_name);
        buildingsForTenant.add(building);
        const shortLabel = shortObjectLabel(combineObjectFields(obj.object_name, obj.office));
        addEntry(building, { id: t.id, name: t.name, status: t.status, tenantObjectId: obj.tenant_object_id, label: `${t.name} — ${shortLabel}` });
      });
    }
  });
  Object.values(map).forEach(list => list.sort((a, b) => a.label.localeCompare(b.label)));
  tenantsByBuildingCache = map;
  return map;
}
