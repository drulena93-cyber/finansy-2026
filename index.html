        <label id="utilRowOursWrap" style="font-size:12px;color:var(--text3);">Наши
          <span style="display:flex;gap:6px;">
            <select id="utilRowOurs" style="flex:1;">
              <option value="">— выбери —</option>
              ${oursOptions.map(o => `<option value="${escHtml(o)}">${escHtml(o)}</option>`).join('')}
            </select>
            <button type="button" class="icon-btn" id="utilRowOursSettingsBtn" title="Настроить список">⚙️</button>
          </span>
        </label>
      </div>
      <div id="utilRowMsg" style="margin-top:8px;"></div>
      <div style="margin-top:14px;display:flex;gap:8px;">
        <button class="btn" id="utilRowSubmit">Добавить</button>
        <button class="btn secondary" id="utilRowCancel">Отмена</button>
      </div>
    </div>
  `;
  showModal(html);

  function fillTenants(building) {
    const tenantSel = document.getElementById('utilRowTenant');
    const list = tenantsByBuilding[building] || [];
    tenantSel.innerHTML = '<option value="">— без арендатора —</option>' +
      list.map(t => `<option value="${escHtml(t.name)}">${escHtml(t.label)}${t.status !== 'active' ? ' (архив)' : ''}</option>`).join('');
  }
  if (defaultBuilding) fillTenants(defaultBuilding);

  document.getElementById('utilRowBuilding').addEventListener('change', (e) => {
    const building = e.target.value;
    const tenantSel = document.getElementById('utilRowTenant');
    const list = tenantsByBuilding[building] || [];
    tenantSel.innerHTML = '<option value="">— без арендатора —</option>' +
      list.map(t => `<option value="${escHtml(t.name)}">${escHtml(t.label)}${t.status !== 'active' ? ' (архив)' : ''}</option>`).join('');
  });
  document.getElementById('utilRowTenant').addEventListener('change', (e) => {
    const hide = !!e.target.value;
    document.getElementById('utilRowServiceWrap').style.display = hide ? 'none' : '';
    document.getElementById('utilRowOursWrap').style.display = hide ? 'none' : '';
  });
  // "Оплата службам" и "Наши" — взаимоисключающие выборы одной строки: выбор в одном
  // сбрасывает другой, чтобы не было неоднозначности, к какому списку строка относится.
  document.getElementById('utilRowService').addEventListener('change', (e) => {
    if (e.target.value) document.getElementById('utilRowOurs').value = '';
  });
  document.getElementById('utilRowOurs').addEventListener('change', (e) => {
    if (e.target.value) document.getElementById('utilRowService').value = '';
  });
  document.getElementById('utilRowServiceSettingsBtn').addEventListener('click', () => openUtilityServiceOptionsSettings());
  document.getElementById('utilRowOursSettingsBtn').addEventListener('click', () => openUtilityOursOptionsSettings());
  document.getElementById('utilRowCancel').addEventListener('click', closeModal);
  document.getElementById('utilRowSubmit').addEventListener('click', submitUtilityAddRow);
}

async function submitUtilityAddRow() {
  const building = document.getElementById('utilRowBuilding').value;
  const type = document.getElementById('utilRowType').value;
  const tenantName = document.getElementById('utilRowTenant').value;
  const serviceEl = document.getElementById('utilRowService');
  const serviceName = serviceEl ? serviceEl.value : '';
  const oursEl = document.getElementById('utilRowOurs');
  const oursName = oursEl ? oursEl.value : '';
  const isService = !tenantName && !!serviceName;
  const isOurs = !tenantName && !serviceName && !!oursName;
  const label = tenantName || serviceName || oursName;
  if (!building || !label) {
    showMsg('utilRowMsg', 'Выбери здание и арендатора (или пункт из «Оплата службам»/«Наши»)', 'err');
    return;
  }
  try {
    const rows = await getUtilityManualRows();
    rows.push({ id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8), building, label, type, isService, isOurs });
    await saveUtilityManualRows(rows);
    closeModal();
    utilityReadingsBuilding = building;
    await loadUtilitySummary();
    showMsg('utilityMsg', 'Строка добавлена — заполни данные по ней в таблице', 'ok');
  } catch (err) {
    showMsg('utilRowMsg', 'Ошибка: ' + err.message, 'err');
  }
}

async function deleteUtilityManualRow(id) {
  const rows = await getUtilityManualRows();
  await saveUtilityManualRows(rows.filter(r => r.id !== id));
  await loadUtilitySummary();
}

// Охрана/Мусор/Отопление раньше были "зданиями-only" (без разбивки по арендаторам) —
// по просьбе Елены сделаны такими же полноценными разделами, как Свет/Газ/Вода (арендаторы,
// "+ Добавить строку", "Итого «Здание»" и т.д.). Капремонт/ЕДС сод. жилья — два новых таких
// же раздела. UTILITY_BUILDING_ONLY_TYPES оставлен пустым (а не удалён) — часть кода всё ещё
// на него ссылается как на общий переключатель "это здание-only раздел или обычный".
const UTILITY_TYPES = ['свет', 'газ', 'вода', 'мусор', 'охрана', 'отопление', 'капремонт', 'едс'];
const UTILITY_BUILDING_ONLY_TYPES = [];
const UTILITY_ALL_TYPES = [...UTILITY_TYPES, ...UTILITY_BUILDING_ONLY_TYPES];
// Отображаемые подписи разделов, где просто "с большой буквы" не годится (аббревиатуры и
// составные названия) — используется на вкладках раздела и в форме "+ Добавить строку".
// Остальные разделы берут подпись автоматически (первая буква — заглавная).
const UTILITY_TYPE_LABELS = { 'едс': 'ЕДС сод. жилья' };
function utilityTypeLabel(t) {
  return UTILITY_TYPE_LABELS[t] || (t[0].toUpperCase() + t.slice(1));
}

// Тип арендатора для коммуналки — "фиксированная" или "по счётчику": определяет, в какой
// из двух столбцов оплаты арендатора (фикс / по счётчику) попадает его платёж из Кассы
// (сама сумма платежа не делится — просто отображается в одном из двух столбцов).
// Хранится в settings одним JSON-объектом, ключ "identity::раздел" -> 'fixed'|'meter'|
// 'excluded' — ОТДЕЛЬНО ПО КАЖДОМУ РАЗДЕЛУ (свет/газ/вода), как и "Тип по зданиям": у
// одного арендатора в "Свете" может быть "По счётчику", а в "Газе" — "Фиксированная",
// независимо друг от друга. Для старых записей (ключ — просто identity, без "::раздел",
// сохранённых ДО этого разделения) значение читается как запасной вариант для всех
// разделов, пока не переопределено отдельно для конкретного раздела.
async function getUtilityTenantTypes() {
  const rows = await db(`select value from settings where key='utility_tenant_types'`);
  return rows.length > 0 ? rows[0].value : {};
}
async function saveUtilityTenantTypes(map) {
  await db(`insert into settings (key, value) values ('utility_tenant_types', $1) on conflict (key) do update set value=$1, updated_at=now()`, [JSON.stringify(map)]);
}

// "Тип по зданиям" — "meter" (По счётчику, показания вручную + Итог/Начислено по формуле),
// "fixed" (Фиксированные, вообще все поля включая Итог/Начислено вручную) или "combined"
// (Итого совместное — Итог/Начислено = сумма по всем строкам здания). См. buildingType()/
// buildingTypeSelectCell() в renderUtilitySummaryTable. ВЫБИРАЕТСЯ ОТДЕЛЬНО ПО КАЖДОМУ
// РАЗДЕЛУ (свет/газ/вода/мусор/охрана/отопление) — у здания может быть, например, "Свет" по
// счётчику, а "Газ" фиксированным. Ключ в JSON — "Здание::раздел" (см. buildingType()).
// Для старых записей, сохранённых ДО этого разделения (просто "Здание" → тип, без "::раздел"),
// значение читается как запасной вариант для всех разделов сразу, пока не переопределено.
async function getUtilityBuildingTypes() {
  const rows = await db(`select value from settings where key='utility_building_types'`);
  return rows.length > 0 ? rows[0].value : {};
}
async function saveUtilityBuildingTypes(map) {
  await db(`insert into settings (key, value) values ('utility_building_types', $1) on conflict (key) do update set value=$1, updated_at=now()`, [JSON.stringify(map)]);
}

// Доп. здания без арендаторов — заводятся отдельным списком специально для Коммуналки
// (не путать с общим списком доп.зданий в Кассе/Аренде), чтобы просто вести по ним одну
// строку "Итого" во всех разделах, вручную.
async function getUtilityExtraBuildings() {
  const rows = await db(`select value from settings where key='utility_extra_buildings'`);
  return rows.length > 0 ? rows[0].value : [];
}
async function saveUtilityExtraBuildings(list) {
  await db(`insert into settings (key, value) values ('utility_extra_buildings', $1) on conflict (key) do update set value=$1, updated_at=now()`, [JSON.stringify(list)]);
}
async function openUtilityExtraBuildingsSettings() {
  const items = await getUtilityExtraBuildings();
  showModal(`
    <div style="background:var(--surface2);border-radius:var(--radius);padding:18px;max-width:380px;width:100%;">
      <div style="font-weight:700;margin-bottom:8px;">Доп. здания в Коммуналке</div>
      <p style="color:var(--text2);font-size:13px;margin:0 0 12px;">Здания без арендаторов — появятся вкладкой с одной строкой «Итого», которую заполняешь вручную по всем разделам.</p>
      <div id="utilExtraBldList"></div>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <input type="text" id="utilExtraBldNew" placeholder="Название здания" style="flex:1;">
        <button class="btn secondary" id="utilExtraBldAddBtn">+ Добавить</button>
      </div>
      <div style="margin-top:14px;text-align:right;"><button class="btn secondary" onclick="closeModal()">Закрыть</button></div>
    </div>
  `);
  function render() {

      ? `<div style="color:var(--text3);font-size:13px;">Список пуст</div>`
      : items.map((v, i) => `<div style="display:flex;align-items:center;gap:8px;padding:4px 0;">
          <span style="flex:1;">${escHtml(v)}</span>
          <button class="icon-btn" data-remove-idx="${i}" title="Удалить">✕</button>
        </div>`).join('');
    document.querySelectorAll('[data-remove-idx]').forEach(btn => {
