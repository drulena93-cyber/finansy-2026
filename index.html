    sec.hidden = !sec.hidden;
    renderMenuEditorList();
  }));
  wrap.querySelectorAll('[data-sec-delete]').forEach(b => b.addEventListener('click', () => {
    menuDraft.splice(Number(b.dataset.secDelete), 1);
    renderMenuEditorList();
  }));
  wrap.querySelectorAll('[data-item-up]').forEach(b => b.addEventListener('click', () => {
    const [si, ii] = b.dataset.itemUp.split(':').map(Number);
    const arr = menuDraft[si].items;
    [arr[ii - 1], arr[ii]] = [arr[ii], arr[ii - 1]];
    renderMenuEditorList();
  }));
  wrap.querySelectorAll('[data-item-down]').forEach(b => b.addEventListener('click', () => {
    const [si, ii] = b.dataset.itemDown.split(':').map(Number);
    const arr = menuDraft[si].items;
    [arr[ii + 1], arr[ii]] = [arr[ii], arr[ii + 1]];
    renderMenuEditorList();
  }));
  wrap.querySelectorAll('[data-item-label]').forEach(inp => inp.addEventListener('input', () => {
    const [si, ii] = inp.dataset.itemLabel.split(':').map(Number);
    menuDraft[si].items[ii].label = inp.value;
  }));
  wrap.querySelectorAll('[data-item-toggle-hide]').forEach(b => b.addEventListener('click', () => {
    const [si, ii] = b.dataset.itemToggleHide.split(':').map(Number);
    const it = menuDraft[si].items[ii];
    it.hidden = !it.hidden;
    renderMenuEditorList();
  }));
  wrap.querySelectorAll('[data-item-standalone]').forEach(b => b.addEventListener('click', () => {
    const [si, ii] = b.dataset.itemStandalone.split(':').map(Number);
    const sec = menuDraft[si];
    const [moved] = sec.items.splice(ii, 1);
    const newId = 'flat-' + moved.page;
    menuDraft.splice(si + 1, 0, { id: newId, icon: sec.icon, label: moved.label, type: 'flat', page: moved.page });

  }));
  wrap.querySelectorAll('[data-item-move]').forEach(sel => sel.addEventListener('change', () => {
    const [si, ii] = sel.dataset.itemMove.split(':').map(Number);
    const targetId = sel.value;
    if (!targetId) return;
    const targetSec = menuDraft.find(s => s.id === targetId);
    if (!targetSec) return;
    const [moved] = menuDraft[si].items.splice(ii, 1);
    targetSec.items.push(moved);
    renderMenuEditorList();
  }));
  wrap.querySelectorAll('[data-restore-sec]').forEach(b => b.addEventListener('click', () => {
    menuDraft[Number(b.dataset.restoreSec)].hidden = false;
    renderMenuEditorList();
  }));
  wrap.querySelectorAll('[data-restore-item]').forEach(b => b.addEventListener('click', () => {
    const [si, ii] = b.dataset.restoreItem.split(':').map(Number);
    menuDraft[si].items[ii].hidden = false;
    renderMenuEditorList();
  }));
  wrap.querySelectorAll('[data-delete-hidden-sec]').forEach(b => b.addEventListener('click', () => {
    if (!confirm('Удалить этот раздел из меню насовсем? Не просто скрыть — убрать из списка целиком.')) return;
    menuDraft.splice(Number(b.dataset.deleteHiddenSec), 1);
    renderMenuEditorList();
  }));
  wrap.querySelectorAll('[data-delete-hidden-item]').forEach(b => b.addEventListener('click', () => {
    if (!confirm('Удалить этот пункт из меню насовсем? Не просто скрыть — убрать из списка целиком.')) return;
    const [si, ii] = b.dataset.deleteHiddenItem.split(':').map(Number);
    menuDraft[si].items.splice(ii, 1);
    renderMenuEditorList();
  }));
  wrap.querySelectorAll('[data-flat-move-to-folder]').forEach(sel => sel.addEventListener('change', () => {
    const secIdx = Number(sel.dataset.flatMoveToFolder);
    const targetId = sel.value;
    if (!targetId) return;
    const targetSec = menuDraft.find(s => s.id === targetId);
    if (!targetSec) return;
    const [moved] = menuDraft.splice(secIdx, 1);
    targetSec.items.push({ page: moved.page, label: moved.label });
    renderMenuEditorList();
  }));
}

  main.innerHTML = `

      </div>
    </div>
    <div id="summary2026Wrap">Загрузка…</div>
  `;
  const wrap = document.getElementById('summary2026Wrap');
  try {
    const periods = [...new Set([
      ...(await db(`select distinct period from cash_ledger_raw`)).map(p => p.period),
      ...(await db(`select distinct period from rent_payment_log`)).map(p => p.period),
      ...(await db(`select distinct period from expenses_raw`)).map(p => p.period),
    ])].sort();

    const cashRows = await db(`
      select period,
        coalesce(sum(amount) filter (where direction='income'),0) as income,
        coalesce(sum(amount) filter (where direction='expense'),0) as expense
      from cash_ledger_raw group by period
    `);
    const rentRows = await db(`select period, coalesce(sum(payment),0) as total from rent_payment_log group by period`);
    const expRows = await db(`select period, coalesce(sum(amount),0) as total from expenses_raw group by period`);

    const cashMap = {}; cashRows.forEach(r => cashMap[r.period] = { income: Number(r.income)||0, expense: Number(r.expense)||0 });
    const rentMap = {}; rentRows.forEach(r => rentMap[r.period] = Number(r.total)||0);
    const expMap = {}; expRows.forEach(r => expMap[r.period] = Number(r.total)||0);

    const cashIncomeTotal = periods.reduce((s,p) => s + (cashMap[p]?.income||0), 0);
    const cashExpenseTotal = periods.reduce((s,p) => s + (cashMap[p]?.expense||0), 0);
    const rentTotal = periods.reduce((s,p) => s + (rentMap[p]||0), 0);
    const expTotal = periods.reduce((s,p) => s + (expMap[p]||0), 0);

    let html = `<div class="mirror-scroll"><table class="data-table" style="white-space:nowrap;"><thead><tr>
      <th>Месяц</th>
      <th class="gh">Касса: Приход</th>
      <th class="rh">Касса: Расход</th>
      <th class="gh">Аренда 2026: сумма платежей</th>
      <th class="rh">Расходы: сумма</th>
    </tr></thead><tbody>`;
    for (const per of periods) {
      html += `<tr>
        <td><a href="#" class="summary-link" data-target="cash" data-period="${per}" style="color:inherit;text-decoration:none;font-weight:600;">${periodLabel(per)}</a></td>
        <td>${fmtMoney(cashMap[per]?.income || 0)}</td>
        <td>${fmtMoney(cashMap[per]?.expense || 0)}</td>
        <td>${fmtMoney(rentMap[per] || 0)}</td>
        <td>${fmtMoney(expMap[per] || 0)}</td>
      </tr>`;
    }
    html += `<tr class="tots-row">
      <td>Итого за год</td>
      <td>${fmtMoney(cashIncomeTotal)}</td>
      <td>${fmtMoney(cashExpenseTotal)}</td>
      <td>${fmtMoney(rentTotal)}</td>
      <td>${fmtMoney(expTotal)}</td>
    </tr>`;
    html += '</tbody></table></div>';
    wrap.innerHTML = html;

    wrap.querySelectorAll('.summary-link').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        rawCashPeriod = a.dataset.period;
        navigateTo('raw-cash');
      });
    });
  } catch (err) {
    wrap.innerHTML = `<div class="status-msg err">Ошибка: ${err.message}</div>`;
  }
}

// ============================================================
// Настройки → Категории — управление списками категорий
// Кассы и банков и Расходов, чтобы можно было добавлять свои
// ============================================================
// Кэш "справочных" данных на сессию — почти не меняются, но запрашивались заново
// на каждое переключение вкладки/счёта. Сбрасывается только когда мы сами что-то сохраняем.
const sessionDataCache = {};

async function getStoredCategories(key, defaults) {
  if (sessionDataCache[key] !== undefined) return sessionDataCache[key];
  let result;
  try {
    const rows = await db(`select value from settings where key=$1`, [key]);
    result = (rows.length > 0 && Array.isArray(rows[0].value)) ? rows[0].value : defaults.slice();
  } catch (e) {
    result = defaults.slice();
  }
  sessionDataCache[key] = result;
  return result;
}
async function saveStoredCategories(key, list) {
  await db(`
    insert into settings (key, value) values ($1, $2)
    on conflict (key) do update set value = $2, updated_at = now()
  `, [key, JSON.stringify(list)]);
  sessionDataCache[key] = list; // обновляем кэш сразу, не дожидаясь следующего чтения
  if (key === 'custom_buildings') allBuildingsCache = null;
}
async function getStoredSubcategoryMap(key) {
  if (sessionDataCache[key] !== undefined) return sessionDataCache[key];
  let result;
  try {
    const rows = await db(`select value from settings where key=$1`, [key]);
    result = (rows.length > 0 && typeof rows[0].value === 'object' && !Array.isArray(rows[0].value)) ? rows[0].value : {};
  } catch (e) {
    result = {};
  }
  sessionDataCache[key] = result;
  return result;
}
let expSelectedCategory = null;

async function getCashCategoryConfig() {
  return await getStoredSubcategoryMap('cash_category_config');
}
async function saveCashCategoryConfig(cfg) {
  await saveStoredCategories('cash_category_config', cfg);
}

    try {
      await db(`update cash_ledger_raw set category=$2 where category=$1`, [oldName, newName]);
      if (cashConfig[oldName]) {
        cashConfig[newName] = cashConfig[oldName];
        delete cashConfig[oldName];
        await saveCashCategoryConfig(cashConfig);
      }
      const extraIdx = cashCats.indexOf(oldName);
      if (extraIdx > -1) { cashCats[extraIdx] = newName; await saveStoredCategories('cash_extra_categories', cashCats); }
      showMsg('categoriesMsg', `«${oldName}» переименована в «${newName}»`, 'ok');
      renderCategoriesSettings();
    } catch (err) {
      showMsg('categoriesMsg', 'Ошибка: ' + err.message, 'err');
    }
  }));
  document.getElementById('cashCfgAddBtn').addEventListener('click', async () => {
    const input = document.getElementById('newCashCfgInput');
    const value = input.value.trim();
    if (!value || allCashCats.includes(value)) return;
    cashCats.push(value);
    await saveStoredCategories('cash_extra_categories', cashCats);
    renderCategoriesSettings();
  });

  wrap.querySelectorAll('.cat-add-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const key = btn.dataset.key;
      const input = wrap.querySelector(`.cat-new-input[data-key="${key}"]`);
      const value = input.value.trim();
      if (!value) return;
      const current = keyArrays[key];
      if (current.includes(value)) { input.value = ''; return; }
      current.push(value);
      await saveStoredCategories(key, current);
      renderCategoriesSettings();
    });
  });
  wrap.querySelectorAll('.cat-remove-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const key = btn.dataset.key;
      const idx = Number(btn.dataset.index);
      const current = keyArrays[key];
      const removedName = current[idx];
      current.splice(idx, 1);
      await saveStoredCategories(key, current);
      showMsg('categoriesMsg', `«${removedName}» удалена из списка`, 'ok');
      setTimeout(() => renderCategoriesSettings(), 1500);
    });
  });
  wrap.querySelectorAll('.cat-rename-input').forEach(input => {
    input.addEventListener('blur', async () => {
      const key = input.dataset.key;
      const idx = Number(input.dataset.index);
      const current = keyArrays[key];
      const oldName = current[idx];
      const newName = input.value.trim();
      if (!newName || newName === oldName) { input.value = oldName; return; }
      current[idx] = newName;
      await saveStoredCategories(key, current);
      if (key === 'expense_categories') {
        // переносим уже занесённые расходы и подкатегории на новое название
        await db(`update expenses_raw set category=$2 where category=$1`, [oldName, newName]);
        if (expSubcatsAll[oldName]) {
          expSubcatsAll[newName] = expSubcatsAll[oldName];
          delete expSubcatsAll[oldName];
          await saveStoredCategories('expense_subcategories', expSubcatsAll);
        }
        if (expSelectedCategory === oldName) expSelectedCategory = newName;
      } else if (key === 'cash_extra_categories') {
        // категория Кассы — переносим операции на новое название
        await db(`update cash_ledger_raw set category=$2 where category=$1`, [oldName, newName]);
        if (cashConfig[oldName]) {
          cashConfig[newName] = cashConfig[oldName];
          delete cashConfig[oldName];
          await saveCashCategoryConfig(cashConfig);
        }
      } else if (key === 'custom_buildings') {
        // здание — переносим уже занесённые операции с этим корреспондентом на новое название
        await db(`update cash_ledger_raw set corresponent=$2 where corresponent=$1`, [oldName, newName]);
      }
      showMsg('categoriesMsg', `«${oldName}» переименована в «${newName}»`, 'ok');
      renderCategoriesSettings();
    });
  });
}

function renderAppearanceSettings() {
  const content = document.getElementById('settingsContent');
  content.innerHTML = `
    ${infoBoxHtml('settings')}
    <div class="color-row">
      <label>Фон бокового меню</label>
      <input type="color" id="colSidebar">
    </div>
    <div class="color-row">
      <label>Акцентный цвет (кнопки)</label>
      <input type="color" id="colAccent">
    </div>
    <div class="color-row">
      <label>Фон страницы</label>
      <input type="color" id="colPage">
    </div>
    <button class="btn" id="saveColorsBtn">Сохранить</button>
    <button class="btn secondary" id="resetColorsBtn">Сбросить по умолчанию</button>
    <span id="settingsMsg"></span>

    <div style="margin-top:28px;padding-top:20px;border-top:1px solid var(--border);">
      <div style="font-weight:700;margin-bottom:10px;">Шрифт таблиц</div>
      <div style="display:flex;align-items:center;gap:10px;max-width:340px;">
        <input type="range" id="tblFontSlider" min="12" max="20" step="1" value="15" style="flex:1;">
        <span id="tblFontVal" style="font-weight:700;font-size:14px;min-width:40px;">15px</span>
      </div>
    </div>
  `;

  document.getElementById('colSidebar').value = rgbToHex(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-bg')) || '#141e33';
  document.getElementById('colAccent').value = rgbToHex(getComputedStyle(document.documentElement).getPropertyValue('--accent')) || '#075985';
  document.getElementById('colPage').value = rgbToHex(getComputedStyle(document.documentElement).getPropertyValue('--page-bg')) || '#f3f7f8';

  const currentPx = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tbl-font')) || 15;
  document.getElementById('tblFontSlider').value = currentPx;
  document.getElementById('tblFontVal').textContent = currentPx + 'px';
  document.getElementById('tblFontSlider').addEventListener('input', async (e) => {
    const px = e.target.value;
    document.getElementById('tblFontVal').textContent = px + 'px';
    document.documentElement.style.setProperty('--tbl-font', px + 'px');
    await db(`
      insert into settings (key, value) values ('tbl_font_size', $1)
      on conflict (key) do update set value = $1, updated_at = now()
    `, [JSON.stringify({ px: Number(px) })]);
  });

  document.getElementById('saveColorsBtn').addEventListener('click', async () => {
    const sidebar = document.getElementById('colSidebar').value;
    const accent = document.getElementById('colAccent').value;
    const page = document.getElementById('colPage').value;
    applyColors({ sidebar, accent, page });
    try {
      await db(`
        insert into settings (key, value) values ('theme_colors', $1)
        on conflict (key) do update set value = $1, updated_at = now()
      `, [JSON.stringify({ sidebar, accent, page })]);
      showMsg('settingsMsg', 'Сохранено', 'ok');
    } catch (err) {
      showMsg('settingsMsg', 'Ошибка: ' + err.message, 'err');
    }
  });

  document.getElementById('resetColorsBtn').addEventListener('click', () => {
    applyColors({ sidebar: '#141e33', accent: '#075985', page: '#f3f7f8' });
    renderAppearanceSettings();
  });
}

function applyColors({ sidebar, accent, page }) {
  document.documentElement.style.setProperty('--nav-bg', sidebar);
  document.documentElement.style.setProperty('--sidebar-bg', sidebar);
  document.documentElement.style.setProperty('--accent', accent);
  document.documentElement.style.setProperty('--bg', page);
  document.documentElement.style.setProperty('--page-bg', page);
  document.documentElement.style.setProperty('--sb-text', contrastColor(sidebar) === '#111827' ? '#0f1720' : '#c3cbdb');
  document.documentElement.style.setProperty('--text-on-sidebar', contrastColor(sidebar));
  document.documentElement.style.setProperty('--text-on-accent', contrastColor(accent));
}

function contrastColor(hex) {
  const c = hex.replace('#', '');
  const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
  const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
  return luminance > 0.6 ? '#111827' : '#ffffff';
}

function rgbToHex(rgbStr) {
  rgbStr = (rgbStr || '').trim();
  if (rgbStr.startsWith('#')) return rgbStr;
  const m = rgbStr.match(/\d+/g);
  if (!m) return null;
  return '#' + m.slice(0,3).map(n => Number(n).toString(16).padStart(2,'0')).join('');
}

async function loadSavedColors() {
  try {
    const rows = await db(`select value from settings where key='theme_colors'`);
    if (rows.length > 0) applyColors(rows[0].value);
  } catch (e) { /* таблицы ещё может не быть при первом запуске — молча пропускаем */ }
}

async function loadSavedTableFont() {
  try {
    const rows = await db(`select value from settings where key='tbl_font_size'`);
    if (rows.length > 0 && rows[0].value.px) {
      document.documentElement.style.setProperty('--tbl-font', rows[0].value.px + 'px');
    }
  } catch (e) { /* нет ещё такой настройки — используем дефолт из CSS */ }
}
