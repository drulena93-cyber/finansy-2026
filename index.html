// Кэш "тяжёлых" запросов по ВСЕЙ истории (не зависят от того, какой месяц/здание сейчас
// открыто в Сводке) — раньше эти три запроса (вся история rent_periods/utility_periods,
// весь депозитный приход из Кассы за всё время) перезапрашивались заново при каждом
// переключении месяца или здания, хотя сами данные не меняются просто от переключения
// вкладки — именно это было основной причиной долгой загрузки Сводки. Кэшируется на
// сессию, сбрасывается вызовом invalidateArendaHistoryCache() везде, где эти данные
// реально могли измениться (сохранение правок в Сводке, операции в Кассе, "Досчитать
// пропущенное", массовое сопоставление имён).
let arendaHistoryCache = null;
let arendaHistoryFetchPromise = null;
async function getArendaHistoryData() {
  if (arendaHistoryCache) return arendaHistoryCache;
  if (arendaHistoryFetchPromise) return arendaHistoryFetchPromise; // уже грузится параллельным вызовом — ждём тот же промис, а не начинаем ещё один
  arendaHistoryFetchPromise = (async () => {
    const [allRentHistory, allUtilHistory, allDepositIncomeRaw, allRentPaidRaw, allUtilPaidRaw, allTenants, tenantObjAll] = await Promise.all([
      db(`select tenant_id, tenant_object_id, tenant_name, period, opening_debt, accrued, closing_debt, deposit_opening, deposit_closing, deposit_writeoff from rent_periods order by period asc`),
      db(`select tenant_id, tenant_object_id, tenant_name, period, opening_debt, accrued, closing_debt, deposit_writeoff from utility_periods order by period asc`),
      db(`select corresponent, tenant_object_id, coalesce(for_period, period) as target_period, amount from cash_ledger_raw
          where direction='income' and category ilike '%депозит%' and corresponent is not null`),
      // Вся история реальных оплат аренды/коммуналки по КАЛЕНДАРНОМУ месяцу платежа (не по
      // тому, за какой месяц зачтено) — та же логика, что и у текущего месяца в "Всего
      // оплачено", но по всей истории сразу. Нужна, чтобы "Долг на начало" считать
      // накопительно, а не читать напрямую сохранённое opening_debt (оно бывает устаревшим).
      db(`select corresponent, tenant_object_id, period, amount from cash_ledger_raw
          where direction='income' and category = $1 and corresponent is not null`, [RENT_INCOME_CATEGORY]),
      db(`select corresponent, tenant_object_id, period, amount from cash_ledger_raw
          where direction='income' and category = $1 and corresponent is not null`, [UTILITY_INCOME_CATEGORY]),
      // Список арендаторов и объектов — не зависит от месяца, раньше запрашивался заново
      // на каждый вызов getArenda2026Rows (лишние 2 запроса × 12-24 месяца при Годовой
      // сводке/Должниках).
      db(`select id, name, status, last_synced_at from tenants_sync`),
      db(`select id as tenant_object_id, tenant_id, object_name, office, building from tenant_objects`),
    ]);
    arendaHistoryCache = { allRentHistory, allUtilHistory, allDepositIncomeRaw, allRentPaidRaw, allUtilPaidRaw, allTenants, tenantObjAll };
    arendaHistoryFetchPromise = null;
    return arendaHistoryCache;
  })();
  return arendaHistoryFetchPromise;
}
function invalidateArendaHistoryCache() { arendaHistoryCache = null; }

async function getArenda2026Rows(period) {
  const [historyData, cashRentRaw, cashUtilRaw, accrualRentRows, accrualUtilRows, closedMap, cashRentAllTime, cashUtilAllTime] = await Promise.all([
    getArendaHistoryData(),
    db(`select corresponent, account, amount, tenant_object_id from cash_ledger_raw
        where direction='income' and category = $2
          and corresponent is not null and coalesce(for_period, period) = $1`, [period, RENT_INCOME_CATEGORY]),
    db(`select corresponent, account, amount, tenant_object_id from cash_ledger_raw
        where direction='income' and category = $2
          and corresponent is not null and coalesce(for_period, period) = $1`, [period, UTILITY_INCOME_CATEGORY]),
    db(`select * from rent_periods where period = $1 order by updated_at desc nulls last`, [period]),
    db(`select * from utility_periods where period = $1 order by updated_at desc nulls last`, [period]),
    getFinanceClosedMap(),
    // "Всего оплачено" — сколько реально пришло денег именно в этом календарном месяце,
    // независимо от того, за какой месяц это зачтено (в отличие от "Опл. за месяц",
    // которая смотрит на привязку for_period). Специально НЕ coalesce(for_period, period).
    db(`select corresponent, amount, tenant_object_id from cash_ledger_raw
        where direction='income' and category = $2 and corresponent is not null and period = $1`, [period, RENT_INCOME_CATEGORY]),
    db(`select corresponent, amount, tenant_object_id from cash_ledger_raw
        where direction='income' and category = $2 and corresponent is not null and period = $1`, [period, UTILITY_INCOME_CATEGORY]),
  ]);
  // Вся история по rent_periods/utility_periods (не только прошлый месяц) — нужна, чтобы
  // "Долг на начало" и "Начислено" переносились дальше даже через месяцы, где по
  // арендатору вообще ничего не сохранялось. Для "Депозит на начало" эта история
  // используется иначе — как источник САМОЙ РАННЕЙ записи (базовая точка), см. ниже.
  // Депозит приход — из Кассы, за ВСЁ время: нужен, чтобы считать "Депозит на начало"
  // накопительно от базовой точки, а не полагаться на сохранённое deposit_closing
  // прошлого месяца (оно не всегда актуально — см. ниже).
  const { allRentHistory, allUtilHistory, allDepositIncomeRaw, allRentPaidRaw, allUtilPaidRaw, allTenants, tenantObjAll } = historyData;

  const tenantByKey = {};
  allTenants.forEach(t => {
    const key = normalizeName(t.name);
    const existing = tenantByKey[key];
    if (!existing || (existing.status !== 'active' && t.status === 'active') ||
        (existing.status === t.status && new Date(t.last_synced_at || 0) > new Date(existing.last_synced_at || 0))) {
      tenantByKey[key] = t;
    }
  });
  const tenantById = {};
  allTenants.forEach(t => { tenantById[t.id] = t; });

  // Один арендатор может занимать НЕСКОЛЬКО разных помещений (объектов) — тогда каждое
  // помещение получает свою отдельную строку в Сводке ("identity"), а не схлопывается
  // в одну запись по имени. У арендаторов с одним (или без) помещением — как раньше,
  // одна запись без уточнения.
  const objectsByTenant = {};
  const objectById = {};
  tenantObjAll.forEach(o => {
    (objectsByTenant[o.tenant_id] = objectsByTenant[o.tenant_id] || []).push(o);
    objectById[o.tenant_object_id] = o;
  });
  const identityInfo = {};
  function getIdentity(tenantId, tenantObjectId, fallbackNameKey) {
    let key, resolvedObjectId;
    if (tenantId) {
      const objs = objectsByTenant[tenantId] || [];
      if (objs.length > 1) {
        key = tenantObjectId ? `${tenantId}::${tenantObjectId}` : `${tenantId}::unassigned`;
        resolvedObjectId = tenantObjectId || null;
      } else {
        key = tenantId;
        resolvedObjectId = objs[0] ? objs[0].tenant_object_id : null; // однозначно — арендатор с одним помещением
      }
    } else {
      key = 'name::' + fallbackNameKey;
      resolvedObjectId = null;
    }
    if (!identityInfo[key]) identityInfo[key] = { tenantId, tenantObjectId: resolvedObjectId, nameKey: fallbackNameKey };
    return key;
  }

  function aggregatePayments(rawRows) {
    const map = {};
    rawRows.forEach(r => {
      const nameKey = normalizeName(r.corresponent);
      const tenant = tenantByKey[nameKey];
      const identity = getIdentity(tenant ? tenant.id : null, r.tenant_object_id, nameKey);
      if (!map[identity]) map[identity] = { display_name: r.corresponent, total: 0, cash: 0, noncash: 0 };
      const amt = Number(r.amount) || 0;
      map[identity].total += amt;
      if (r.account === 'Касса нал') map[identity].cash += amt;
      else map[identity].noncash += amt;
    });
    return map;
  }
  const rentPaidMap = aggregatePayments(cashRentRaw);
  const utilPaidMap = aggregatePayments(cashUtilRaw);

  function sumByIdentity(rawRows) {
    const map = {};
    rawRows.forEach(r => {
      const nameKey = normalizeName(r.corresponent);
      const tenant = tenantByKey[nameKey];
      const identity = getIdentity(tenant ? tenant.id : null, r.tenant_object_id, nameKey);
      map[identity] = (map[identity] || 0) + (Number(r.amount) || 0);
    });
    return map;
  }
  const rentPaidTotalByKey = sumByIdentity(cashRentAllTime);
  const utilPaidTotalByKey = sumByIdentity(cashUtilAllTime);

  // Самая свежая запись СТРОГО ДО просматриваемого месяца — по ней переносим "Долг на
  // начало", "Начислено" и "Депозит на начало" дальше, даже если между ними есть месяцы,
  // где по арендатору вообще ничего не сохранялось (раньше перенос ломался именно на
  // таких "пропущенных" месяцах — искали только на один месяц назад).
  function buildLatestBeforeMap(historyRows) {
    const map = {};
    historyRows.forEach(r => {
      if (r.period >= period) return;
      const identity = getIdentity(r.tenant_id, r.tenant_object_id, normalizeName(r.tenant_name));
      const existing = map[identity];
      if (!existing || r.period > existing.period) map[identity] = r;
    });
    return map;
  }
  const latestRentBefore = buildLatestBeforeMap(allRentHistory);
  const latestUtilBefore = buildLatestBeforeMap(allUtilHistory);

  // Депозит на начало — считаем НАКОПИТЕЛЬНО от самой ранней записи по этому арендатору+
  // объекту (это и есть "стартовая сумма", внесённая один раз в самом начале — либо вручную,
  // либо через миграцию), плюс все операции по Кассе (категория "депозит") между этой
  // точкой и просматриваемым месяцем, минус все списания за то же время. Раньше "Депозит
  // на начало" читался напрямую из сохранённого deposit_closing прошлого месяца — но эта
  // колонка обновляется только при РУЧНОМ редактировании строки в Сводке, а при
  // автосоздании строки из Кассы никогда не считается и не сохраняется, поэтому цепочка
  // переноса регулярно обрывалась. Накопительный расчёт от одной твёрдой точки этого
  // не боится — ему не важно, что происходило с промежуточными месяцами.
  const earliestRentRow = {};
  allRentHistory.forEach(r => {
    const identity = getIdentity(r.tenant_id, r.tenant_object_id, normalizeName(r.tenant_name));
    if (!earliestRentRow[identity]) earliestRentRow[identity] = r; // allRentHistory отсортирована по period asc — первая встреченная запись и есть самая ранняя
  });
  function buildPerPeriodMap(rows, periodKey, amountKey, identityFn) {
    const map = {};
    rows.forEach(r => {
      const identity = identityFn(r);
      if (!map[identity]) map[identity] = {};
      map[identity][r[periodKey]] = (map[identity][r[periodKey]] || 0) + (Number(r[amountKey]) || 0);
    });
    return map;
  }
  const depositIncomeByPeriodMap = buildPerPeriodMap(allDepositIncomeRaw, 'target_period', 'amount', r => {
    const nameKey = normalizeName(r.corresponent);
    const tenant = tenantByKey[nameKey];
    return getIdentity(tenant ? tenant.id : null, r.tenant_object_id, nameKey);
  });
  const depositExpenseByPeriodMap = buildPerPeriodMap(allRentHistory, 'period', 'deposit_writeoff', r =>
    getIdentity(r.tenant_id, r.tenant_object_id, normalizeName(r.tenant_name))
  );
  function computeCumulativeDepositOpening(identity) {
    const baseline = earliestRentRow[identity];
    const incomeMap = depositIncomeByPeriodMap[identity] || {};
    const expenseMap = depositExpenseByPeriodMap[identity] || {};
    // Депозитная операция в Кассе НИКОГДА не создаёт строку в rent_periods (уходит в
    // отдельную, старую таблицу security_deposits) — поэтому если в первый месяц у
    // арендатора была ТОЛЬКО депозитная операция (без аренды/коммуналки, которая создала
    // бы строку), самая ранняя строка в Журнале могла оказаться ПОЗЖЕ, чем самый ранний
    // реальный депозитный приход. Берём точку отсчёта по тому, что раньше — по строке
    // из Журнала или по самой ранней депозитной операции в Кассе.
    const depositPeriods = Object.keys(incomeMap);
    const earliestDepositPeriod = depositPeriods.length ? depositPeriods.sort()[0] : null;

    let p, total;
    if (baseline && (!earliestDepositPeriod || baseline.period <= earliestDepositPeriod)) {
      p = baseline.period;
      total = Number(baseline.deposit_opening) || 0;
    } else if (earliestDepositPeriod) {
      p = earliestDepositPeriod;
      total = 0; // до самой первой депозитной операции по нему ничего не было
    } else if (baseline) {
      p = baseline.period;
      total = Number(baseline.deposit_opening) || 0;
    } else {
      return 0; // ни строки в Журнале, ни депозитных операций вообще — начинаем с нуля
    }

    let guard = 0; // защита от зацикливания на случай испорченного периода
    while (p < period && guard < 600) {
      total += (incomeMap[p] || 0) - (expenseMap[p] || 0);
      p = shiftPeriod(p, 1);
      guard++;
    }
    return total;
  }

  // Долг на начало (аренда/коммуналка) — та же логика, что и депозит: считаем накопительно
  // от точки отсчёта (самая ранняя запись в истории), а не читаем напрямую сохранённое
  // opening_debt текущей строки. Раньше при наличии реальной строки за месяц долг брался
  // прямо из неё — но если это поле хоть раз записалось неверно (а на протяжении разработки
  // такие моменты были — не все пути создания/правки строк одинаково хорошо наследовали
  // долг с прошлого месяца), ошибка так и оставалась навсегда, пока её не поправят вручную.
  // Накопительный расчёт от реальной истории начислений и оплат устойчив к этому — ему не
  // важно, что когда-то записалось в опредёленную строку, только фактическая история.
  const earliestUtilRow = {};
  allUtilHistory.forEach(r => {
    const identity = getIdentity(r.tenant_id, r.tenant_object_id, normalizeName(r.tenant_name));
    if (!earliestUtilRow[identity]) earliestUtilRow[identity] = r;
  });
  const rentAccruedByPeriodMap = buildPerPeriodMap(allRentHistory, 'period', 'accrued', r =>
    getIdentity(r.tenant_id, r.tenant_object_id, normalizeName(r.tenant_name))
  );
  const rentWriteoffByPeriodMap = depositExpenseByPeriodMap; // "Списан депозит" у аренды — уже посчитан выше
  const rentPaidHistByPeriodMap = buildPerPeriodMap(allRentPaidRaw, 'period', 'amount', r => {
    const nameKey = normalizeName(r.corresponent);
    const tenant = tenantByKey[nameKey];
    return getIdentity(tenant ? tenant.id : null, r.tenant_object_id, nameKey);
  });
  const utilAccruedByPeriodMap = buildPerPeriodMap(allUtilHistory, 'period', 'accrued', r =>
    getIdentity(r.tenant_id, r.tenant_object_id, normalizeName(r.tenant_name))
  );
  const utilWriteoffByPeriodMap = buildPerPeriodMap(allUtilHistory, 'period', 'deposit_writeoff', r =>
    getIdentity(r.tenant_id, r.tenant_object_id, normalizeName(r.tenant_name))
  );
  const utilPaidHistByPeriodMap = buildPerPeriodMap(allUtilPaidRaw, 'period', 'amount', r => {
    const nameKey = normalizeName(r.corresponent);
    const tenant = tenantByKey[nameKey];
    return getIdentity(tenant ? tenant.id : null, r.tenant_object_id, nameKey);
  });
  function computeCumulativeOpeningGeneric(identity, baselineMap, accruedMap, paidMap, writeoffMap) {
    const baseline = baselineMap[identity];
    // Как и с депозитом — если реальная активность (начисление или оплата) началась РАНЬШЕ
    // самой ранней строки в базе (например, единственная существующая строка создалась
    // только в момент первого начисления/оплаты аренды, а платёж пришёл ещё раньше), точку
    // отсчёта нужно сдвинуть на самый ранний реальный месяц активности, а не слепо
    // использовать значение из более поздней строки для более раннего месяца.
    const activityPeriods = [
      ...Object.keys(accruedMap[identity] || {}),
      ...Object.keys(paidMap[identity] || {}),
    ];
    const earliestActivityPeriod = activityPeriods.length ? activityPeriods.sort()[0] : null;

    let p, total, carryAccrued;
    if (baseline && (!earliestActivityPeriod || baseline.period <= earliestActivityPeriod)) {
      p = baseline.period;
      total = Number(baseline.opening_debt) || 0;
      carryAccrued = Number(baseline.accrued) || 0;
    } else if (earliestActivityPeriod) {
      p = earliestActivityPeriod;
      total = 0; // до самой первой реальной активности по нему ничего не было
      carryAccrued = 0;
    } else if (baseline) {
      p = baseline.period;
      total = Number(baseline.opening_debt) || 0;
      carryAccrued = Number(baseline.accrued) || 0;
    } else {
      return 0; // ни строки в базе, ни активности вообще — начинаем с нуля
    }

    let guard = 0;
    // "Начислено" в реальности переносится месяц-в-месяц, пока не введено новое значение
    // (ровно так же, как это уже показывается в самой Сводке) — а не 0 в те месяцы, где нет
    // отдельной строки в базе. Раньше формула брала начисление только там, где есть явная
    // строка, из-за чего в "виртуальных" месяцах долг занижался на сумму начисления.
    while (p < period && guard < 600) {
      const explicitAccrued = (accruedMap[identity] || {})[p];
      if (explicitAccrued !== undefined) carryAccrued = explicitAccrued;
      const paid = (paidMap[identity] || {})[p] || 0;
      const writeoff = (writeoffMap[identity] || {})[p] || 0;
      total += carryAccrued - paid - writeoff;
      p = shiftPeriod(p, 1);
      guard++;
    }
    return total;
  }
  function computeCumulativeRentOpening(identity) {
    return computeCumulativeOpeningGeneric(identity, earliestRentRow, rentAccruedByPeriodMap, rentPaidHistByPeriodMap, rentWriteoffByPeriodMap);
  }
  function computeCumulativeUtilOpening(identity) {
    return computeCumulativeOpeningGeneric(identity, earliestUtilRow, utilAccruedByPeriodMap, utilPaidHistByPeriodMap, utilWriteoffByPeriodMap);
  }

  function accrualByIdentity(rawRows) {
    const map = {};
    rawRows.forEach(a => {
      const identity = getIdentity(a.tenant_id, a.tenant_object_id, normalizeName(a.tenant_name));
      if (!map[identity]) map[identity] = a;
    });
    return map;
  }
  const accrualRentByKey = accrualByIdentity(accrualRentRows);
  const accrualUtilByKey = accrualByIdentity(accrualUtilRows);

  const allKeys = new Set([
    ...Object.keys(rentPaidMap), ...Object.keys(utilPaidMap),
    ...Object.keys(accrualRentByKey), ...Object.keys(accrualUtilByKey),
  ]);
  // Ни один активный арендатор (и ни одно его помещение) не должен "пропадать" из Сводки
  // только потому, что за этот месяц по нему ещё нет операций — принудительно добавляем
  // всех активных (по каждому их помещению отдельно), и архивных, пока их явно не
  // "закрыли" кнопкой в интерфейсе.
  allTenants.forEach(t => {
    const eligible = t.status === 'active' || (t.status === 'archived' && (!closedMap[t.id] || period < closedMap[t.id]));
    if (!eligible) return;
    const objs = objectsByTenant[t.id] || [];
    if (objs.length > 1) {
      objs.forEach(o => allKeys.add(getIdentity(t.id, o.tenant_object_id, normalizeName(t.name))));
    } else {
      allKeys.add(getIdentity(t.id, objs[0] ? objs[0].tenant_object_id : null, normalizeName(t.name)));
    }
  });

  // "Закрытые" вручную арендаторы, а также арендаторы, полностью удалённые из CRM
  // (статус 'deleted' — см. sync-tenants.js) — убираем их из Сводки полностью, даже если
  // в базе для этого месяца УЖЕ существует прежняя (обычно нулевая, ничем с тех пор не
  // тронутая) строка. Раньше проверка "eligible" выше применялась только к принудительному
  // добавлению, а уже существующую запись из rent_periods/utility_periods не прятала —
  // поэтому такой арендатор мог продолжать показываться. Исключение — если в этом месяце
  // по нему реально прошли деньги (Касса), тогда показываем всё равно, чтобы не спрятать
  // реальное движение денег.
  [...allKeys].forEach(identity => {
    const info = identityInfo[identity];
    const tId = info ? info.tenantId : null;
    if (!tId) return;
    const isClosed = closedMap[tId] && period >= closedMap[tId];
    const isDeletedFromCrm = tenantById[tId] && tenantById[tId].status === 'deleted';
    if (!isClosed && !isDeletedFromCrm) return;
    const hasRealMoney = rentPaidMap[identity] || utilPaidMap[identity];
    if (!hasRealMoney) allKeys.delete(identity);
  });

  const rows = [...allKeys].map(identity => {
    const info = identityInfo[identity] || { tenantId: null, tenantObjectId: null, nameKey: identity.replace(/^name::/, '') };
    const ar = accrualRentByKey[identity];
    const au = accrualUtilByKey[identity];
    const tenant = info.tenantId ? tenantById[info.tenantId] : null;
    const rp = rentPaidMap[identity];
    const up = utilPaidMap[identity];

    const tenantId = info.tenantId || null;
    const tenantObjectId = info.tenantObjectId || null;
    const name = (tenant && tenant.name) || (ar && ar.tenant_name) || (au && au.tenant_name) || (rp && rp.display_name) || (up && up.display_name) || info.nameKey;

    const latestRent = latestRentBefore[identity];
    const latestUtil = latestUtilBefore[identity];
    const rentOpening = computeCumulativeRentOpening(identity);
    const utilOpening = computeCumulativeUtilOpening(identity);
    // "Начислено" обычно из месяца в месяц одно и то же (аренда/коммуналка не меняются
    // каждый месяц) — если в этом месяце своего значения не введено, берём последнее
    // введённое ранее (сколько угодно месяцев назад), а не считаем нулём.
    const rentAccrued = ar ? Number(ar.accrued) || 0 : (latestRent ? Number(latestRent.accrued) || 0 : 0);
    const utilAccrued = au ? Number(au.accrued) || 0 : (latestUtil ? Number(latestUtil.accrued) || 0 : 0);
    // Списание депозита у коммуналки — теперь только вручную (раньше тянулось из Кассы).
    const utilDepWo = au ? Number(au.deposit_writeoff) || 0 : 0;
    // Списание депозита у аренды — новое поле, тоже только вручную. То же число показано
    // и в блоке "Депозит" как "Депозит расход" (см. depositExpense ниже) — это одна и та
    // же цифра, просто видна в двух местах.
    const rentDepWo = ar ? Number(ar.deposit_writeoff) || 0 : 0;
    const rentPaid = rp ? rp.total : 0;
    const utilPaidAmt = up ? up.total : 0;
    const utilPaidTotal = utilPaidTotalByKey[identity] || 0;
    const rentPaidTotal = rentPaidTotalByKey[identity] || 0;
    // Долг на конец по аренде — через "Всего оплачено" (реальные деньги за календарный
    // месяц) минус "Списан депозит".
    const rentClosing = rentOpening + rentAccrued - rentPaidTotal - rentDepWo;
    // Долг на конец по коммуналке — через "Всего оплачено", минус свой Спис.деп.
    const utilClosing = utilOpening + utilAccrued - utilPaidTotal - utilDepWo;

    // Депозит — 4 поля, перенос месяц-в-месяц так же, как "Долг на начало/конец":
    // на начало (накопительно от базовой точки — см. computeCumulativeDepositOpening),
    // приход (из Кассы за этот месяц), расход (= Списан депозит у аренды выше),
    // итог = на начало + приход - расход.
    const depositOpening = computeCumulativeDepositOpening(identity);
    const depositIncome = (depositIncomeByPeriodMap[identity] || {})[period] || 0;
    const depositExpense = rentDepWo;
    const depositClosing = depositOpening + depositIncome - depositExpense;

    return {
      id: (ar && ar.id) || (au && au.id) || ('virtual-' + identity),
      rp_id: ar ? ar.id : null,
      up_id: au ? au.id : null,
      tenant_id: tenantId,
      tenant_object_id: tenantObjectId,
      name,
      tenantMismatch: !tenant,
      status: tenant ? tenant.status : null,
      closed_from: tenantId ? (closedMap[tenantId] || null) : null,
      object_name: null, office: null,
      deposit_opening: depositOpening, deposit_income: depositIncome,
      deposit_expense: depositExpense, deposit_closing: depositClosing,
      rent_opening: rentOpening, rent_accrued: rentAccrued, rent_paid: rentPaid,
      rent_paid_total: rentPaidTotal,
      rent_paid_cash: rp ? rp.cash : 0, rent_paid_noncash: rp ? rp.noncash : 0,
      rent_deposit_wo: rentDepWo,
      rent_closing: rentClosing,
      util_opening: utilOpening, util_accrued: utilAccrued, util_paid: utilPaidAmt,
      util_paid_total: utilPaidTotal,
      util_paid_cash: up ? up.cash : 0, util_paid_noncash: up ? up.noncash : 0,
      util_deposit_wo: utilDepWo, util_closing: utilClosing,
      total_debt: rentClosing + utilClosing,
      updated_at: (ar && ar.updated_at) || (au && au.updated_at) || null,
    };
  });

  rows.forEach(r => {
    if (r.tenant_object_id && objectById[r.tenant_object_id]) {
      r.object_name = objectById[r.tenant_object_id].object_name;
      r.office = objectById[r.tenant_object_id].office;
      r.real_building = objectById[r.tenant_object_id].building;
    }
  });

  const tenantIdsForArchive = [...new Set(rows.map(r => r.tenant_id).filter(Boolean))];
  if (tenantIdsForArchive.length > 0) {
    const archRows = await db(`
      select tenant_id, max(date) as archived_date from tenant_archive_log
      where tenant_id = any($1::uuid[]) and action='archived'
      group by tenant_id
    `, [tenantIdsForArchive]);
    const archByTenant = {};
    archRows.forEach(a => { archByTenant[a.tenant_id] = a.archived_date; });
    rows.forEach(r => { r.archived_date = r.tenant_id ? archByTenant[r.tenant_id] : null; });
  }

  rows.sort((a, b) => a.name.localeCompare(b.name));

  const buildingMap = await getTenantObjectBuildingMap();
  const manualOverrides = await getManualBuildingOverrides();
  rows.forEach(r => { r.building = resolveBuilding(r.real_building, buildingMap, r.tenant_object_id, r.object_name, r.tenant_id, manualOverrides); r.manualBuilding = !!(r.tenant_id && manualOverrides[r.tenant_id] && !r.real_building && !(r.tenant_object_id && buildingMap[r.tenant_object_id])); });

  return rows;
}

// Разбивка "Всего оплачено" по ▸: сколько из денег, внесённых В ТЕКУЩЕМ выбранном месяце,
// было зачтено за каждый конкретный месяц года (обычно один месяц, но бывают авансы на
// несколько месяцев вперёд или доплаты за прошлые долги — тогда сумма распределяется).
// Выгрузка Сводки "Аренда 2026" в Excel — по одному листу на каждый месяц выбранного
// года, ровно те же столбцы и цифры, что видно на экране.
async function exportArendaYearToExcel(year) {
  const btn = document.getElementById('arendaExportBtn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Собираю файл…'; }
  try {
    const wb = XLSX.utils.book_new();
    const headerRow = ['Арендатор', 'Здание', 'Объект', ...ARENDA_COLS.map(c => c.label)];
    for (let m = 1; m <= 12; m++) {
      const period = `${year}-${String(m).padStart(2, '0')}`;
      const rows = await getArenda2026Rows(period);
      rows.sort((a, b) => (a.building || '').localeCompare(b.building || '') || a.name.localeCompare(b.name));
      const sheetRows = [headerRow, ...rows.map(r => [
        r.name, r.building || '', shortObjectLabel(combineObjectFields(r.object_name, r.office)),
        ...ARENDA_COLS.map(c => Number(r[c.key]) || 0),
      ])];
      const ws = XLSX.utils.aoa_to_sheet(sheetRows);
      XLSX.utils.book_append_sheet(wb, ws, periodLabel(period).replace(' ' + year, '').slice(0, 31));
    }
    XLSX.writeFile(wb, `Аренда ${year} — Сводка по месяцам.xlsx`);
  } catch (err) {
    alert('Не удалось собрать файл: ' + err.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '📥 Выгрузить в Excel'; }
  }
}

// Выгружает в Excel ровно то, что сейчас видно в Журнале операций Кассы — с учётом
// поиска, фильтра по направлению/категории и текущего периода/счёта (window.__rawCashVisibleRows
// заполняется внутри renderRawCashRows на каждую перерисовку).
// Выгружает Годовую сводку (Общие данные) целиком — один лист, арендаторы строками,
// на каждый показанный сейчас месяц по 6 колонок (Начислено/Аванс/Оплачено/Списан
// депозит/Итого оплачено/Долг). Всегда по всем зданиям — фильтр по зданию на экране
// на выгрузку не влияет.
async function exportArendaYearSummaryToExcel(data) {
  const btn = document.getElementById('arendaYearExportBtn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Собираю файл…'; }
  try {
    const { tenantsData, periods: allPeriodsRaw } = data;
    const monthsCfg = await getColumnSettings('arenda-year-months');
    const hiddenLabels = new Set(monthsCfg.hidden || []);
    const periods = allPeriodsRaw.filter(p => !hiddenLabels.has(periodLabel(p)));
    const avansMap = await getArendaYearAvansMap();

    const header = ['Здание', 'Арендатор', 'Объект', 'Депозит общий'];
    periods.forEach(p => {
      const lbl = periodLabel(p);
      header.push(`${lbl} — Начислено`, `${lbl} — Аванс`, `${lbl} — Оплачено`, `${lbl} — Списан депозит`, `${lbl} — Итого оплачено`, `${lbl} — Долг`);
    });

    const tenants = Object.values(tenantsData).sort((a, b) =>
      (a.building || '').localeCompare(b.building || '') || a.name.localeCompare(b.name));
    const sheetRows = [header, ...tenants.map(t => {
      const row = [t.building || '', t.name, t.object || '', t.deposit || 0];
      periods.forEach(p => {
        const pm = t.perMonth[p] || { accrued: 0, paid: 0, depositWo: 0 };
        const avansValue = (avansMap[t.identity] && avansMap[t.identity][p]) || 0;
        const totalPaid = (pm.paid || 0) + avansValue + (pm.depositWo || 0);
        const debtValue = (pm.accrued || 0) - totalPaid;
        row.push(pm.accrued || 0, avansValue, pm.paid || 0, pm.depositWo || 0, totalPaid, debtValue);
      });
      return row;
    })];
    const ws = XLSX.utils.aoa_to_sheet(sheetRows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Годовая сводка');
    XLSX.writeFile(wb, `Общие данные ${arenda2026Year} — Годовая сводка.xlsx`);
  } catch (err) {
    alert('Не удалось собрать файл: ' + err.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '📥 Выгрузить в Excel'; }
  }
}

async function exportRawCashJournalToExcel() {
  const btn = document.getElementById('rawCashExportBtn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Собираю файл…'; }
  try {
    // Всегда весь указанный год разом (не только открытый сейчас месяц) — с учётом
    // текущих фильтров: счёт, поиск, направление, категория.
    const searchEl = document.getElementById('rawCashSearch');
    const dirFilterEl = document.getElementById('rawCashDirFilter');
    const catFilterEl = document.getElementById('rawCashCategoryFilter');
    const q = (searchEl ? searchEl.value : '').trim().toLowerCase();
    const dirFilter = dirFilterEl ? dirFilterEl.value : '';
    const catFilter = catFilterEl ? catFilterEl.value : '';

    let rows = await db(`
      select * from cash_ledger_raw
      where period like $1 and ($2::text is null or account=$2)
      order by date, created_at
    `, [`${rawCashYear}-%`, rawCashAccount || null]);
    if (q) {
      rows = rows.filter(r =>
        (r.corresponent || '').toLowerCase().includes(q) ||
        (r.purpose || '').toLowerCase().includes(q) ||
        (r.category || '').toLowerCase().includes(q) ||
        (r.subcategory || '').toLowerCase().includes(q));
    }
    if (dirFilter === 'transfer') rows = rows.filter(r => r.category === TRANSFER_CATEGORY);
    else if (dirFilter) rows = rows.filter(r => r.direction === dirFilter && r.category !== TRANSFER_CATEGORY);
    if (catFilter) rows = rows.filter(r => r.category === catFilter);

    if (rows.length === 0) { alert('Нечего выгружать — список операций пуст.'); return; }
    const objRows = await db(`select id as tenant_object_id, object_name, office from tenant_objects`);
    const objLabelById = {};
    objRows.forEach(o => { objLabelById[o.tenant_object_id] = shortObjectLabel(combineObjectFields(o.object_name, o.office)); });

    const headerRow = ['Дата', 'Банк', 'Корреспондент', 'Объект', 'Назначение платежа', 'Категория', 'За месяц', 'Приход', 'Расход', 'Перевод +', 'Перевод −'];
    const sheetRows = [headerRow, ...rows.map(r => {
      const isTransfer = r.category === TRANSFER_CATEGORY;
      const income = !isTransfer && r.direction === 'income' ? Number(r.amount) || 0 : 0;
      const expense = !isTransfer && r.direction === 'expense' ? Number(r.amount) || 0 : 0;
      const transferIn = isTransfer && r.direction === 'income' ? Number(r.amount) || 0 : 0;
      const transferOut = isTransfer && r.direction === 'expense' ? Number(r.amount) || 0 : 0;
      return [
        r.date || '', r.account || '', r.corresponent || '',
        r.tenant_object_id ? (objLabelById[r.tenant_object_id] || '') : '',
        r.purpose || '', r.category || '', r.for_period ? periodLabel(r.for_period) : '',
        income, expense, transferIn, transferOut,
      ];
    })];
    const ws = XLSX.utils.aoa_to_sheet(sheetRows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Операции');
    const label = `${rawCashYear}`;
    XLSX.writeFile(wb, `Касса и банки — ${label.replace(/[\\/*?:[\]]/g, '')}.xlsx`);
  } catch (err) {
    alert('Не удалось собрать файл: ' + err.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '📥 Выгрузить в Excel'; }
  }
}


async function getRentPaidByMonth(tenantName, tenantObjectId, currentPeriod) {
  const rows = await db(`
    select coalesce(for_period, period) as target_period, sum(amount) as amount
    from cash_ledger_raw
    where direction='income' and category = $4
      and replace(trim(lower(corresponent)), '.', '') = replace(trim(lower($1)), '.', '')
      and ($2::uuid is null or tenant_object_id = $2::uuid)
      and period = $3
    group by target_period
  `, [tenantName, tenantObjectId || null, currentPeriod, RENT_INCOME_CATEGORY]);
  const byMonth = {};
  rows.forEach(r => { byMonth[r.target_period] = Number(r.amount) || 0; });
  return byMonth;
}

// Матрица "арендатор × месяц" для одного здания — суммы за ВЕСЬ год сразу, каждая ячейка
// показывает, за какой месяц зачтён платёж (по for_period), а не когда он реально внесён —
// поэтому аванс, внесённый в августе за сентябрь, попадёт в столбец "сентябрь".
async function getRentMatrixForBuilding(buildingRows, year) {
  const raw = await db(`
    select corresponent, tenant_object_id, coalesce(for_period, period) as target_period, period, account, amount, date
    from cash_ledger_raw
    where direction='income' and category = $2
      and corresponent is not null and coalesce(for_period, period) like $1
  `, [year + '-%', RENT_INCOME_CATEGORY]);

  const norm = s => String(s || '').trim().toLowerCase().replace(/\./g, '');
  const nameCount = {};
  buildingRows.forEach(r => { const nk = norm(r.name); nameCount[nk] = (nameCount[nk] || 0) + 1; });
  const identityByMatchKey = {};
  buildingRows.forEach(r => {
    const nk = norm(r.name);
    identityByMatchKey[nk + '::' + (r.tenant_object_id || '')] = r;
    if (nameCount[nk] === 1) identityByMatchKey[nk + '::'] = r; // однозначно, если у арендатора один объект
  });

  const matrix = {};
  buildingRows.forEach(r => { matrix[r.id] = {}; });
  raw.forEach(row => {
    const nk = norm(row.corresponent);
    const identity = identityByMatchKey[nk + '::' + (row.tenant_object_id || '')] || identityByMatchKey[nk + '::'];
    if (!identity) return;
    if (!matrix[identity.id][row.target_period]) matrix[identity.id][row.target_period] = { total: 0, items: [] };
    matrix[identity.id][row.target_period].total += Number(row.amount) || 0;
    matrix[identity.id][row.target_period].items.push(row);
  });
  return matrix;
}

function isPageHiddenInMenu(pageKey) {
  return menuConfig.some(sec =>

  ].filter(t => !isPageHiddenInMenu(t.pageKey));
  // Если текущая скрытая вкладка почему-то осталась активной (например, её скрыли только

  `;
  document.getElementById('arendaPageTabs').addEventListener('click', (e) => {

    if (!tab) return;
    // "Должники" — отдельная страница (не часть внутреннего состояния этой вкладки),

    document.querySelector('h1').textContent = `Общие данные ${arenda2026Year} — ${viewTitles[arenda2026View]}`;
    document.getElementById('arendaPeriodBlock').style.display = arenda2026View !== 'summary' ? 'none' : '';

  });
  document.getElementById('arendaExportBtn').addEventListener('click', () => exportArendaYearToExcel(arenda2026Year));

  const yearTabsEl = document.getElementById('arendaYearTabs');
  const periodTabsEl = document.getElementById('arendaPeriodTabs');
  // Годы — от 2025 и до (текущий реальный год + 3), список сам растёт с течением времени,
  // ничего вручную каждый год подправлять не нужно.
  function renderYearTabs() {
    const minYear = 2025;

      `<div class="month-tab ${y === arenda2026Year ? 'active' : ''}" data-year="${y}">${y}</div>`

    periodTabsEl.innerHTML = opts.map(p =>
      `<div class="month-tab ${p === arenda2026Period ? 'active' : ''}" data-period="${p}">${periodLabel(p).replace(' ' + arenda2026Year, '')}</div>`
    ).join('');
  }
  renderYearTabs();
  renderPeriodTabs();
  yearTabsEl.addEventListener('click', (e) => {
    const tab = e.target.closest('.month-tab');
    if (!tab) return;
    arenda2026Year = Number(tab.dataset.year);
    // При смене года остаёмся на том же месяце, если он есть; иначе — январь.
    arenda2026Period = `${arenda2026Year}-${arenda2026Period.slice(5, 7)}`;
    document.querySelector('h1').textContent = `Общие данные ${arenda2026Year} — ${viewTitles[arenda2026View]}`;
    renderYearTabs();
    renderPeriodTabs();
    renderArenda2026View();
  });
  periodTabsEl.addEventListener('click', (e) => {
    const tab = e.target.closest('.month-tab');
    if (!tab) return;
    arenda2026Period = tab.dataset.period;
    renderPeriodTabs();
    renderArenda2026View();
  });

  await renderArenda2026View();
}

      <span id="arendaMsg"></span>
    </div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:10px;">Редактировать вручную можно «Депозит на начало», «Долг на начало», «Начислено» и «Списан депозит»/«Спис.деп.» — «Оплачено», «Депозит приход/расход/итог» и «Долг на конец» всегда автоматические.</div>
    <div id="arendaSummaryWrap">Загрузка…</div>
  `;
  window.__reloadCurrentTable = () => { if (window.__arendaAllRows) renderArendaSummaryTable(window.__arendaAllRows); };
  await loadArenda2026Summary();
}

async function loadArenda2026Summary() {
  const wrap = document.getElementById('arendaSummaryWrap');
  wrap.innerHTML = 'Загрузка…';
  try {
    const [allRows, realBuildings] = await Promise.all([
      getArenda2026Rows(arenda2026Period),
      getRealCrmBuildings(),
      getColumnSettings('arenda-summary'), // заранее — иначе первая строка заголовка (цветные группы) успевает отрисоваться раньше, чем известно, какие столбцы скрыты, и съезжает
    ]);
    window.__arendaAllRows = allRows;

    // Здания показываем ВСЕ, где вообще есть (или были) арендаторы — а не только те, у
    // кого в этом конкретном месяце есть операции, иначе здание с закрытыми/выехавшими
    // арендаторами пропадает из Сводки, хотя должно быть видно.
    const buildingsFromRows = new Set(allRows.map(r => r.building));
    let buildings = sortByExcelOrder([...new Set([...realBuildings, ...buildingsFromRows])].filter(b => b !== 'Не определено'));
    if (buildingsFromRows.has('Не определено')) buildings.push('Не определено');
    buildings = await applySavedTabOrder('arenda-buildings', buildings);
    window.__arendaAllBuildings = buildings;

    const buildingTabsEl = document.getElementById('arendaBuildingTabs');
    function renderBuildingTabs() {
      buildingTabsEl.innerHTML =
        `<div class="month-tab ${!arenda2026Building ? 'active' : ''}" data-building="" data-tab-value="">Все здания</div>
        <button class="rent-matrix-open-btn" data-building="" style="border:1px solid var(--border);background:var(--surface);cursor:pointer;border-radius:5px;padding:1px 5px;font-size:12px;line-height:1.5;margin-left:-2px;margin-right:4px;" title="Оплата аренды всех арендаторов по всем зданиям, по месяцам">📊</button>` +
        buildings.map(b => `<div class="month-tab ${b === arenda2026Building ? 'active' : ''}" data-building="${escHtml(b)}" data-tab-value="${escHtml(b)}">${escHtml(b)}</div>`).join('') +
        `<span style="display:inline-flex;align-items:center;gap:6px;margin-left:4px;">
          <input type="text" id="arendaTenantSearch" placeholder="🔍 Поиск по арендатору…" style="width:170px;" value="${escHtml(arendaTenantSearch)}">
          <button class="icon-btn" id="arendaEditToggleBtn" title="Редактировать" style="${arenda2026EditMode ? 'display:none;' : ''}">✏️</button>
          <button class="btn" id="arendaSaveBtn" style="display:${arenda2026EditMode ? '' : 'none'};background:var(--green);">💾 Сохранить</button>
          <button class="btn secondary" id="arendaCancelBtn" style="display:${arenda2026EditMode ? '' : 'none'};">✕ Отмена</button>
          <button class="icon-btn" id="arendaColVisBtn" title="Столбцы">👁️</button>
        </span>`;
      bindDraggableTabs(buildingTabsEl);
      buildingTabsEl.querySelectorAll('.rent-matrix-open-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          showRentMatrixModal(btn.dataset.building || null);
        });
      });
      document.getElementById('arendaColVisBtn').addEventListener('click', (e) => {
        showColumnVisibilityMenu('arenda-summary', ['Арендатор/Здание', 'Объект', 'Действие', ...ARENDA_COLS.map(arendaColKey)], e.target);
      });
      document.getElementById('arendaEditToggleBtn').addEventListener('click', () => {
        arenda2026EditMode = true;
        arendaPendingEdits = {};
        renderBuildingTabs();
        renderArendaSummaryTable(window.__arendaAllRows);
      });
      const saveBtnEl = document.getElementById('arendaSaveBtn');
      if (saveBtnEl) saveBtnEl.addEventListener('click', async () => {
        // Если сейчас в фокусе поле ввода — сначала явно снимаем с него фокус, чтобы
        // последняя набранная (но ещё не "отблюренная") правка тоже попала в черновик.
        if (document.activeElement && document.activeElement.classList.contains('arenda-edit')) {
          document.activeElement.blur();
        }
        saveBtnEl.disabled = true;
        saveBtnEl.textContent = 'Сохраняю…';
        try {
          const ids = Object.keys(arendaPendingEdits);
          for (const id of ids) {
            const row = (window.__arendaAllRows || []).find(r => r.id === id);
            if (!row) continue;
            if (row.rp_id) {
              await db(`update rent_periods set opening_debt=$2, accrued=$3, deposit_writeoff=$4, deposit_opening=$5, deposit_closing=$6, closing_debt=$7, updated_at=now() where id=$1`,
                [row.rp_id, row.rent_opening, row.rent_accrued, row.rent_deposit_wo, row.deposit_opening, row.deposit_closing, row.rent_closing]);
            } else {
              const inserted = await db(`
                insert into rent_periods (tenant_id, tenant_object_id, tenant_name, period, opening_debt, accrued, paid, deposit_writeoff, deposit_opening, deposit_closing, closing_debt)
                values ($1,$2,$3,$4,$5,$6,0,$7,$8,$9,$10)
                returning id
              `, [row.tenant_id || null, row.tenant_object_id || null, row.name, arenda2026Period, row.rent_opening, row.rent_accrued, row.rent_deposit_wo, row.deposit_opening, row.deposit_closing, row.rent_closing]);
              row.rp_id = inserted[0].id;
            }
            if (row.up_id) {
              await db(`update utility_periods set opening_debt=$2, accrued=$3, deposit_writeoff=$4, closing_debt=$5, updated_at=now() where id=$1`,
                [row.up_id, row.util_opening, row.util_accrued, row.util_deposit_wo, row.util_closing]);
            } else {
              const insertedU = await db(`
                insert into utility_periods (tenant_id, tenant_object_id, tenant_name, period, opening_debt, accrued, paid, deposit_writeoff, closing_debt)
                values ($1,$2,$3,$4,$5,$6,0,$7,$8)
                returning id
              `, [row.tenant_id || null, row.tenant_object_id || null, row.name, arenda2026Period, row.util_opening, row.util_accrued, row.util_deposit_wo, row.util_closing]);
              row.up_id = insertedU[0].id;
            }
          }
          showMsg('arendaMsg', `Сохранено изменений: ${ids.length}`, 'ok');
          arendaPendingEdits = {};
          arenda2026EditMode = false;
          invalidateArendaHistoryCache();
          loadArenda2026Summary();
        } catch (err) {
          showMsg('arendaMsg', 'Ошибка сохранения: ' + err.message, 'err');
        } finally {
          saveBtnEl.disabled = false;
          saveBtnEl.textContent = '💾 Сохранить';
        }
      });
      const cancelBtnEl = document.getElementById('arendaCancelBtn');
      if (cancelBtnEl) cancelBtnEl.addEventListener('click', () => {
        arendaPendingEdits = {};
        arenda2026EditMode = false;
        showMsg('arendaMsg', 'Изменения отменены', 'ok');
        loadArenda2026Summary(); // перезагружаем с сервера — все черновые правки в памяти отбрасываются
      });
      document.getElementById('arendaTenantSearch').addEventListener('input', (e) => {
        arendaTenantSearch = e.target.value;
        if (window.__arendaAllRows) renderArendaSummaryTable(window.__arendaAllRows);
      });
    }
    renderBuildingTabs();
    makeTabsDraggable(buildingTabsEl, 'arenda-buildings', (newOrder) => {
      buildings = newOrder.filter(Boolean);
      renderBuildingTabs();
    });
    buildingTabsEl.addEventListener('click', (e) => {
      const tab = e.target.closest('.month-tab');
      if (!tab) return;
      arenda2026Building = tab.dataset.building || null;
      renderBuildingTabs();
      renderArendaSummaryTable(allRows);
    });

    if (allRows.length === 0) {
      wrap.innerHTML = `<div class="empty-state">За ${periodLabel(arenda2026Period)} записей ещё нет.</div>`;
      return;
    }
    renderArendaSummaryTable(allRows);
  } catch (err) {
    wrap.innerHTML = `<div class="status-msg err">Ошибка: ${err.message}</div>`;
  }
}

function renderArendaSummaryTable(allRows) {
  const wrap = document.getElementById('arendaSummaryWrap');
  const buildingsFromRows = [...new Set(allRows.map(r => r.building))];
  const buildings = sortByExcelOrder([...new Set([...(window.__arendaAllBuildings || []), ...buildingsFromRows])]);
  const visibleBuildings = arenda2026Building ? buildings.filter(b => b === arenda2026Building) : buildings;
  const search = arendaTenantSearch.trim().toLowerCase();
  const forceOpen = !!arenda2026Building || !!search;

  const grand = {};
  ARENDA_COLS.forEach(c => { grand[c.key] = allRows.reduce((s, r) => s + (Number(r[c.key]) || 0), 0); });

  const crmUrl = CRM_URL;

  function tenantRowHtml(r, b) {
    const obj = shortObjectLabel(combineObjectFields(r.object_name, r.office));
    // Раньше подсветка появлялась только со следующего месяца после archived_date — теперь
    // сразу же, как только статус в CRM стал архивным, без задержки на месяц.
    const isArchived = r.status === 'archived';
    let actionCell = '';
    if (isArchived) {
      actionCell += `<span class="badge archived" style="background:var(--red-bg);color:var(--red);font-size:10px;">выехал</span> `;
    }
    // "Закрыть" доступна по наличию tenant_id, а не только у архивных — раньше кнопка
    // появлялась только при isArchived, но этот статус берётся из локальной копии CRM
    // (tenants_sync), которая может отставать от реальной CRM (тогда кнопки вообще не
    // было, хотя человек уже съехал). Явный бейдж "✓ Закрыт" — чтобы сразу было видно,
    // жала ли ты уже эту кнопку по этому арендатору, не гадая.
    if (r.tenant_id) {
      if (r.closed_from) {
        actionCell += `<span class="badge" style="background:var(--green-bg);color:var(--green);font-size:10px;" title="С ${periodLabel(r.closed_from)} больше не показывается автоматически, пока по нему нет реальных операций">✓ Закрыт с ${periodLabel(r.closed_from)}</span> <button class="row-delete-btn arenda-reopen-tenant-btn" data-tenant-id="${escHtml(r.tenant_id)}" title="Отменить закрытие — снова начнёт показываться автоматически">↺</button> `;
      } else {
        actionCell += `<button class="btn secondary arenda-close-tenant-btn" data-tenant-id="${escHtml(r.tenant_id)}" title="Пометить, что по нему всё сверено — со следующего месяца перестанет показываться автоматически" style="padding:0 6px;font-size:10px;">Закрыть</button> `;
      }
    }
    if (r.manualBuilding) {
      actionCell += `<span class="badge" style="background:var(--accent-l);color:var(--accent);font-size:10px;" title="Здание привязано вручную в Сводке — арендатора нет в CRM ни в одном помещении">📌 вручную</span> <button class="row-delete-btn arenda-unassign-building-btn" data-tenant-id="${escHtml(r.tenant_id || '')}" title="Убрать ручную привязку — вернётся в «Не определено»">✕</button>`;
    } else if (b === 'Не определено' && r.tenant_id) {
      const buildingsForPicker = (window.__arendaAllBuildings || []).filter(bld => bld && bld !== 'Не определено');
      actionCell += `<span style="display:inline-flex;align-items:center;gap:3px;">
        <select class="arenda-assign-building-select" data-tenant-id="${escHtml(r.tenant_id)}" style="font-size:11px;padding:2px 4px;max-width:140px;">
          <option value="">— здание —</option>
          ${buildingsForPicker.map(bld => `<option value="${escHtml(bld)}">${escHtml(bld)}</option>`).join('')}
        </select>
        <button class="btn secondary arenda-assign-building-btn" data-tenant-id="${escHtml(r.tenant_id)}" title="В CRM у него нет объекта — привязать здание вручную только в этом портале" style="padding:0 6px;font-size:10px;">Привязать</button>
      </span>`;
    }
    return `<tr class="arenda-summary-tenant-row" data-building-sub="${escHtml(b)}" data-id="${escHtml(r.id)}" style="${forceOpen ? '' : 'display:none;'}${isArchived ? 'background:var(--red-bg);' : ''}">
      <td style="padding-left:28px;font-size:13px;">
        <a href="${crmUrl}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;border-bottom:1px dashed var(--text3);">${escHtml(r.name)}</a>
        ${r.tenantMismatch ? ` <span class="badge" style="background:var(--red-bg);color:var(--red);font-size:10px;" title="Такого арендатора нет в CRM">⚠️</span>` : ''}
      </td>
      <td data-col-key="Объект" style="font-size:12px;color:var(--text2);">${escHtml(obj)}</td>
      <td data-col-key="Действие">${actionCell}</td>
      ${ARENDA_COLS.map(c => {
        if (c.key === 'rent_paid_total') {
          return `<td class="group-${c.group}"><a href="#" class="arenda-drill-link" data-key="${c.key}" data-tenant="${escHtml(r.name)}" title="Сколько реально пришло денег от этого арендатора именно в этом месяце — независимо от того, за какой месяц это зачтено" style="color:var(--green);font-weight:600;text-decoration:none;border-bottom:1px dashed currentColor;">${fmtMoney(r[c.key])}</a> <span class="arenda-months-toggle" data-row-id="${escHtml(r.id)}" data-tenant="${escHtml(r.name)}" data-tenant-object-id="${escHtml(r.tenant_object_id || '')}" title="По месяцам" style="cursor:pointer;color:var(--text3);font-size:11px;">▸</span></td>`;
        }
        if (c.key === 'util_paid_total') {
          return `<td class="group-${c.group}"><a href="#" class="arenda-drill-link" data-key="${c.key}" data-tenant="${escHtml(r.name)}" title="Сколько реально пришло денег от этого арендатора именно в этом месяце — независимо от того, за какой месяц это зачтено" style="color:var(--green);font-weight:600;text-decoration:none;border-bottom:1px dashed currentColor;">${fmtMoney(r[c.key])}</a></td>`;
        }
        if (c.editable && arenda2026EditMode) {
          return `<td class="group-${c.group} ${c.border ? 'border-left-thick' : ''}"><input type="number" class="arenda-edit" data-key="${c.key}" value="${r[c.key]}" style="width:80px;"></td>`;
        }
        const cls = ['group-' + c.group];
        if (c.border) cls.push('border-left-thick');
        if (Number(r[c.key]) < 0) cls.push('debt-negative');
        return `<td class="${cls.join(' ')}">${fmtMoney(r[c.key])}</td>`;
      }).join('')}
    </tr>
    <tr class="arenda-months-row" data-months-for="${escHtml(r.id)}" style="display:none;">
      <td colspan="${ARENDA_COLS.length + 3}" style="padding:8px 10px 12px 40px;background:var(--surface2);font-size:12.5px;"></td>
    </tr>`;
  }

  const sortArrow = (key) => arendaSortKey === key ? (arendaSortDir === 1 ? ' ▲' : ' ▼') : '';
  const hiddenColsSet = new Set((columnSettingsCache['arenda-summary'] && columnSettingsCache['arenda-summary'].hidden) || []);
  const leadingCells = ['Арендатор/Здание', 'Объект', 'Действие'].filter(k => !hiddenColsSet.has(k)).map(() => '<th></th>').join('');
  let html = `<div class="mirror-scroll"><table class="data-table sticky-first-col"><thead>
    <tr>${leadingCells}${ARENDA_GROUPS.map(g => `<th colspan="${arendaGroupColspan(g.key)}" class="group-header group-${g.key}">${g.label}</th>`).join('')}</tr>
    <tr><th class="sortable-col" data-sort-key="name" style="cursor:pointer;">Арендатор / Здание${sortArrow('name')}</th><th data-col-key="Объект">Объект</th><th data-col-key="Действие"></th>${ARENDA_COLS.map(c => `<th class="group-${c.group} ${c.border ? 'border-left-thick' : ''} sortable-col" data-sort-key="${c.key}" style="cursor:pointer;">${c.label}${c.hint ? ` <span style="cursor:help;color:var(--text3);font-weight:400;font-size:11px;border:1px solid var(--border2);border-radius:50%;width:13px;height:13px;display:inline-flex;align-items:center;justify-content:center;vertical-align:1px;" title="${escHtml(c.hint)}" onclick="event.stopPropagation()">i</span>` : ''}${sortArrow(c.key)}${(c.editable && arenda2026EditMode) ? ' ✏️' : ''}</th>`).join('')}</tr>
  </thead><tbody>`;

  if (!arenda2026Building && !search) {
    html += `<tr class="tots-row"><td><strong>ИТОГО ПО ВСЕМ ЗДАНИЯМ</strong></td><td></td><td></td>${ARENDA_COLS.map(c => arendaDrillCell(c.key, grand[c.key], {})).join('')}</tr>`;
  }

  let anyShown = false;
  let visibleRowsForSave = [];

  // Предрасчёт сумм по каждому зданию — нужен, если сортируем именно по зданиям
  const buildingSumsMap = {};
  for (const b of visibleBuildings) {
    let bRows = allRows.filter(r => r.building === b);
    if (search) bRows = bRows.filter(r => r.name.toLowerCase().includes(search));
    const bSum = { name: b };
    ARENDA_COLS.forEach(c => { bSum[c.key] = bRows.reduce((s, r) => s + (Number(r[c.key]) || 0), 0); });
    buildingSumsMap[b] = { bSum, bRows };
  }
  let orderedBuildings = search ? visibleBuildings.filter(b => buildingSumsMap[b].bRows.length > 0) : visibleBuildings;
  if (arendaSortKey) {
    orderedBuildings.sort((a, b) => {
      const av = buildingSumsMap[a].bSum[arendaSortKey];
      const bv = buildingSumsMap[b].bSum[arendaSortKey];
      if (arendaSortKey === 'name') return av.localeCompare(bv) * arendaSortDir;
      return ((Number(av) || 0) - (Number(bv) || 0)) * arendaSortDir;
    });
  }

  for (const b of orderedBuildings) {
    let { bSum, bRows } = buildingSumsMap[b];
    anyShown = true;
    visibleRowsForSave = visibleRowsForSave.concat(bRows);
    if (arendaSortKey) {
      bRows = bRows.slice().sort((a, c) => {
        if (arendaSortKey === 'name') return a.name.localeCompare(c.name) * arendaSortDir;
        return ((Number(a[arendaSortKey]) || 0) - (Number(c[arendaSortKey]) || 0)) * arendaSortDir;
      });
    }
    html += `<tr class="arenda-summary-building-toggle arenda-building-total-row" data-building-toggle="${escHtml(b)}" style="cursor:pointer;">
      <td><span class="metric-arrow">${forceOpen ? '▾' : '▸'}</span> <strong>${escHtml(b)}</strong> <span style="color:var(--text3);font-weight:400;">(${bRows.length})</span> <button class="rent-matrix-open-btn" data-building="${escHtml(b)}" style="border:1px solid var(--border);background:var(--surface);cursor:pointer;border-radius:5px;padding:1px 5px;font-size:12px;line-height:1.5;margin-left:6px;" title="Оплата аренды всех арендаторов этого здания по месяцам">📊</button></td>
      <td></td><td></td>
      ${ARENDA_COLS.map(c => arendaDrillCell(c.key, bSum[c.key], { building: b })).join('')}
    </tr>`;
    for (const r of bRows) html += tenantRowHtml(r, b);
  }
  if (!anyShown) {
    html += `<tr><td colspan="${ARENDA_COLS.length + 3}"><div class="empty-state">Ничего не найдено</div></td></tr>`;
  }
  html += '</tbody></table></div>';
  wrap.innerHTML = html;

  const firstHeadRow = wrap.querySelector('table thead tr:first-child');
  const secondHeadRow = wrap.querySelector('table thead tr:nth-child(2)');
  if (firstHeadRow && secondHeadRow) {
    const h = firstHeadRow.getBoundingClientRect().height;
    secondHeadRow.querySelectorAll('th').forEach(th => { th.style.top = h + 'px'; });
  }

  makeTableColumnsAdjustable(wrap.querySelector('table'), 'arenda-summary', (th, i) => i === 0 ? 'Арендатор/Здание' : i === 1 ? 'Объект' : i === 2 ? 'Действие' : arendaColKey(ARENDA_COLS[i - 3]));

  wrap.querySelectorAll('.sortable-col').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.sortKey;
      arendaSortDir = (arendaSortKey === key) ? -arendaSortDir : 1;
      arendaSortKey = key;
      renderArendaSummaryTable(allRows);
    });
  });

  wrap.querySelectorAll('.arenda-close-tenant-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const tenantId = btn.dataset.tenantId;
      if (!tenantId) {
        showMsg('arendaMsg', 'У этого арендатора нет связки с CRM — закрыть по ID нельзя', 'err');
        return;
      }
      if (!confirm('По этому арендатору всё сверено и закрыто? Со следующего месяца он перестанет автоматически показываться в Сводке.')) return;
      try {
        await setFinanceClosedTenant(tenantId, shiftPeriod(arenda2026Period, 1));
        showMsg('arendaMsg', 'Закрыто — со следующего месяца не будет показываться', 'ok');
        loadArenda2026Summary();
      } catch (err) {
        showMsg('arendaMsg', 'Ошибка: ' + err.message, 'err');
      }
    });
  });

  wrap.querySelectorAll('.arenda-reopen-tenant-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const tenantId = btn.dataset.tenantId;
      if (!confirm('Отменить закрытие? Арендатор снова начнёт автоматически показываться в Сводке.')) return;
      try {
        await reopenFinanceClosedTenant(tenantId);
        showMsg('arendaMsg', 'Закрытие отменено', 'ok');
        loadArenda2026Summary();
      } catch (err) {
        showMsg('arendaMsg', 'Ошибка: ' + err.message, 'err');
      }
    });
  });

  wrap.querySelectorAll('.arenda-assign-building-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const tenantId = btn.dataset.tenantId;
      const sel = wrap.querySelector(`.arenda-assign-building-select[data-tenant-id="${CSS.escape(tenantId)}"]`);
      const building = sel ? sel.value : '';
      if (!building) {
        showMsg('arendaMsg', 'Сначала выбери здание из списка', 'err');
        return;
      }
      try {

        row.util_closing = row.util_opening + row.util_accrued - row.util_paid_total - row.util_deposit_wo;

// ============================================================
// СТРАНИЦА: Общие данные — Годовая сводка. Новая структура (по описанию пользователя,
// не помесячная Сводка развёрнутая в колонки): Здание / Арендатор / Объект / Депозит
// общий / далее по месяцам "Начислено" и "Оплачено". "Начислено" берётся из той же
// формулы, что и в обычной Сводке (getArenda2026Rows) — с переносом. "Оплачено" — не
// "сколько реально пришло денег в этот месяц", а сумма прихода, ПРИВЯЗАННАЯ к месяцу
// через поле "За месяц" (for_period) в Кассе. Сверху — три редактируемые строки
// ("Долг на конец", "Начислено", "Оплачено") с одним числом на каждый месяц — по
// умолчанию сумма по всем арендаторам, но их можно вручную переопределить.
// ============================================================
async function getArendaYearTopOverrides() {
  const rows = await db(`select key, value from settings where key like 'arenda_year_top:%'`);
  const map = {};
  rows.forEach(r => { map[r.key.slice('arenda_year_top:'.length)] = Number(r.value.amount) || 0; });
  return map;
}
async function saveArendaYearTopOverride(rowType, period, rawValue) {
  const key = `arenda_year_top:${rowType}:${period}`;
  if (rawValue === '') {
    await db(`delete from settings where key=$1`, [key]);
  } else {
    await db(`
      insert into settings (key, value) values ($1, $2)
      on conflict (key) do update set value = $2, updated_at = now()
    `, [key, JSON.stringify({ amount: Number(rawValue) || 0 })]);
  }
}

// "Аванс" в Годовой сводке — редактируется по каждому арендатору и месяцу отдельно (не
// общий на всех, как три строки сверху). Ключ включает идентичность арендатора (то же имя,
// что и normalizeName(name) + '::' + tenant_object_id, как в tenantsData) и месяц.
async function getArendaYearAvansMap() {
  const rows = await db(`select key, value from settings where key like 'arenda_year_avans:%'`);
  const map = {};
  rows.forEach(r => {
    const rest = r.key.slice('arenda_year_avans:'.length);
    const period = rest.slice(-7); // последние 7 символов — всегда "YYYY-MM"
    const identity = rest.slice(0, -8); // остальное (без разделителя ":") — идентичность арендатора
    if (!map[identity]) map[identity] = {};
    map[identity][period] = Number(r.value.amount) || 0;
  });
  return map;
}
async function saveArendaYearAvans(identity, period, rawValue) {
  const key = `arenda_year_avans:${identity}:${period}`;
  if (rawValue === '') {
    await db(`delete from settings where key=$1`, [key]);
  } else {
    await db(`
      insert into settings (key, value) values ($1, $2)
      on conflict (key) do update set value = $2, updated_at = now()
    `, [key, JSON.stringify({ amount: Number(rawValue) || 0 })]);
  }
}

async function loadArenda2026YearSummary() {
  const wrap = document.getElementById('arendaYearWrap');
  wrap.innerHTML = 'Загрузка…';
  try {
    const year = arenda2026Year;
    const periods = [];
    for (let m = 1; m <= 12; m++) periods.push(`${year}-${String(m).padStart(2, '0')}`);

    // "Начислено" и "Долг на конец" — те же самые, уже проверенные формулы, что и в обычной
    // помесячной Сводке: вызываем getArenda2026Rows на каждый месяц года. Все 12 вызовов —
    // параллельно (Promise.all), а не по очереди — раньше это было 12 последовательных
    // ожиданий подряд, отсюда и медленная загрузка. История (см. getArendaHistoryData)
    // защищена от повторной параллельной загрузки — посчитается один раз на все 12.
    const monthlyRowsList = await mapWithConcurrency(periods, 3, p => getArenda2026Rows(p));
    const monthlyRows = {};
    periods.forEach((p, i) => { monthlyRows[p] = monthlyRowsList[i]; });

    // "Оплачено" — отдельно: приход по категории аренды, привязанный к месяцу через
    // "За месяц" (for_period), а не по календарной дате самого платежа.
    const paidRaw = await db(`
      select corresponent, tenant_object_id, coalesce(for_period, period) as per, sum(amount) as total
      from cash_ledger_raw
      where direction='income' and category = $1 and corresponent is not null and coalesce(for_period, period) like $2
      group by corresponent, tenant_object_id, coalesce(for_period, period)
    `, [RENT_INCOME_CATEGORY, year + '-%']);
    const paidByKey = {};
    paidRaw.forEach(r => {
      const key = normalizeName(r.corresponent) + '::' + (r.tenant_object_id || '');
      if (!paidByKey[key]) paidByKey[key] = {};
      paidByKey[key][r.per] = (paidByKey[key][r.per] || 0) + (Number(r.total) || 0);
    });

    const tenantsData = {};
    periods.forEach(p => {
      monthlyRows[p].forEach(r => {
        const key = normalizeName(r.name) + '::' + (r.tenant_object_id || '');
        if (!tenantsData[key]) {
          tenantsData[key] = { name: r.name, identity: key, building: r.building, object: '', deposit: 0, perMonth: {} };
        }
        const t = tenantsData[key];
        t.building = r.building; // уточняется по ходу — виртуальные ранние месяцы могли быть "Не определено"
        if (r.object_name || r.office) t.object = shortObjectLabel(combineObjectFields(r.object_name, r.office));
        t.deposit = r.deposit_closing; // "Депозит общий" — берём как текущий итог (на последний посчитанный месяц)
        t.perMonth[p] = { accrued: Number(r.rent_accrued) || 0, closing: Number(r.rent_closing) || 0, paid: 0, depositWo: Number(r.rent_deposit_wo) || 0 };
      });
    });
    Object.keys(tenantsData).forEach(key => {
      const t = tenantsData[key];
      periods.forEach(p => {
        if (!t.perMonth[p]) t.perMonth[p] = { accrued: 0, closing: 0, paid: 0, depositWo: 0 };
        t.perMonth[p].paid = (paidByKey[key] && paidByKey[key][p]) || 0;
      });
    });

    const avansMap = await getArendaYearAvansMap();
    window.__arendaYearData = { tenantsData, periods, avansMap };

    let buildings = sortByExcelOrder([...new Set(Object.values(tenantsData).map(t => t.building))].filter(b => b !== 'Не определено'));
    if (Object.values(tenantsData).some(t => t.building === 'Не определено')) buildings.push('Не определено');
    const buildingTabsEl = document.getElementById('arendaYearBuildingTabs');
    function renderBuildingTabs() {
      buildingTabsEl.innerHTML =
        `<div class="month-tab ${!arenda2026Building ? 'active' : ''}" data-building="">Все здания</div>` +
        buildings.map(b => `<div class="month-tab ${b === arenda2026Building ? 'active' : ''}" data-building="${escHtml(b)}">${escHtml(b)}</div>`).join('');
    }
    renderBuildingTabs();
    buildingTabsEl.addEventListener('click', (e) => {
      const tab = e.target.closest('.month-tab');
      if (!tab) return;
      arenda2026Building = tab.dataset.building || null;
      renderBuildingTabs();
      renderArendaYearTable(window.__arendaYearData);
    });

    renderArendaYearTable(window.__arendaYearData);
  } catch (err) {
    wrap.innerHTML = `<div class="status-msg err">Ошибка: ${err.message}</div>`;
  }
}

async function renderArendaYearTable(data) {
  const wrap = document.getElementById('arendaYearWrap');
  const { tenantsData, periods: allPeriodsRaw, avansMap } = data;
  const search = arendaTenantSearch.trim().toLowerCase();
  const forceOpen = !!arenda2026Building || !!search;

  const monthsCfg = await getColumnSettings('arenda-year-months');
  const hiddenLabels = new Set(monthsCfg.hidden || []);
  const periods = allPeriodsRaw.filter(p => !hiddenLabels.has(periodLabel(p)));

  // Реальное число видимых подстолбцов на месяц (из 4: Начислено/Оплачено/Списан
  // депозит/Итого оплачено) — нужно, чтобы colspan у заголовка месяца и у трёх строк
  // сверху подстраивался под то, что скрыто через 👁️, а не всегда был равен 4 (иначе
  // при скрытии части подстолбцов всё "уезжает" вбок).
  const colCfg = await getColumnSettings('arenda-year-columns');
  const hiddenCols = new Set(colCfg.hidden || []);
  const monthSubKeys = ['Начислено', 'Аванс', 'Оплачено', 'Списан депозит', 'Итого оплачено', 'Долг'];
  const visibleSubColCount = Math.max(1, monthSubKeys.filter(k => !hiddenCols.has(k)).length);

  const allBuildings = sortByExcelOrder([...new Set(Object.values(tenantsData).map(t => t.building))]);
  const visibleBuildings = arenda2026Building ? allBuildings.filter(b => b === arenda2026Building) : allBuildings;

  function accruedSum(list, per) { return list.reduce((s, t) => s + ((t.perMonth[per] && t.perMonth[per].accrued) || 0), 0); }
  function paidSum(list, per) { return list.reduce((s, t) => s + ((t.perMonth[per] && t.perMonth[per].paid) || 0), 0); }
  function closingSum(list, per) { return list.reduce((s, t) => s + ((t.perMonth[per] && t.perMonth[per].closing) || 0), 0); }
  function depositWoSum(list, per) { return list.reduce((s, t) => s + ((t.perMonth[per] && t.perMonth[per].depositWo) || 0), 0); }
  function avansSum(list, per) { return list.reduce((s, t) => s + ((avansMap[t.identity] && avansMap[t.identity][per]) || 0), 0); }
  function totalPaidSum(list, per) { return paidSum(list, per) + avansSum(list, per) + depositWoSum(list, per); }
  function depositSum(list) { return list.reduce((s, t) => s + (t.deposit || 0), 0); }

  // tenantForLink — если передан конкретный арендатор (не итоговая строка по зданию/всем
  // зданиям), "Оплачено" и "Итого оплачено" становятся кликабельными ссылками в Кассу
  // (как и везде в обычной Сводке). "Начислено" и "Списан депозит" не ведут в Кассу — это
  // не кассовые операции (начисление — расчётная величина, списание депозита — ручное поле
  // в Журнале начислений, не в Кассе).
  function monthCellsHtml(list, tenantForLink) {
    return periods.map(per => {
      const av = accruedSum(list, per), pv = paidSum(list, per), dwv = depositWoSum(list, per);
      const avansValue = tenantForLink
        ? ((avansMap[tenantForLink.identity] && avansMap[tenantForLink.identity][per]) || 0)
        : list.reduce((s, t) => s + ((avansMap[t.identity] && avansMap[t.identity][per]) || 0), 0);
      const totalPaid = pv + avansValue + dwv; // Итого оплачено = Оплачено + Аванс + Списан депозит
      const debtValue = av - totalPaid; // Долг = Начислено − Итого оплачено
      const drillAttrs = tenantForLink ? `class="arenda-year-drill-link" data-tenant="${escHtml(tenantForLink.name)}" data-period="${per}"` : '';
      const linkStyle = 'color:inherit;text-decoration:none;border-bottom:1px dashed currentColor;';
      const paidCell = tenantForLink ? `<a href="#" ${drillAttrs} style="${linkStyle}">${fmtMoney(pv)}</a>` : fmtMoney(pv);
      const totalPaidCell = tenantForLink ? `<a href="#" ${drillAttrs} style="${linkStyle}">${fmtMoney(totalPaid)}</a>` : fmtMoney(totalPaid);
      // "Аванс" — редактируется по каждому арендатору и месяцу отдельно, но только в
      // режиме правки (кнопка "✏️" / "💾 Сохранить" / "✕ Отмена"), не сразу по потере
      // фокуса. В итоговых строках (по зданию/всем зданиям) — просто сумма, не редактируется.
      const avansCell = tenantForLink && arendaYearAvansEditMode
        ? `<input type="number" class="arenda-year-avans-edit" data-identity="${escHtml(tenantForLink.identity)}" data-period="${per}" data-original="${avansValue}" value="${avansValue}" style="width:90px;text-align:right;">`
        : fmtMoney(avansValue);
      const debtColor = debtValue < 0 ? 'var(--red)' : (debtValue > 0 ? 'var(--green)' : 'inherit');
      return `<td data-col-key="Начислено" class="border-left-heavy" style="text-align:right;">${fmtMoney(av)}</td><td data-col-key="Аванс" style="text-align:right;">${avansCell}</td><td data-col-key="Оплачено" style="text-align:right;">${paidCell}</td><td data-col-key="Списан депозит" style="text-align:right;">${fmtMoney(dwv)}</td><td data-col-key="Итого оплачено" style="text-align:right;font-weight:600;">${totalPaidCell}</td><td data-col-key="Долг" class="border-left-thick" style="text-align:right;font-weight:700;color:${debtColor};">${fmtMoney(debtValue)}</td>`;
    }).join('');
  }

  // Три редактируемые строки-итога ("Долг на конец", "Начислено", "Оплачено") — теперь
  // часть той же самой таблицы (не отдельный блок), чтобы колонки совпадали и прокрутка
  // была общей. Каждая ячейка занимает оба под-столбца месяца (colspan=2), т.к. у самих
  // этих строк нет разбивки на Начислено/Оплачено — это готовый общий итог.
  const allTenantsFlat = Object.values(tenantsData);

  // "Долг на конец" — просто сумма уже правильно посчитанного (накопительно, с учётом
  // "Долг на начало" каждого конкретного арендатора в обычной Сводке) закрывающего долга
  // по всем арендаторам. Ничего заново не считаем — берём то же число, что уже видно
  // построчно ниже (closingSum), просто суммируем по всем.
  // Три строки сверху — полностью автоматические (без ручного ввода/переопределения):
  // "Начислено" и "Оплачено" — отдельные суммы, "Долг на конец" — их разница. Считаются
  // по ТЕКУЩЕМУ фильтру (выбранное здание + поиск), а не всегда по всем зданиям сразу —
  // чтобы совпадали с тем, что показано в самой таблице под ними.
  let filteredForTop = allTenantsFlat;
  if (arenda2026Building) filteredForTop = filteredForTop.filter(t => t.building === arenda2026Building);
  if (search) filteredForTop = filteredForTop.filter(t => t.name.toLowerCase().includes(search));
  const topRowDefs = [
    { key: 'debt', label: 'Долг на конец', compute: (p) => accruedSum(filteredForTop, p) - totalPaidSum(filteredForTop, p) },
    { key: 'accrued', label: 'Начислено', compute: (p) => accruedSum(filteredForTop, p) },
    { key: 'paid', label: 'Оплачено', compute: (p) => totalPaidSum(filteredForTop, p) },
  ];
  const topRowsHtml = topRowDefs.map(r => `<tr style="background:var(--surface2);">
    <td style="font-weight:700;padding:3px 12px;">${r.label}</td><td></td><td></td>
    ${periods.map(p => {
      const value = r.compute(p);
      return `<td colspan="${visibleSubColCount}" style="text-align:center;padding:3px 8px;font-weight:700;">${fmtMoney(value)}</td>`;
    }).join('')}
  </tr>`).join('');

  let html = `<div class="mirror-scroll"><table class="data-table sticky-first-col" style="white-space:nowrap;"><thead>
    <tr>

  wrap.querySelectorAll('[data-col-key]').forEach(el => {

        } catch (err) {

        renderArendaYearTable(data);

  }

  wrap.querySelectorAll('.arenda-year-building-toggle').forEach(tr => {
    tr.addEventListener('click', () => {
      const b = tr.dataset.buildingToggle;
      const subRows = wrap.querySelectorAll(`[data-building-sub="${CSS.escape(b)}"]`);
      const arrow = tr.querySelector('.metric-arrow');

      subRows.forEach(sr => { sr.style.display = isOpen ? 'none' : ''; });

  wrap.querySelectorAll('.arenda-year-drill-link').forEach(a => {

let rawCashAccount = undefined;
let rawCashYear = null;
let cameFromCashSummary = false;
let cashSummaryScrollTarget = null;
let cashDrillDirection = null;
let cashDrillCategory = null;
let cashDrillFullYear = false; // true — перешли по сумме из режима "Весь год" в Сводке: Журнал должен показать весь год, без фильтра по месяцу
let rawCashRows = [];
// Черновые правки в режиме редактирования журнала Кассы — ничего не пишется в базу,
// пока явно не нажали "Сохранить". Ключ — id строки, значение — объект изменённых полей.
let rawCashPendingEdits = {};
let rawCashSort = { key: null, dir: 1 };
let rawCashEditMode = false;
let rawCashView = 'journal';
// Режим "Весь год" в обычной Сводке Кассы — показывает итоги за все 12 месяцев года
// разом, вместо одного выбранного месяца. Отдельно от "Годовой сводки" (там по-прежнему
// каждый месяц — своя колонка для помесячной сверки).
let rawCashSummaryFullYear = false;

const CASH_ACCOUNTS = ['Банк Эрия', 'Банк Дружинин', 'Касса нал'];

async function pageRawCash(view) {
  if (view) rawCashView = view;
  const existingPeriods = (await db(`select distinct period from cash_ledger_raw order by period`)).map(p => p.period);
  if (existingPeriods.length === 0) {
    main.innerHTML = `<h1>Касса и банки</h1>${infoBoxHtml('rawCash')}<div class="empty-state">Данных ещё нет. Прогони load_cash_ledger_raw.sql.</div>`;
    return;
  }
  if (!rawCashPeriod) rawCashPeriod = defaultPeriod(existingPeriods);
  rawCashYear = Number(rawCashPeriod.slice(0, 4));
  if (rawCashAccount === undefined) rawCashAccount = CASH_ACCOUNTS[0];

  const viewTitles = { summary: '— сводка', year: '— годовая сводка по счетам', journal: '— журнал операций' };
  main.innerHTML = `
    ${arendaReturnState ? `<button class="btn secondary" id="arendaReturnBtn" style="margin-bottom:10px;">← Назад в Сводку</button>` : ''}
    <div class="page-tabs" id="rawCashPageTabs">
      <div class="page-tab ${rawCashView === 'summary' ? 'active' : ''}" data-view="summary">Сводка</div>
      <div class="page-tab ${rawCashView === 'year' ? 'active' : ''}" data-view="year">Годовая сводка</div>
      <div class="page-tab ${rawCashView === 'journal' ? 'active' : ''}" data-view="journal">Журнал операций</div>
    </div>
    <h1>Касса и банки ${rawCashYear} ${viewTitles[rawCashView]}</h1>
    ${infoBoxHtml('rawCash')}
    <div id="rawCashPeriodBlock" style="${rawCashView === 'year' ? 'display:none;' : ''}">
      <div class="month-tabs" id="rawCashYearTabs" style="margin-bottom:0;"></div>
      <div class="month-tabs" id="rawCashPeriodTabs"></div>
    </div>
    <div id="rawCashContent"></div>
  `;

  if (arendaReturnState) {
    document.getElementById('arendaReturnBtn').addEventListener('click', () => {
      const state = arendaReturnState;
      arendaReturnState = null;
      arenda2026Period = state.period;
      arenda2026Building = state.building;
      arendaTenantSearch = state.search;
      navigateTo('arenda-summary');
    });
  }

  document.getElementById('rawCashPageTabs').addEventListener('click', (e) => {
    const tab = e.target.closest('.page-tab');
    if (!tab) return;
    rawCashView = tab.dataset.view;
    document.querySelectorAll('#rawCashPageTabs .page-tab').forEach(t => t.classList.toggle('active', t === tab));
    document.querySelector('h1').textContent = `Касса и банки ${rawCashYear} ${viewTitles[rawCashView]}`;
    document.getElementById('rawCashPeriodBlock').style.display = rawCashView === 'year' ? 'none' : '';
    renderPeriodTabs();
    renderRawCashView();
  });

  const yearTabsEl = document.getElementById('rawCashYearTabs');
  const periodTabsEl = document.getElementById('rawCashPeriodTabs');
  // Годы — от 2025 и до (текущий реальный год + 3), список сам растёт с течением времени.
  function renderYearTabs() {
    const minYear = 2025;
    const maxYear = new Date().getFullYear() + 3;
    const years = [];
    for (let y = minYear; y <= maxYear; y++) years.push(y);
    yearTabsEl.innerHTML = years.map(y =>
      `<div class="month-tab ${y === rawCashYear ? 'active' : ''}" data-year="${y}">${y}</div>`
    ).join('');
  }
  function renderPeriodTabs() {
    const periodList = [];
    for (let m = 1; m <= 12; m++) periodList.push(`${rawCashYear}-${String(m).padStart(2, '0')}`);
    let html = renderCollapsiblePeriodTabsHTML(periodList, rawCashSummaryFullYear ? '' : rawCashPeriod, 'cash');
    if (rawCashView === 'summary') {
      html += `<div class="month-tab ${rawCashSummaryFullYear ? 'active' : ''}" data-full-year="1" style="border-style:dashed;">📅 Весь год</div>`;
    }
    periodTabsEl.innerHTML = html;
  }
  renderYearTabs();
  renderPeriodTabs();
  yearTabsEl.addEventListener('click', (e) => {
    const tab = e.target.closest('.month-tab');
    if (!tab) return;
    rawCashYear = Number(tab.dataset.year);
    rawCashPeriod = `${rawCashYear}-${rawCashPeriod.slice(5, 7)}`;
    document.querySelector('h1').textContent = `Касса и банки ${rawCashYear} ${viewTitles[rawCashView]}`;
    renderYearTabs();
    renderPeriodTabs();
    renderRawCashView();
  });
  periodTabsEl.addEventListener('click', (e) => {
    if (e.target.closest('[data-toggle-months]')) {
      rawPagesShowAllMonths.cash = !rawPagesShowAllMonths.cash;
      renderPeriodTabs();
      return;
    }
    if (e.target.closest('[data-full-year]')) {
      rawCashSummaryFullYear = !rawCashSummaryFullYear;
      renderPeriodTabs();
      renderRawCashView();
      return;
    }
    const tab = e.target.closest('.month-tab');
    if (!tab || !tab.dataset.period) return;
    rawCashPeriod = tab.dataset.period;
    rawCashSummaryFullYear = false; // выбор конкретного месяца выключает режим "весь год"
    cashDrillFullYear = false;
    renderPeriodTabs();
    renderRawCashView();
  });

  await renderRawCashView();
}

function renderRawCashView() {
  if (rawCashView === 'summary') return renderRawCashSummary();
  if (rawCashView === 'year') return renderRawCashYearSummary();
  return renderRawCashJournal();
}
