<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Финансовый портал</title>
<link rel="manifest" href="data:application/json,{}">
<style>
@import url('/vendor/fonts.css');
:root {
  --bg: #f3f7f8; --surface: #ffffff; --surface2: #eef4f5; --border: #dfe8ea; --border2: #c1d2d6;
  --text: #0f1720; --text2: #45535c; --text3: #849098;
  --accent: #075985; --accent-l: #e0f7fa; --accent-d: #0c4a6e;
  --accent-bright: #5bc9eb;
  --nav-bg: #141e33; --sb-text: #c3cbdb; --sb-text-dim: #7d8aa3;
  --sb-border: rgba(255,255,255,.08); --sb-hover: rgba(255,255,255,.06);
  --green: #16a34a; --green-bg: #f0fdf4; --green-b: #bbf7d0;
  --red: #dc2626; --red-bg: #fef2f2; --red-b: #fecaca;
  --amber: #d97706; --amber-bg: #fffbeb; --amber-b: #fcd34d;
  --purple: #7c3aed; --purple-bg: #f5f3ff; --purple-b: #ddd6fe;
  --teal: #0d9488; --teal-bg: #f0fdfa; --teal-b: #99f6e4;
  --radius: 16px; --radius-sm: 10px; --radius-xs: 6px;
  --shadow: 0 1px 3px rgba(15,23,32,.07), 0 4px 14px rgba(15,23,32,.06);
  --shadow-md: 0 8px 28px rgba(15,23,32,.12);
  --tbl-font: 15px;
  /* совместимость со старыми именами переменных, использованными в скриптах */
  --sidebar-bg: var(--nav-bg);
  --page-bg: var(--bg);
  --text-on-sidebar: var(--sb-text);
  --text-on-accent: #ffffff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Calibri', 'Carlito', sans-serif;
  font-size: 16px; line-height: 1.5;
  background: var(--bg);
  color: var(--text);
  display: flex;
  min-height: 100vh;
}
h1 { font-family: 'Manrope', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -.4px; margin: 0 0 18px; color: var(--text); }

/* ===== Sidebar ===== */
#sidebar {
  background: var(--nav-bg);
  color: var(--sb-text);
  width: 240px;
  flex-shrink: 0;
  transition: width .2s ease;
  display: flex;
  flex-direction: column;
  padding: 12px 0;
}
#sidebar.collapsed { width: 60px; }
#sidebar .brand {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px 16px;
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: 17px;
  color: var(--accent-bright);
  border-bottom: 1px solid var(--sb-border);
  margin-bottom: 8px;
}
#sidebar.collapsed .brand span.label { display: none; }
#sidebar .toggle-btn {
  background: none; border: none; color: var(--sb-text-dim); cursor: pointer;
  font-size: 16px; padding: 4px;
}
.nav-section { margin-bottom: 4px; }
.nav-section-title {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; cursor: pointer; font-size: 15px; font-weight: 500;
  border-radius: var(--radius-sm); margin: 0 10px; color: var(--sb-text);
}
.nav-section-title:hover { background: var(--sb-hover); color: #fff; }
.nav-flat { display: flex; text-decoration: none; cursor: pointer; }
.nav-flat.active { background: var(--accent-bright); color: #04222d; font-weight: 700; }
#sidebar.collapsed .nav-section-title .label { display: none; }
.nav-sub { display: none; flex-direction: column; gap: 1px; margin: 2px 10px 2px 24px; padding-left: 14px; border-left: 2px solid var(--sb-border); }
.nav-section.open .nav-sub { display: flex; }
#sidebar.collapsed .nav-sub { display: none !important; }
.nav-sub a {
  color: var(--sb-text); text-decoration: none; padding: 7px 12px; border-radius: var(--radius-xs);
  font-size: 14px; font-weight: 500; cursor: pointer;
}
.nav-sub a:hover { background: var(--sb-hover); color: #fff; }
.nav-sub a.active { background: var(--accent-bright); color: #04222d; font-weight: 700; }

/* ===== Main ===== */
#main { flex: 1; padding: 24px 32px; overflow-x: auto; }
.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
select, input[type=text], input[type=number], input[type=date], input[type=month] {
  height: 36px; padding: 0 12px; border: 1.5px solid var(--border2); border-radius: var(--radius-xs); font-size: 15px;
  font-family: inherit; background: var(--surface); color: var(--text); outline: none; transition: border .12s;
}
select:focus, input:focus { border-color: var(--accent); }

/* Buttons: primary / secondary / danger — как .btn-p/.btn-g/.btn-d */
button.btn {
  height: 36px; background: var(--accent); color: #fff; border: none;
  padding: 0 18px; border-radius: var(--radius-xs); cursor: pointer; font-size: 15px; font-weight: 700;
  font-family: inherit; transition: all .12s; white-space: nowrap;
}
button.btn:hover { background: var(--accent-d); transform: translateY(-1px); }
button.btn.secondary { background: var(--surface); color: var(--text2); border: 1.5px solid var(--border); }
button.btn.secondary:hover { color: var(--text); border-color: var(--border2); transform: none; }
button.btn.danger { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-b); }
button.btn.danger:hover { background: #fee2e2; transform: none; }
button.btn:disabled { opacity: .6; cursor: default; transform: none; }
.icon-btn {
  background: var(--surface); border: 1.5px solid var(--border); color: var(--text2);
  width: 34px; height: 34px; border-radius: var(--radius-xs); cursor: pointer; font-size: 15px;
  display: inline-flex; align-items: center; justify-content: center; padding: 0;
}
.icon-btn:hover { background: var(--page-bg); }
.icon-btn.active { background: var(--accent); border-color: var(--accent); }
.pill-btn {
  background: var(--surface); border: 1px solid var(--border); color: var(--text2);
  padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 500;
  white-space: nowrap;
}
.pill-btn:hover { background: var(--page-bg); }
.pill-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.row-delete-btn {
  background: none; border: none; color: var(--text3); cursor: pointer; font-size: 15px;
  width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; padding: 0;
}
.row-delete-btn:hover { color: var(--red); }

/* Tables — sticky header, tabular numbers, colored group headers, как .jt/.svt */
table.data-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); font-variant-numeric: tabular-nums; font-size: var(--tbl-font); }
table.data-table thead tr:first-child th:first-child { border-top-left-radius: 12px; }
table.data-table thead tr:first-child th:last-child { border-top-right-radius: 12px; }
table.data-table thead { position: sticky; top: 0; z-index: 3; }
table.data-table th {
  background: var(--surface2); text-align: left; padding: 9px 12px; font-size: 13px;
  color: var(--text3); font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
  border-bottom: 2px solid var(--border); border-right: 1px solid var(--border); white-space: nowrap;
}
table.data-table th:last-child { border-right: none; }
table.data-table th.gh { background: var(--green-bg); color: var(--green); }
table.data-table th.rh { background: var(--red-bg); color: var(--red); }
table.data-table th.bh { background: var(--accent-l); color: var(--accent); }
table.data-table th.amber { background: var(--amber-bg); color: var(--amber); }
table.data-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); font-size: var(--tbl-font); }
table.data-table td:last-child { border-right: none; }
table.data-table tr:last-child td { border-bottom: none; }
table.data-table tr:hover td { background: var(--surface2); }
table.data-table input { width: 100px; padding: 5px 7px; font-size: 14px; }
table.data-table tr.tots-row td { background: #e8eaf2; font-weight: 800; font-size: calc(var(--tbl-font) + 1px); border-top: 2.5px solid var(--border2); }
table.data-table tr.tots-row td[class*="group-"] { background: #e8eaf2 !important; }
table.data-table tr.arenda-building-total-row td { background: var(--surface2); font-weight: 700; border-top: 1.5px solid var(--border2); border-bottom: 1.5px solid var(--border2); }
table.data-table tr.arenda-building-total-row td[class*="group-"] { background: var(--surface2) !important; }
table.compact-table td, table.compact-table th { padding: 6px 10px; }
table.compact-table { font-size: 13px; }
table.rent-matrix-table td, table.rent-matrix-table th { padding: 4px 7px; font-size: 12.5px; }
table.compact-table td, table.compact-table th { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table.cash-journal-table { table-layout: fixed; width: 100%; }
table.cash-journal-table th:nth-child(1), table.cash-journal-table td:nth-child(1) { width: 8%; }
table.cash-journal-table th:nth-child(2), table.cash-journal-table td:nth-child(2) { width: 13%; }
table.cash-journal-table th:nth-child(3), table.cash-journal-table td:nth-child(3) { width: 15%; }
table.cash-journal-table th:nth-child(4), table.cash-journal-table td:nth-child(4) { width: 9%; }
table.cash-journal-table th:nth-child(5), table.cash-journal-table td:nth-child(5) { width: 11%; }
table.cash-journal-table th:nth-child(6), table.cash-journal-table td:nth-child(6) { width: 10%; }
table.cash-journal-table th:nth-child(7), table.cash-journal-table td:nth-child(7) { width: 11%; }
table.cash-journal-table th:nth-child(8), table.cash-journal-table td:nth-child(8) { width: 8%; }
table.cash-journal-table th:nth-child(9), table.cash-journal-table td:nth-child(9) { width: 8%; }
table.cash-journal-table th:nth-child(10), table.cash-journal-table td:nth-child(10) { width: 4%; }
/* С колонкой "Банк" (вкладка "Все банки") — на один столбец больше, проценты пересчитаны */
table.cash-journal-table.with-bank th:nth-child(1), table.cash-journal-table.with-bank td:nth-child(1) { width: 7%; }
table.cash-journal-table.with-bank th:nth-child(2), table.cash-journal-table.with-bank td:nth-child(2) { width: 8%; }
table.cash-journal-table.with-bank th:nth-child(3), table.cash-journal-table.with-bank td:nth-child(3) { width: 12%; }
table.cash-journal-table.with-bank th:nth-child(4), table.cash-journal-table.with-bank td:nth-child(4) { width: 14%; }
table.cash-journal-table.with-bank th:nth-child(5), table.cash-journal-table.with-bank td:nth-child(5) { width: 8%; }
table.cash-journal-table.with-bank th:nth-child(6), table.cash-journal-table.with-bank td:nth-child(6) { width: 10%; }
table.cash-journal-table.with-bank th:nth-child(7), table.cash-journal-table.with-bank td:nth-child(7) { width: 9%; }
table.cash-journal-table.with-bank th:nth-child(8), table.cash-journal-table.with-bank td:nth-child(8) { width: 10%; }
table.cash-journal-table.with-bank th:nth-child(9), table.cash-journal-table.with-bank td:nth-child(9) { width: 7%; }
table.cash-journal-table.with-bank th:nth-child(10), table.cash-journal-table.with-bank td:nth-child(10) { width: 7%; }
table.cash-journal-table.with-bank th:nth-child(11), table.cash-journal-table.with-bank td:nth-child(11) { width: 4%; }
/* В режиме редактирования появляется чекбокс — колонок становится на одну больше,
   а фиксированные проценты выше рассчитаны на конкретное число столбцов. Проще
   отключить фиксированную раскладку на время редактирования — там и так много
   select/полей ввода, ширина по контенту даже удобнее. */
table.cash-journal-table.editing { table-layout: auto; }
table.cash-journal-table.editing th, table.cash-journal-table.editing td { width: auto !important; min-width: auto !important; max-width: none !important; white-space: normal; }

.badge { padding: 3px 10px; border-radius: 20px; font-size: 13px; font-weight: 700; }
.badge.active { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-b); }
.badge.archived { background: var(--surface2); color: var(--text3); }
.debt-positive { color: var(--red); font-weight: 700; }
.debt-negative { color: var(--red); font-weight: 700; }
.debt-zero { color: var(--text3); }
.status-msg { padding: 8px 12px; border-radius: var(--radius-xs); font-size: 14px; margin-bottom: 12px; }
.status-msg.ok { background: var(--green-bg); color: var(--green); }
.status-msg.err { background: var(--red-bg); color: var(--red); }
.empty-state { padding: 32px; text-align: center; color: var(--text3); font-size: 15px; }
.color-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.color-row label { width: 220px; font-size: 15px; }

.match-cell { position: relative; }
.match-dropdown {
  display: none; position: fixed; z-index: 1000;
  background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-xs);
  box-shadow: var(--shadow-md); max-height: 240px; overflow-y: auto;
}
.match-dropdown.open { display: block; }
.match-option { padding: 7px 10px; font-size: 14px; cursor: pointer; }
.match-option:hover, .match-option.highlighted { background: var(--accent-l); }
.match-option-archived { color: var(--text3); }
.match-input.selected { border-color: var(--green); background: var(--green-bg); }
.match-input.selected-inactive { border-color: var(--red); background: var(--red-bg); }

.info-box {
  margin-bottom: 16px; background: var(--accent-l); border: 1px solid var(--teal-b); border-radius: var(--radius-sm);
  font-size: 14px; color: var(--accent-d);
}
.info-box summary { cursor: pointer; padding: 8px 12px; font-weight: 600; list-style: none; user-select: none; }
.info-box summary::-webkit-details-marker { display: none; }
.info-box summary::before { content: "ℹ️ "; }
.info-box[open] summary::after { content: " (свернуть)"; font-weight: 400; opacity: .6; font-size: 12px; }
.info-box:not([open]) summary::after { content: " (что это и откуда)"; font-weight: 400; opacity: .6; font-size: 12px; }
.info-box .info-body { padding: 0 14px 12px; line-height: 1.5; }
.info-box .info-body b { color: var(--accent-d); }
.info-box-row { display: flex; gap: 10px; flex-wrap: wrap; }
.info-box-row .info-box { flex: 1; min-width: 260px; margin-bottom: 16px; }

/* Month bar — капсула с пилюлями внутри, точно как .mbar/.mtab */
.month-tabs {
  display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px;
}
.month-tab {
  padding: 7px 14px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap;
  color: var(--text2); background: none; border: none; border-radius: var(--radius-xs);
  transition: background .12s, color .12s; font-family: inherit;
}
.month-tab:hover { background: var(--bg); color: var(--text); }
.month-tab.active { color: #fff; background: var(--accent); font-weight: 600; }

/* Тэг-фильтр — контурная пилюля, отдельно от капсулы месяца, точно как .btn-tag */
.building-tabs { background: none; border: none; padding: 0; gap: 8px; }
.building-tabs .month-tab {
  background: var(--surface); border: 1.5px solid var(--border); color: var(--text2); border-radius: 20px;
  padding: 5px 13px; font-size: 12.5px; font-weight: 600;
}
.building-tabs .month-tab:hover { background: var(--bg); }
.building-tabs .month-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
/* Переключатель помещений (только когда выбрано конкретное здание) — отдельный цвет
   (фиолетовый), чтобы не сливаться с вкладками зданий того же визуального стиля. */
.room-tabs .month-tab { border-color: var(--purple-b); color: var(--purple); }
.room-tabs .month-tab:hover { background: var(--purple-bg); }
.room-tabs .month-tab.active { background: var(--purple); border-color: var(--purple); color: #fff; }

/* Верхние вкладки страницы — подчёркивание, точно как .sec-tabs/.sec-tab */
.page-tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 18px; }
.page-tab { padding: 9px 18px; cursor: pointer; color: var(--text3); font-size: 15px; font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -2px; }
.page-tab:hover { color: var(--text); }
.page-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Блоки Аренда/Коммуналка/Итого — цвет остаётся только в шапке таблицы (обе строки
   заголовка: цветная строка-"оглавление" и строка с названиями столбцов). Тело таблицы —
   белое, чтобы цвет не соревновался сам с собой в каждой строке данных. */
thead .group-dep { background: var(--surface2) !important; }
thead .group-rent { background: var(--accent-l) !important; }
thead .group-util { background: var(--teal-bg) !important; }
thead .group-total { background: var(--amber-bg) !important; }
table.data-table th.group-header {
  text-align: center; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; font-weight: 800;
  border-bottom: 1px solid var(--border); height: 28px;
}
table.data-table th.group-header.group-dep { color: var(--text3); }
table.data-table th.group-header.group-rent { color: var(--accent); }
table.data-table th.group-header.group-util { color: var(--teal); }
table.data-table th.group-header.group-total { color: var(--amber); }
/* Заголовки блоков-разделов в стековом виде "Все" на Коммуналке — то же оформление,
   что и у group-header в шапке таблицы, только это <summary>, а не <th>. */
summary.group-header { text-align: left; font-size: 12px; }
summary.group-header.group-dep { background: var(--surface2) !important; color: var(--text3); }
summary.group-header.group-rent { background: var(--accent-l) !important; color: var(--accent); }
summary.group-header.group-util { background: var(--teal-bg) !important; color: var(--teal); }
summary.group-header.group-total { background: var(--amber-bg) !important; color: var(--amber); }

.mirror-scroll { max-height: 72vh; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
table.mirror-table th, table.mirror-table td { border: 1px solid var(--border); }
table.mirror-table { border-collapse: separate; border-spacing: 0; table-layout: fixed; width: max-content; }
table.mirror-table thead tr:nth-child(1) th { position: sticky; top: 0; z-index: 3; background: var(--surface2); }
table.mirror-table thead tr:nth-child(2) th { position: sticky; z-index: 3; background: var(--surface2); }
table.mirror-table td:nth-child(1), table.mirror-table th:nth-child(1) {
  position: sticky; left: 0; z-index: 2; background: var(--surface); width: 170px; min-width: 170px; max-width: 170px;
}
table.mirror-table td:nth-child(2), table.mirror-table th:nth-child(2) {
  position: sticky; left: 170px; z-index: 2; background: var(--surface); width: 90px; min-width: 90px; max-width: 90px;
  border-right: 1px solid var(--border);
}
table.mirror-table td:nth-child(n+3):nth-child(-n+15), table.mirror-table th:nth-child(n+3):nth-child(-n+15) {
  width: 92px; min-width: 92px; max-width: 92px;
}
table.mirror-table td:nth-child(16), table.mirror-table th:nth-child(16) { width: 230px; min-width: 230px; max-width: 230px; }
table.mirror-table td:nth-child(17), table.mirror-table th:nth-child(17) { width: 120px; min-width: 120px; max-width: 120px; }
table.mirror-table thead tr:first-child th:first-child { min-width: 260px; }
table.mirror-table thead th:nth-child(1), table.mirror-table thead th:nth-child(2) { z-index: 4; background: var(--surface2); }
table.data-table.mirror-table th, table.data-table.mirror-table td { font-size: 13px; padding: 7px 8px; }
table.mirror-table td, table.mirror-table th { text-align: right; }
table.mirror-table td:first-child, table.mirror-table th:first-child,
table.mirror-table td:nth-child(2), table.mirror-table th:nth-child(2) { text-align: left; }

/* Закрепление ПЕРВЫХ ДВУХ столбцов (Здание/Арендатор + Объект) — для Годовой сводки,
   где эти столбцы разделены. Ширина фиксированная (не через ручку изменения ширины,
   как у sticky-first-col) — иначе позиция "left" второго столбца была бы непредсказуемой. */
.sticky-two-cols td:nth-child(1), .sticky-two-cols th:nth-child(1) {
  position: sticky; left: 0; z-index: 2; background: var(--surface); width: 190px; min-width: 190px; max-width: 190px;
}
.sticky-two-cols td:nth-child(2), .sticky-two-cols th:nth-child(2) {
  position: sticky; left: 190px; z-index: 2; background: var(--surface); width: 150px; min-width: 150px; max-width: 150px; border-right: 2px solid var(--border2);
}
.sticky-two-cols thead th:nth-child(1), .sticky-two-cols thead th:nth-child(2) { z-index: 4; }
.sticky-two-cols thead { position: static; }
.sticky-two-cols thead tr:nth-child(1) th { position: sticky; top: 0; z-index: 3; background: var(--surface2); }
.sticky-two-cols thead tr:nth-child(2) th { position: sticky; z-index: 3; background: var(--surface2); }

<script>

<script>
// ============================================================
// Конфигурация меню — можно менять порядок и названия в Настройки → Меню
// ============================================================
const DEFAULT_MENU_CONFIG = [
  { id: 'arenda2026', icon: '🏢', label: 'Общие данные', type: 'section', items: [
    { page: 'arenda-summary', label: 'Сводка' },
    { page: 'arenda-year', label: 'Годовая сводка' },
    { page: 'tenants', label: 'Арендаторы' },
    { page: 'debtors', label: 'Должники' },
  ]},
  { id: 'utility', icon: '💧', label: 'Коммуналка', type: 'section', items: [
    { page: 'utility-summary', label: 'Сводка' },
    { page: 'meters', label: 'Показания счётчиков' },
  ]},
  { id: 'raw', icon: '📥', label: 'Сырые данные', type: 'section', items: [
    { page: 'raw-cash-summary', label: 'Касса и банки — Сводка' },
    { page: 'raw-cash-year', label: 'Касса и банки — Годовая сводка' },
    { page: 'raw-cash-journal', label: 'Касса и банки — Журнал операций' },
  ]},
  { id: 'fixed-assets', icon: '🛠️', label: 'Основные средства', type: 'section', items: [
    { page: 'fixed-assets-osn', label: 'Осн.средства' },
    { page: 'fixed-assets-materials', label: 'Материалы' },

  ]},
  { id: 'inventory', icon: '📦', label: 'Склад', type: 'section', items: [
    { page: 'inventory-summary', label: 'Сводка' },
    { page: 'inventory', label: 'Детализация' },
    { page: 'inventory-photos', label: 'Фото склада' },
  ]},
  { id: 'settings', icon: '⚙️', label: 'Настройки', type: 'flat', page: 'settings' },
];

let menuConfig = DEFAULT_MENU_CONFIG;

function renderSidebarNav() {
  const container = document.getElementById('navContainer');
  container.innerHTML = menuConfig.filter(sec => !sec.hidden).map(sec => {
    if (sec.type === 'flat') {
      return `<a class="nav-section-title nav-flat" data-page="${sec.page}">${sec.icon} <span class="label">${escHtml(sec.label)}</span></a>`;
    }
    const visibleItems = (sec.items || []).filter(it => !it.hidden);
    return `<div class="nav-section ${sec.id === 'rent' ? 'open' : ''}" id="menu-${sec.id}">
      <div class="nav-section-title" data-toggle="menu-${sec.id}">${sec.icon} <span class="label">${escHtml(sec.label)}</span></div>
      <div class="nav-sub">
        ${visibleItems.length > 0 ? visibleItems.map(it => `<a data-page="${it.page}">${escHtml(it.label)}</a>`).join('') : '<span style="padding:8px 12px;font-size:12.5px;color:var(--sb-text-dim);">Пока пусто — перенеси сюда пункт из «Настройки → Меню»</span>'}
      </div>
    </div>`;
  }).join('');
  attachSidebarHandlers();
}

function navigateTo(page) {
  document.querySelectorAll('.nav-sub a, .nav-flat').forEach(a => a.classList.remove('active'));
  const link = document.querySelector(`.nav-sub a[data-page="${page}"], .nav-flat[data-page="${page}"]`);
  if (link) link.classList.add('active');
  try { localStorage.setItem('lastPage', page); } catch (e) { /* localStorage может быть недоступен — не критично */ }
  renderPage(page);
}

function attachSidebarHandlers() {
  document.querySelectorAll('.nav-section-title').forEach(el => {
    el.addEventListener('click', () => {
      if (el.dataset.page) {
        navigateTo(el.dataset.page);
        return;
      }
      const sectionEl = document.getElementById(el.dataset.toggle);
      const isOpen = sectionEl.classList.contains('open');
      if (isOpen) {
        sectionEl.classList.remove('open');
        return;
      }
      sectionEl.classList.add('open');
      // Открываем раздел и сразу показываем его первый видимый пункт — как "Банки" в Finansy
      const secId = el.dataset.toggle.replace('menu-', '');
      const sec = menuConfig.find(s => s.id === secId);
      const firstVisible = sec && sec.items && sec.items.find(it => !it.hidden);
      if (firstVisible) {
        navigateTo(firstVisible.page);
      }
    });
  });
  document.querySelectorAll('.nav-sub a').forEach(el => {
    el.addEventListener('click', () => navigateTo(el.dataset.page));
  });
}

// Поиск по всем пунктам меню (сайдбар) — ищет по названию раздела/пункта, по клику
// сразу переходит на страницу. Скрытые через "Настройки → Меню" пункты не участвуют.
function initSidebarSearch() {
  const input = document.getElementById('sidebarSearchInput');
  const results = document.getElementById('sidebarSearchResults');
  if (!input || !results) return;

  function allSearchablePages() {
    const list = [];
    menuConfig.forEach(sec => {
      if (sec.hidden) return;
      if (sec.type === 'flat') {
        list.push({ label: sec.label, page: sec.page, section: null });
      } else {
        (sec.items || []).forEach(it => {
          if (it.hidden) return;
          list.push({ label: it.label, page: it.page, section: sec.label });
        });
      }
    });
    return list;
  }

  function renderResults(q) {
    const matches = q ? allSearchablePages().filter(p => p.label.toLowerCase().includes(q)) : [];
    if (matches.length === 0) { results.style.display = 'none'; results.innerHTML = ''; return; }
    results.innerHTML = matches.map(m => `<a href="#" class="sidebar-search-result" data-page="${escHtml(m.page)}" style="display:block;padding:8px 12px;color:var(--text);text-decoration:none;font-size:13px;border-bottom:1px solid var(--border);">${escHtml(m.label)}${m.section ? ` <span style="color:var(--text3);font-size:11px;">— ${escHtml(m.section)}</span>` : ''}</a>`).join('');
    results.style.display = 'block';
    results.querySelectorAll('.sidebar-search-result').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        navigateTo(a.dataset.page);
        input.value = '';
        results.style.display = 'none';
      });
    });
  }

  input.addEventListener('input', () => renderResults(input.value.trim().toLowerCase()));
  input.addEventListener('focus', () => { if (input.value.trim()) renderResults(input.value.trim().toLowerCase()); });
  document.addEventListener('click', (e) => {
    if (!results.contains(e.target) && e.target !== input) results.style.display = 'none';
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { input.value = ''; results.style.display = 'none'; input.blur(); }
  });
}

// Соединяет сохранённую пользователем версию меню (её переименования и порядок)
// с актуальным списком разделов/пунктов из кода — новые пункты добавляются сами,
// без необходимости жать "Сбросить к исходному" каждый раз, когда что-то добавляется.
function mergeMenuConfig(saved, defaults) {
  const merged = [];
  const usedIds = new Set();

  saved.forEach(savedSec => {
    const defSec = defaults.find(d => d.id === savedSec.id);
    usedIds.add(savedSec.id);
    if (!defSec) { merged.push(savedSec); return; } // раздел, которого больше нет в коде — не теряем
    if (defSec.type === 'flat') {
      merged.push({ ...defSec, label: savedSec.label || defSec.label, hidden: savedSec.hidden });
      return;
    }
    const mergedItems = (savedSec.items || []).slice();
    const existingPages = new Set(mergedItems.map(it => it.page));
    (defSec.items || []).forEach(defItem => {
      if (!existingPages.has(defItem.page)) mergedItems.push(defItem); // новый пункт — добавляем в конец раздела
    });
    merged.push({ ...defSec, label: savedSec.label || defSec.label, hidden: savedSec.hidden, items: mergedItems });
  });

  defaults.forEach(defSec => {
    if (!usedIds.has(defSec.id)) merged.push(defSec); // целиком новый раздел, которого у пользователя не было
  });

  return merged;
}

async function loadMenuConfig() {
  try {
    const rows = await db(`select value from settings where key='menu_config'`);
    if (rows.length > 0 && Array.isArray(rows[0].value)) {
      menuConfig = mergeMenuConfig(rows[0].value, DEFAULT_MENU_CONFIG);
    }
  } catch (e) { /* таблицы может не быть при первом запуске — используем дефолт */ }
}

// ============================================================
// DB helper — обращение к своей базе через api/db.js
// ============================================================
async function db(query, params = []) {
  const resp = await fetch('/api/db', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query, params }),
  });
  const data = await resp.json();
  if (data.error) throw new Error(data.error);
  return data.rows || [];
}

function fmtMoney(n) {
  n = Number(n) || 0;
  return n.toLocaleString('ru-RU', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

// Нормализация имени для сравнения на JS-стороне — должна совпадать с SQL-версией
// (replace(trim(lower(x)), '.', '')), иначе поиск совпадений разъедется.
function normalizeName(s) {
  return String(s || '').trim().toLowerCase().replace(/\./g, '');
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function currentPeriodDefault() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function shiftPeriod(period, delta) {
  const [y, m] = period.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

// Обрабатывает массив с ограничением числа одновременных запросов — используется там, где
// нужно запросить много месяцев подряд (Годовая сводка, Должники), но полный Promise.all
// по всем сразу открывает слишком много одновременных соединений к базе разом (каждый
// месяц сам по себе — это ещё ~9-10 запросов внутри) и упирается в лимит соединений.
async function mapWithConcurrency(items, limit, fn) {
  const results = new Array(items.length);
  let idx = 0;
  async function worker() {
    while (idx < items.length) {
      const i = idx++;
      results[i] = await fn(items[i], i);
    }
  }
  const workers = [];
  for (let i = 0; i < Math.min(limit, items.length); i++) workers.push(worker());
  await Promise.all(workers);
  return results;
}

function periodLabel(period) {
  const months = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
  const [y, m] = period.split('-').map(Number);
  return months[m - 1] + ' ' + y;
}

const SHORT_MONTHS_RU = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

// Пара компактных выпадающих списков "Месяц" + "Год" вместо одного длинного списка
// (~60 пунктов при диапазоне в несколько лет) — используется во всех местах выбора
// "За месяц" в Кассе. attrsPrefix задаёт id или class+data-id для каждого select —
// в разных местах разная схема (фиксированный id для формы/массового изменения,
// class+data-id для построчного редактирования в таблице, где таких пар много).
function periodMonthYearPairHtml(monthAttrs, yearAttrs, selectedPeriod) {
  const [selYear, selMonth] = (selectedPeriod || currentPeriodDefault()).split('-');
  const minYear = 2025;
  const maxYear = new Date().getFullYear() + 3;
  let monthOpts = '';
  for (let m = 1; m <= 12; m++) {
    const mm = String(m).padStart(2, '0');
    monthOpts += `<option value="${mm}" ${mm === selMonth ? 'selected' : ''}>${SHORT_MONTHS_RU[m - 1]}</option>`;
  }
  let yearOpts = '';
  for (let y = minYear; y <= maxYear; y++) {
    yearOpts += `<option value="${y}" ${String(y) === selYear ? 'selected' : ''}>${y}</option>`;
  }
  return `<select ${monthAttrs} style="width:62px;">${monthOpts}</select><select ${yearAttrs} style="width:64px;">${yearOpts}</select>`;
}

// Стабильный цвет по месяцу (не по году) — январь всегда одного цвета, август — другого,
// чтобы визуально было легко сгруппировать операции одного и того же месяца аренды
const MONTH_COLORS = [
  { bg: '#eef2ff', fg: '#4338ca' }, // январь
  { bg: '#ecfeff', fg: '#0e7490' }, // февраль
  { bg: '#f0fdf4', fg: '#15803d' }, // март
  { bg: '#fefce8', fg: '#a16207' }, // апрель
  { bg: '#fff7ed', fg: '#c2410c' }, // май
  { bg: '#fef2f2', fg: '#b91c1c' }, // июнь
  { bg: '#fdf2f8', fg: '#be185d' }, // июль
  { bg: '#faf5ff', fg: '#7e22ce' }, // август
  { bg: '#f5f3ff', fg: '#6d28d9' }, // сентябрь
  { bg: '#eff6ff', fg: '#1d4ed8' }, // октябрь
  { bg: '#f0fdfa', fg: '#0f766e' }, // ноябрь
  { bg: '#fafaf9', fg: '#57534e' }, // декабрь
];
function monthColor(period) {
  if (!period) return MONTH_COLORS[0];
  const m = Number(period.split('-')[1]);
  return MONTH_COLORS[(m - 1 + 12) % 12];
}

// Месяц по умолчанию — текущий календарный месяц (если он есть среди доступных месяцев);
// иначе последний месяц, где реально что-то занесено (не пустой будущий месяц).
function defaultPeriod(existingPeriods) {
  const today = currentPeriodDefault();
  if (existingPeriods.includes(today) || today >= existingPeriods[0]) return today;
  return existingPeriods[existingPeriods.length - 1];
}

// Дополняет список месяцев, за которые уже есть данные, месяцами до конца текущего
// года — чтобы можно было сразу кликнуть на новый месяц и начать вносить операции,
// без отдельной кнопки "начать месяц" (как в Finansy: месяцы просто всегда доступны).
function fillPeriodsThroughYearEnd(existingPeriods) {
  const set = new Set(existingPeriods);
  const lastExisting = existingPeriods[existingPeriods.length - 1];
  const [lastYear] = lastExisting.split('-').map(Number);
  for (let m = 1; m <= 12; m++) {
    set.add(`${lastYear}-${String(m).padStart(2, '0')}`);
  }
  return [...set].sort();
}

// Более старые месяцы (до августа 2026) сейчас неактуальны для повседневной работы —
// прячем их по умолчанию под кнопку "Показать все месяцы", но не удаляем данные.
const RECENT_PERIOD_CUTOFF = '2026-08';
const rawPagesShowAllMonths = {}; // ключ — имя страницы ('rent'/'cash'/'expenses'), значение — bool

function renderCollapsiblePeriodTabsHTML(allPeriods, activePeriod, pageKey) {
  const hiddenCount = allPeriods.filter(p => p < RECENT_PERIOD_CUTOFF).length;
  const showAll = rawPagesShowAllMonths[pageKey] || activePeriod < RECENT_PERIOD_CUTOFF;
  const visible = showAll ? allPeriods : allPeriods.filter(p => p >= RECENT_PERIOD_CUTOFF);
  return visible.map(p => `<div class="month-tab ${p === activePeriod ? 'active' : ''}" data-period="${p}">${periodLabel(p)}</div>`).join('') +
    (hiddenCount > 0 ? `<div class="month-tab" data-toggle-months="${pageKey}" style="border-style:dashed;">${showAll ? 'Скрыть старые месяцы' : `Показать все месяцы (+${hiddenCount})`}</div>` : '');
}

// ============================================================
// Памятки "откуда данные" на каждой странице
// ============================================================
const PAGE_INFO = {
  journal: `<b>Источник:</b> лист «нач и долги» файла Отчет_основной_2026.xlsx (колонки «Долг по аренде на нач./начислена/оплачена/долг на конец»).<br>
    <b>Как работает сейчас:</b> начисления по аренде ведутся помесячно, по каждой связке «арендатор + объект» отдельно. Долг на начало месяца автоматически берётся из долга на конец предыдущего месяца (кнопка «Начать новый месяц»). Данные за август 2026 занесены через ручное сопоставление с Excel (страница «Сопоставление»), начиная с сентября 2026 вводятся здесь напрямую, без Excel.`,
  debtors: `<b>Источник:</b> те же данные, что и в «Журнале начислений» (лист «нач и долги»), просто отфильтрованные и отсортированные по сумме долга.<br>
    <b>Как работает сейчас:</b> показывает всех, у кого долг на конец выбранного месяца больше нуля. Отдельных данных не хранит — это просто другой взгляд на «Журнал начислений».`,
  tenants: `<b>Источник:</b> НЕ Excel, а напрямую база Rental CRM (на сервере SpaceWeb) — таблицы арендаторов и объектов.<br>

  utilitySummary: `<b>Источник:</b> показания счётчиков (вводятся здесь вручную по каждому арендатору/зданию) + «Касса и банки» (платежи, которые сматчились по имени арендатора).<br>

function infoBoxHtml(key) {
  const text = PAGE_INFO[key];
  if (!text) return '';
  return `<details class="info-box"><summary>Что это и откуда</summary><div class="info-body">${text}</div></details>`;
}

async function pageDebtors() {
  main.innerHTML = `
    ${renderGeneralDataTopTabsHtml('debtors')}
    <h1>Должники</h1>
    ${infoBoxHtml('debtors')}
    <div id="debtorsWrap">Загрузка…</div>
  `;

  await loadDebtors(currentPeriodDefault());

async function loadDebtors(period) {
  const wrap = document.getElementById('debtorsWrap');
  wrap.innerHTML = 'Загрузка…';
  try {
    // Тот же самый надёжный накопительный расчёт долга, что и в Сводке (не читаем
    // напрямую сохранённое closing_debt — оно может быть устаревшим).
    const rows = await getArenda2026Rows(period);
    const debtors = rows.filter(r => Number(r.rent_closing) > 0);

    if (debtors.length === 0) {
      wrap.innerHTML = `<div class="empty-state">На ${periodLabel(period)} должников нет 🎉</div>`;
      return;
    }

    // "Долг с какого месяца" — идём назад от текущего месяца, пока долг непрерывно
    // больше нуля; самый ранний такой месяц и есть начало долга. Смотрим не больше
    // 24 месяцев назад (защита от зацикливания).
    const lookbackPeriods = [];
    let lp = period;
    for (let i = 0; i < 24; i++) { lookbackPeriods.push(lp); lp = shiftPeriod(lp, -1); }
    const lookbackRowsList = await mapWithConcurrency(lookbackPeriods, 3, p => p === period ? Promise.resolve(rows) : getArenda2026Rows(p));
    const lookbackByPeriod = {};
    lookbackPeriods.forEach((p, i) => { lookbackByPeriod[p] = lookbackRowsList[i]; });

    function debtSincePeriod(identityRow) {
      let sincePeriod = period;
      for (let i = 1; i < lookbackPeriods.length; i++) {
        const p = lookbackPeriods[i];
        const prevRows = lookbackByPeriod[p];
        const match = prevRows.find(r => r.id === identityRow.id || (r.tenant_id === identityRow.tenant_id && r.tenant_object_id === identityRow.tenant_object_id && r.name === identityRow.name));
        if (match && Number(match.rent_closing) > 0) {
          sincePeriod = p;
        } else {
          break;
        }
      }
      return sincePeriod;
    }

    debtors.sort((a, b) => Number(b.rent_closing) - Number(a.rent_closing));

    let html = `<table class="data-table"><thead><tr>
      <th>Арендатор</th><th>Здание</th><th>Объект</th><th>Долг с какого месяца</th><th>Долг</th>
    </tr></thead><tbody>
      <tr class="tots-row"><td>Итого (${debtors.length})</td><td></td><td></td><td></td><td>${fmtMoney(debtors.reduce((s,r)=>s+(Number(r.rent_closing)||0),0))}</td></tr>`;
    for (const r of debtors) {
      html += `<tr>
        <td>${escHtml(r.name)}</td>
        <td>${escHtml(r.building || '—')}</td>
        <td>${escHtml(combineObjectFields(r.object_name, r.office) || '—')}</td>
        <td>${periodLabel(debtSincePeriod(r))}</td>
        <td class="debt-positive">${fmtMoney(r.rent_closing)}</td>
      </tr>`;
    }
    html += '</tbody></table>';
    wrap.innerHTML = html;
  } catch (err) {
    wrap.innerHTML = `<div class="status-msg err">Ошибка: ${err.message}</div>`;
  }
}

// ============================================================
// СТРАНИЦА: Основные средства — операции из Кассы с категориями "Материалы" и
// "Осн.средства" (обе точно, без текстового поиска по подстроке). Две отдельные вкладки —
// каждая категория отдельно, не вперемешку. "Списать" не трогает саму операцию в Кассе —
// просто помечает её отдельно (settings-ключ, вместе со зданием списания), обратимо через
// "↺ Вернуть".
// ============================================================
const FIXED_ASSET_TABS = { 'Осн.средства': ['Осн.средства'], 'Материалы': ['Материалы'] };
const FIXED_ASSET_TOP_TABS = ['Осн.средства', 'Материалы', 'Сводка'];
let fixedAssetsTab = 'Осн.средства';
let fixedAssetsShowArchived = false;
let fixedAssetsBuilding = null;
let fixedAssetsCameFromSummary = false;

async function getFixedAssetWriteoffMap() {
  const rows = await db(`select key, value from settings where key like 'fixed_asset_writeoff:%'`);
  const map = {};
  rows.forEach(r => { map[r.key.slice('fixed_asset_writeoff:'.length)] = r.value; });
  return map;
}
async function setFixedAssetWriteoff(id, writtenOff, building, comment) {
  const key = `fixed_asset_writeoff:${id}`;
  if (writtenOff) {
    await db(`
      insert into settings (key, value) values ($1, $2)
      on conflict (key) do update set value = $2, updated_at = now()
    `, [key, JSON.stringify({ writtenOffAt: new Date().toISOString(), building: building || null, comment: comment || '' })]);
  } else {
    await db(`delete from settings where key=$1`, [key]);
  }
}

async function pageFixedAssets(initialTab) {
  if (initialTab) fixedAssetsTab = initialTab;
  main.innerHTML = `
    <h1>Основные средства</h1>
    <div class="month-tabs" id="fixedAssetsTypeTabs" style="margin-bottom:12px;"></div>
    <div id="fixedAssetsBody"></div>
  `;
  const typeTabsEl = document.getElementById('fixedAssetsTypeTabs');
  function renderTypeTabs() {
    typeTabsEl.innerHTML = FIXED_ASSET_TOP_TABS.map(t =>
      `<div class="month-tab ${t === fixedAssetsTab ? 'active' : ''}" data-tab="${escHtml(t)}">${escHtml(t)}</div>`
    ).join('');
  }
  window.__fixedAssetsRenderTypeTabs = renderTypeTabs; // нужна снаружи — для перехода по клику из вкладки "Сводка"
  renderTypeTabs();
  typeTabsEl.addEventListener('click', (e) => {
    const tab = e.target.closest('.month-tab');
    if (!tab) return;
    fixedAssetsTab = tab.dataset.tab;
    fixedAssetsShowArchived = false;
    fixedAssetsBuilding = null;
    fixedAssetsCameFromSummary = false;
    renderTypeTabs();
    renderFixedAssetsBody();
  });
  await renderFixedAssetsBody();
}

async function renderFixedAssetsBody() {
  const bodyEl = document.getElementById('fixedAssetsBody');
  if (fixedAssetsTab === 'Сводка') {
    bodyEl.innerHTML = `<div id="fixedAssetsSummaryWrap">Загрузка…</div>`;
    await loadFixedAssetsSummaryPage();
    return;
  }
  bodyEl.innerHTML = `
    <div id="fixedAssetsBuildingTabs" class="month-tabs building-tabs" style="margin-bottom:12px;"></div>
    <div class="toolbar">
      ${fixedAssetsCameFromSummary ? `<button class="btn secondary" id="fixedAssetsBackBtn">← Назад в Сводку</button>` : ''}
      <button class="btn secondary" id="fixedAssetsArchiveToggle"></button>
    </div>
    <div id="fixedAssetsWrap">Загрузка…</div>
  `;
  if (fixedAssetsCameFromSummary) {
    document.getElementById('fixedAssetsBackBtn').addEventListener('click', () => {
      fixedAssetsTab = 'Сводка';
      fixedAssetsCameFromSummary = false;
      if (window.__fixedAssetsRenderTypeTabs) window.__fixedAssetsRenderTypeTabs();
      renderFixedAssetsBody();
    });
  }
  document.getElementById('fixedAssetsArchiveToggle').addEventListener('click', () => {
    fixedAssetsShowArchived = !fixedAssetsShowArchived;
    loadFixedAssets();
  });
  await loadFixedAssets();
}

// "Сводка" — отдельная вкладка: разбивка по зданиям сразу по обеим категориям
// (Осн.средства и Материалы), только по действующим (не списанным).
async function loadFixedAssetsSummaryPage() {
  const wrap = document.getElementById('fixedAssetsSummaryWrap');
  wrap.innerHTML = 'Загрузка…';
  try {
    const [rows, buildingMap, manualOverrides, writeoffMap, tenantObjAll] = await Promise.all([
      db(`select * from cash_ledger_raw where category = any($1) order by date desc, created_at desc`, [Object.values(FIXED_ASSET_TABS).flat()]),
      getTenantObjectBuildingMap(),
      getManualBuildingOverrides(),
      getFixedAssetWriteoffMap(),
      db(`select id as tenant_object_id, tenant_id, object_name, office, building from tenant_objects`),
    ]);
    const tenantObjById = {};
    tenantObjAll.forEach(o => { tenantObjById[o.tenant_object_id] = o; });
    rows.forEach(r => {
      const o = r.tenant_object_id ? tenantObjById[r.tenant_object_id] : null;
      r._building = r.tenant_object_id
        ? resolveBuilding(o ? o.building : null, buildingMap, r.tenant_object_id, o ? o.object_name : null, o ? o.tenant_id : null, manualOverrides)
        : (r.corresponent || 'Не определено');
    });
    const activeRows = rows.filter(r => !writeoffMap[r.id]);

    let buildings = sortByExcelOrder([...new Set(activeRows.map(r => r._building))].filter(b => b !== 'Не определено'));
    if (activeRows.some(r => r._building === 'Не определено')) buildings.push('Не определено');

    function sumsFor(category, building) {
      const list = activeRows.filter(r => r.category === category && (!building || r._building === building));
      return { count: list.length, sum: list.reduce((s, r) => s + (Number(r.amount) || 0), 0) };
    }
    const categories = Object.keys(FIXED_ASSET_TABS); // ['Осн.средства', 'Материалы']

    // Клик по числу — переход на нужную вкладку (Осн.средства/Материалы) с фильтром по
    // этому зданию; "Итого" ведёт без фильтра (все здания сразу).
    function cell(category, building, text) {
      return `<td style="text-align:right;"><a href="#" class="fixed-assets-summary-link" data-category="${escHtml(category)}" data-building="${escHtml(building || '')}" style="color:inherit;text-decoration:none;border-bottom:1px dashed currentColor;">${text}</a></td>`;
    }

    let html = `
      <table class="data-table compact-table" style="max-width:640px;"><thead><tr>
        <th rowspan="2">Здание</th>
        ${categories.map(c => `<th colspan="2" style="text-align:center;">${escHtml(c)}</th>`).join('')}
      </tr><tr>
        ${categories.map(() => `<th style="text-align:right;">Кол-во</th><th style="text-align:right;">Сумма</th>`).join('')}
      </tr></thead><tbody>
        <tr class="tots-row"><td>Итого</td>
          ${categories.map(c => { const s = sumsFor(c, null); return cell(c, null, s.count) + cell(c, null, fmtMoney(s.sum)); }).join('')}
        </tr>
        ${buildings.map(b => `<tr><td>${escHtml(b)}</td>${categories.map(c => { const s = sumsFor(c, b); return cell(c, b, s.count) + cell(c, b, fmtMoney(s.sum)); }).join('')}</tr>`).join('')}
      </tbody></table>
    `;
    wrap.innerHTML = html;

    wrap.querySelectorAll('.fixed-assets-summary-link').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        fixedAssetsTab = a.dataset.category;
        fixedAssetsBuilding = a.dataset.building || null;
        fixedAssetsShowArchived = false;
        fixedAssetsCameFromSummary = true;
        if (window.__fixedAssetsRenderTypeTabs) window.__fixedAssetsRenderTypeTabs();
        renderFixedAssetsBody();
      });
    });
  } catch (err) {
    wrap.innerHTML = `<div class="status-msg err">Ошибка: ${err.message}</div>`;
  }
}

async function loadFixedAssets() {
  const wrap = document.getElementById('fixedAssetsWrap');
  const btn = document.getElementById('fixedAssetsArchiveToggle');
  btn.textContent = fixedAssetsShowArchived ? '← К действующим' : '🗑️ Показать списанные';
  wrap.innerHTML = 'Загрузка…';
  try {
    const categories = FIXED_ASSET_TABS[fixedAssetsTab];
    const [rows, buildingMap, manualOverrides, writeoffMap, tenantObjAll, inventoryLinks] = await Promise.all([
      db(`select * from cash_ledger_raw where category = any($1) order by date desc, created_at desc`, [categories]),
      getTenantObjectBuildingMap(),
      getManualBuildingOverrides(),
      getFixedAssetWriteoffMap(),
      db(`select id as tenant_object_id, tenant_id, object_name, office, building from tenant_objects`),
      db(`select source_cash_id from inventory_transactions where source_cash_id is not null`),
    ]);
    const tenantObjById = {};
    tenantObjAll.forEach(o => { tenantObjById[o.tenant_object_id] = o; });
    const inventoryLinkedSet = new Set(inventoryLinks.map(r => r.source_cash_id));

    // То же определение здания, что и везде в портале — через resolveBuilding
    // (объект → зарегистрированное в CRM здание, а не служебная карта напрямую).
    rows.forEach(r => {
      const o = r.tenant_object_id ? tenantObjById[r.tenant_object_id] : null;
      r._building = r.tenant_object_id
        ? resolveBuilding(o ? o.building : null, buildingMap, r.tenant_object_id, o ? o.object_name : null, o ? o.tenant_id : null, manualOverrides)
        : (r.corresponent || 'Не определено'); // для "Материалы"/"Осн.средства" поле "Корреспондент" в Кассе — это и есть выбор здания напрямую
    });

    const activeRows = rows.filter(r => !writeoffMap[r.id]);
    let displayRows = fixedAssetsShowArchived ? rows.filter(r => !!writeoffMap[r.id]) : activeRows;
    if (fixedAssetsBuilding) {
      displayRows = displayRows.filter(r => {
        const effectiveBuilding = fixedAssetsShowArchived && writeoffMap[r.id] ? (writeoffMap[r.id].building || r._building) : r._building;
        return effectiveBuilding === fixedAssetsBuilding;
      });
    }

    let buildings = sortByExcelOrder([...new Set(activeRows.map(r => r._building))].filter(b => b !== 'Не определено'));
    if (activeRows.some(r => r._building === 'Не определено')) buildings.push('Не определено');
    const buildingTabsEl = document.getElementById('fixedAssetsBuildingTabs');
    buildingTabsEl.innerHTML =
      `<div class="month-tab ${!fixedAssetsBuilding ? 'active' : ''}" data-building="">Все здания</div>` +
      buildings.map(b => `<div class="month-tab ${b === fixedAssetsBuilding ? 'active' : ''}" data-building="${escHtml(b)}">${escHtml(b)}</div>`).join('');
    buildingTabsEl.onclick = (e) => {
      const tab = e.target.closest('.month-tab');
      if (!tab) return;
      fixedAssetsBuilding = tab.dataset.building || null;
      loadFixedAssets();
    };

    if (displayRows.length === 0) {
      wrap.innerHTML = `<div class="empty-state">${fixedAssetsShowArchived ? 'Списанных средств нет.' : `«${escHtml(fixedAssetsTab)}» пока нет.`}</div>`;
      return;
    }
    // Список зданий для выбора при списании — все, что встречаются в портале (не только
    // те, что уже есть в этой категории), плюс "Не определено".
    const allBuildingsForPicker = [...sortByExcelOrder([...new Set(Object.values(tenantObjById).map(o => o.building).filter(Boolean))]), 'Не определено'];

    let html = `<table class="data-table"><thead><tr>
      <th>Дата</th><th>Банк</th><th>Здание</th><th>Категория</th><th>Назначение платежа</th><th style="text-align:right;">Сумма</th><th>Склад</th><th></th>
    </tr></thead><tbody>
      <tr class="tots-row"><td colspan="5">Итого (${displayRows.length})</td><td style="text-align:right;">${fmtMoney(displayRows.reduce((s, r) => s + (Number(r.amount) || 0), 0))}</td><td></td><td></td></tr>`;
    for (const r of displayRows) {
      const wo = fixedAssetsShowArchived ? writeoffMap[r.id] : null;
      const writtenOffBuilding = wo ? (wo.building || r._building) : null;
      html += `<tr${fixedAssetsShowArchived ? ' style="opacity:.65;"' : ''}>
        <td>${r.date ? new Date(r.date).toLocaleDateString('ru-RU') : ''}</td>
        <td>${escHtml(r.account || '')}</td>
        <td>${escHtml(fixedAssetsShowArchived ? (writtenOffBuilding || r._building) : r._building)}</td>
        <td>${escHtml(r.category || '')}</td>
        <td>${escHtml(r.purpose || '')}${wo && wo.comment ? `<div style="font-size:11px;color:var(--text3);">💬 ${escHtml(wo.comment)}</div>` : ''}</td>
        <td style="text-align:right;">${fmtMoney(r.amount)}</td>
        <td>${inventoryLinkedSet.has(r.id)
          ? `<span style="color:var(--green);font-size:12px;">✓ Оприходовано</span>`
          : `<button class="btn secondary fixed-asset-inventory-btn" data-id="${r.id}" data-building="${escHtml(r._building)}" data-name="${escHtml(r.purpose || '')}" data-amount="${Number(r.amount) || 0}" style="padding:2px 10px;font-size:12px;">📦 Оприходовать</button>`
        }</td>
        <td>${fixedAssetsShowArchived
          ? `<button class="btn secondary fixed-asset-return-btn" data-id="${r.id}" style="padding:2px 10px;font-size:12px;">↺ Вернуть</button>`
          : `<button class="btn secondary fixed-asset-writeoff-btn" data-id="${r.id}" data-building="${escHtml(r._building)}" style="padding:2px 10px;font-size:12px;">🗑️ Списать</button>`
        }</td>
      </tr>`;
    }
    html += '</tbody></table>';
    wrap.innerHTML = html;

    wrap.querySelectorAll('.fixed-asset-inventory-btn').forEach(b => {
      b.addEventListener('click', () => openFixedAssetInventoryForm(b.dataset.id, b.dataset.building, b.dataset.name, Number(b.dataset.amount)));
    });
    wrap.querySelectorAll('.fixed-asset-return-btn').forEach(b => {
      b.addEventListener('click', async () => {
        b.disabled = true;
        try {
          await setFixedAssetWriteoff(b.dataset.id, false);
          await loadFixedAssets();
        } catch (err) {
          alert('Ошибка: ' + err.message);
          b.disabled = false;
        }
      });
    });
    // "Списать" — сначала спрашивает, в какое здание списать (по умолчанию — уже
    // определённое здание операции), и только после подтверждения списывает.
    wrap.querySelectorAll('.fixed-asset-writeoff-btn').forEach(b => {
      b.addEventListener('click', () => {
        const td = b.closest('td');
        const currentBuilding = b.dataset.building;
        td.innerHTML = `
          <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start;">
            <select class="fixed-asset-building-select" style="max-width:180px;">
              ${allBuildingsForPicker.map(bld => `<option value="${escHtml(bld)}" ${bld === currentBuilding ? 'selected' : ''}>${escHtml(bld)}</option>`).join('')}
            </select>
            <input type="text" class="fixed-asset-comment-input" placeholder="Комментарий (необязательно)" style="width:180px;">
            <div>
              <button class="btn secondary fixed-asset-confirm-btn" data-id="${b.dataset.id}" style="padding:2px 10px;font-size:12px;">✓ Списать</button>
              <button class="btn secondary fixed-asset-cancel-btn" style="padding:2px 6px;font-size:12px;">✕</button>
            </div>
          </div>
        `;
        td.querySelector('.fixed-asset-cancel-btn').addEventListener('click', () => loadFixedAssets());
        td.querySelector('.fixed-asset-confirm-btn').addEventListener('click', async () => {
          const chosenBuilding = td.querySelector('.fixed-asset-building-select').value;
          const comment = td.querySelector('.fixed-asset-comment-input').value;
          try {
            await setFixedAssetWriteoff(b.dataset.id, true, chosenBuilding, comment);
            await loadFixedAssets();
          } catch (err) {
            alert('Ошибка: ' + err.message);
          }
        });
      });
    });
  } catch (err) {
    wrap.innerHTML = `<div class="status-msg err">Ошибка: ${err.message}</div>`;
  }
}

// Оприходовать операцию из "Основные средства"/"Материалы" на Склад — выбрать
// существующую позицию (по наименованию на этом же объекте) или создать новую,
// и провести приход с привязкой к самой операции в Кассе (source_cash_id).
async function openFixedAssetInventoryForm(cashId, building, purposeName, amount) {
  const [existing, buildingsList, roomsList, groups, units] = await Promise.all([
    db(`select id, name, building, room, unit, price from inventory_items order by building, room, name`),
    getInventoryBuildingsList(),
    getInventoryRoomsList(),
    db(`select distinct group_name from inventory_items where group_name is not null and group_name != '' order by group_name`),
    db(`select distinct unit from inventory_items where unit is not null and unit != '' order by unit`),
  ]);
  const html = `
    <div style="background:var(--surface2);border-radius:var(--radius);padding:16px;max-width:380px;max-height:90vh;overflow-y:auto;">
      <div style="font-weight:700;margin-bottom:10px;">Оприходовать на склад</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:10px;">Из Кассы: ${escHtml(purposeName || '')} · ${fmtMoney(amount)} (здание в Аренде: «${escHtml(building)}» — список зданий склада отдельный, ниже выберите нужное)</div>
      <label>Позиция на складе</label>
      <select id="invLinkExisting" style="width:100%;margin-bottom:8px;">
        <option value="">— создать новую позицию —</option>
        ${existing.map(it => `<option value="${it.id}">${escHtml(it.building || '')}${it.room ? ', ' + escHtml(it.room) : ''} — ${escHtml(it.name)}</option>`).join('')}
      </select>
      <div id="invLinkNewFields">
        <label>Здание</label>
        <select id="invLinkNewBuilding" style="width:100%;margin-bottom:8px;">
          <option value="">— выберите —</option>
          ${buildingsList.map(b => `<option value="${escHtml(b)}">${escHtml(b)}</option>`).join('')}
        </select>
        <label>Помещение</label>
        <select id="invLinkNewRoom" style="width:100%;margin-bottom:8px;">
          <option value="">— не указано —</option>
          ${roomsList.map(r => `<option value="${escHtml(r)}">${escHtml(r)}</option>`).join('')}
        </select>
        <label>Наименование новой позиции</label>
        <input type="text" id="invLinkNewName" style="width:100%;margin-bottom:8px;" value="${escHtml(purposeName || '')}">
        <label>Группа</label>
        <input type="text" id="invLinkNewGroup" list="invLinkGroupList" style="width:100%;margin-bottom:8px;" placeholder="выберите или впишите новую">
        <datalist id="invLinkGroupList">${groups.map(g => `<option value="${escHtml(g.group_name)}">`).join('')}</datalist>
        <label>Единица измерения</label>
        <input type="text" id="invLinkNewUnit" list="invLinkUnitList" style="width:100%;margin-bottom:8px;" placeholder="шт / литр / метр">
        <datalist id="invLinkUnitList">${units.map(u => `<option value="${escHtml(u.unit)}">`).join('')}</datalist>
      </div>
      <label>Количество (приход)</label>
      <input type="number" id="invLinkQty" style="width:100%;margin-bottom:12px;" value="1">
      <button class="btn" id="invLinkConfirm">Оприходовать</button>
      <button class="btn secondary" id="invLinkCancel">Отмена</button>
      <div id="invLinkMsg"></div>
    </div>
  `;
  showModal(html);
  document.getElementById('invLinkCancel').addEventListener('click', closeModal);
  document.getElementById('invLinkExisting').addEventListener('change', (e) => {
    document.getElementById('invLinkNewFields').style.display = e.target.value ? 'none' : '';
  });
  document.getElementById('invLinkConfirm').addEventListener('click', async () => {
    const qty = Number(document.getElementById('invLinkQty').value) || 0;
    if (qty <= 0) { showMsg('invLinkMsg', 'Укажите количество больше нуля', 'err'); return; }
    const existingId = document.getElementById('invLinkExisting').value;
    try {
      let itemId = existingId;
      if (!itemId) {
        const newBuilding = document.getElementById('invLinkNewBuilding').value;
        const name = document.getElementById('invLinkNewName').value.trim();
        if (!newBuilding || !name) { showMsg('invLinkMsg', 'Укажите здание и наименование', 'err'); return; }
        const priceHint = qty > 0 ? Math.round((amount / qty) * 100) / 100 : amount;
        const inserted = await db(`
          insert into inventory_items (building, room, group_name, name, unit, price, opening_balance)
          values ($1, $2, $3, $4, $5, $6, 0) returning id
        `, [newBuilding, document.getElementById('invLinkNewRoom').value || null, document.getElementById('invLinkNewGroup').value.trim(),
            name, document.getElementById('invLinkNewUnit').value.trim(), priceHint]);
        itemId = inserted[0].id;
      }
      await db(`insert into inventory_transactions (item_id, date, change, reason, comment, source_cash_id) values ($1, current_date, $2, 'Оприходовано из Кассы', $3, $4)`,
        [itemId, qty, purposeName, cashId]);
      closeModal();
      await loadFixedAssets();
    } catch (err) {
      showMsg('invLinkMsg', 'Ошибка: ' + err.message, 'err');
    }
  });
}



// ============================================================
// СТРАНИЦА: Коммуналка — Сводка. По арендаторам (как Аренда), с переключателем вида
// коммуналки (свет/газ/вода). "На начало" и "Тариф" переносятся месяц-в-месяц с прошлого,
// пока не введено новое значение — та же логика, что и у "Долг на начало" в Аренде.
// "Оплата Эрия" = сумма из Кассы по категориям "Ком.Аренда"+"Ком.Наша". "Оплата
// арендатора" = сумма по категории КОМ-КА/ПРИХОД (та же, что уже используется в Аренде).
// ============================================================
let utilityReadingsPeriod = currentPeriodDefault();
let utilityReadingsBuilding = null;
let utilityReadingsType = 'все';
let utilityReadingsEditMode = false;
let utilityTenantSearch = '';

async function getUtilityReference(period) {
  const rows = await db(`select value from settings where key=$1`, [`utility_reference:${period}`]);
  return rows.length > 0 ? rows[0].value : null;
}
async function saveUtilityReference(period, payload) {
  await db(`insert into settings (key, value) values ($1, $2) on conflict (key) do update set value=$2, updated_at=now()`, [`utility_reference:${period}`, JSON.stringify(payload)]);
}
async function deleteUtilityReference(period) {
  await db(`delete from settings where key=$1`, [`utility_reference:${period}`]);
}
// Нормализация названия здания для сопоставления строки эталона со зданием в приложении
// (эталон Елена уже привела к точным названиям, но на всякий случай — без учёта регистра,
// кавычек и лишних пробелов).
function normalizeRefBuildingName(s) {
  return (s || '').toString().trim().toUpperCase().replace(/[«»"]/g, '').replace(/\s+/g, ' ');
}
// Строка эталона может называть раздел по-своему ("ТСЖ/Отопление", "Охрана/Мусор",
// "Вода (мал. дом)") — возвращает список внутренних разделов приложения, в итог которых
// эта строка должна попасть (обычно один, но для "Охрана/Мусор" — оба, т.к. у Елены в
// исходнике они шли одной строкой на некоторые здания).
function mapRefTypeToInternal(label) {
  const l = (label || '').toString().toLowerCase();
  if (l.includes('тсж') || l.startsWith('отопление')) return ['отопление'];
  if (l.includes('охрана') && l.includes('мусор')) return ['охрана', 'мусор'];
  if (l.startsWith('охрана')) return ['охрана'];
  if (l.startsWith('мусор')) return ['мусор'];
  if (l.startsWith('вода')) return ['вода'];
  if (l.startsWith('газ')) return ['газ'];
  if (l.startsWith('свет')) return ['свет'];
  return [];
}
// Сумма значений эталона по зданию+разделу (может собрать несколько строк эталона —
// например, "Вода (мал. дом)" + "Вода (б. дом)" обе попадают в раздел "вода"). null,
// если по этому зданию+разделу в эталоне вообще нет строк (тогда сверка не проводится).
function matchRefTotals(building, type) {
  if (!utilityReferenceData || !Array.isArray(utilityReferenceData.rows)) return null;
  const normB = normalizeRefBuildingName(building);
  const matches = utilityReferenceData.rows.filter(r =>
    normalizeRefBuildingName(r.building) === normB && mapRefTypeToInternal(r.type).includes(type));
  if (matches.length === 0) return null;
  return matches.reduce((acc, r) => ({
    accrued: acc.accrued + (Number(r.accrued) || 0),
    paidUs: acc.paidUs + (Number(r.paidUs) || 0),
    paidTenants: acc.paidTenants + (Number(r.paidTenants) || 0),
  }), { accrued: 0, paidUs: 0, paidTenants: 0 });
}
// Порог расхождения (руб), ниже которого разница считается округлением и не подсвечивается.
const UTILITY_REF_TOLERANCE = 1;

async function pageUtilitySummary() {
  main.innerHTML = `
    <h1>Коммуналка — Сводка</h1>
    <div class="month-tabs" id="utilityPeriodTabs"></div>
    <div class="toolbar" style="flex-wrap:wrap;">

    </div>
    <div id="utilityWrap">Загрузка…</div>
  `;

  // Горячие клавиши (только пока открыта эта страница — не мешают вводу в поиске/правке/
  // загрузке файла и не перехватывают сочетания с Ctrl/Alt/Cmd). Старый хендлер снимается
  // перед каждым новым заходом на страницу, чтобы не накапливались дубликаты.
  if (utilityHotkeyHandler) document.removeEventListener('keydown', utilityHotkeyHandler);
  const UTILITY_HOTKEY_TYPES = ['все', ...UTILITY_ALL_TYPES]; // 1=Все, 2=Свет, 3=Газ, 4=Вода, 5=Мусор, 6=Охрана, 7=Отопление, 8=Капремонт, 9=ЕДС сод. жилья
  utilityHotkeyHandler = (e) => {
    if (!document.getElementById('utilityWrap')) return; // ушли со страницы — хендлер не снят, но бездействует
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.code === 'KeyS') {
      e.preventDefault();
      document.getElementById('utilityCollapseAllBtn')?.click();
    } else if (e.code === 'KeyE') {
      e.preventDefault();
      document.getElementById('utilityEditBtn')?.click();
    } else if (/^Digit[1-9]$/.test(e.code)) {
      const type = UTILITY_HOTKEY_TYPES[Number(e.code.slice(5)) - 1];
      if (type) {
        e.preventDefault();
        document.querySelector(`#utilityTypeTabs .month-tab[data-type="${type}"]`)?.click();
      }
    }
  };
  document.addEventListener('keydown', utilityHotkeyHandler);

  const periodTabsEl = document.getElementById('utilityPeriodTabs');
  function renderPeriodTabs() {
    const opts = [];
    for (let i = -6; i <= 3; i++) opts.push(shiftPeriod(currentPeriodDefault(), i));
    periodTabsEl.innerHTML = opts.map(p =>
      `<div class="month-tab ${p === utilityReadingsPeriod ? 'active' : ''}" data-period="${p}">${periodLabel(p)}</div>`
    ).join('');
  }
  renderPeriodTabs();
  periodTabsEl.addEventListener('click', async (e) => {
    const tab = e.target.closest('.month-tab');
    if (!tab) return;
    utilityReadingsPeriod = tab.dataset.period;
    utilityReadingsEditMode = false;
    utilitySummaryCollapsed = false;
    utilityPrevState = null;
    renderPeriodTabs();
    utilityReferenceData = await getUtilityReference(utilityReadingsPeriod);
    renderUtilityRefStatus();
    loadUtilitySummary();
  });

  // Эталон для сверки — своя загрузка/статус на каждый период (см. getUtilityReference).
  function renderUtilityRefStatus() {
    const el = document.getElementById('utilityRefStatus');
    if (!el) return;
    if (utilityReferenceData) {
      const d = utilityReferenceData.uploadedAt ? new Date(utilityReferenceData.uploadedAt) : null;
      el.innerHTML = `Эталон: <b>${escHtml(utilityReferenceData.fileName || '')}</b>${d ? ' (' + d.toLocaleDateString('ru-RU') + ')' : ''} — <a href="#" id="utilityRefClearLink" style="color:var(--text3);text-decoration:underline;">убрать</a>`;
      const link = document.getElementById('utilityRefClearLink');
      if (link) link.addEventListener('click', async (e) => {
        e.preventDefault();
        if (!confirm('Убрать загруженный эталон для этого периода (' + periodLabel(utilityReadingsPeriod) + ')?')) return;
        await deleteUtilityReference(utilityReadingsPeriod);
        utilityReferenceData = null;
        renderUtilityRefStatus();
        if (window.__utilityData) renderUtilitySummaryTable(window.__utilityData);
      });
    } else {
      el.textContent = '';
    }
  }
  document.getElementById('utilityRefUploadBtn').addEventListener('click', () => {
    document.getElementById('utilityRefFileInput').click();
  });
  document.getElementById('utilityRefFileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const sheetRows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true });
      const parsed = [];
      sheetRows.slice(1).forEach(row => {
        const building = (row[0] || '').toString().trim();
        const type = (row[1] || '').toString().trim();
        if (!building || !type || building.toUpperCase() === 'ИТОГО') return;
        parsed.push({
          building, type,
          accrued: Number(row[3]) || 0,
          paidUs: Number(row[4]) || 0,
          paidTenants: Number(row[5]) || 0,
        });
      });
      if (parsed.length === 0) throw new Error('не найдено ни одной строки с данными');
      utilityReferenceData = { fileName: file.name, uploadedAt: new Date().toISOString(), rows: parsed };
      await saveUtilityReference(utilityReadingsPeriod, utilityReferenceData);
      renderUtilityRefStatus();
      if (window.__utilityData) renderUtilitySummaryTable(window.__utilityData);
      showMsg('utilityMsg', `Эталон загружен: ${parsed.length} строк. Включите «Показать все», чтобы увидеть сверку.`, 'ok');

      showMsg('utilityMsg', 'Ошибка загрузки эталона: ' + err.message, 'err');

    ).join('');

    const tab = e.target.closest('.month-tab');
    if (!tab) return;
    utilityReadingsType = tab.dataset.type;
    utilityReadingsEditMode = false;
    utilitySummaryCollapsed = false;
    utilityPrevState = null;
    renderTypeTabs();
    loadUtilitySummary();
  });

  if (utilityPrevState) {
    document.getElementById('utilityBackBtn').addEventListener('click', () => {
      const prev = utilityPrevState;
      utilityPrevState = null;
      utilityReadingsBuilding = prev.building;
      utilityReadingsType = prev.type;
      utilitySummaryCollapsed = prev.collapsed;
      utilityReadingsEditMode = false;
      pageUtilitySummary();
    });
  }
  document.getElementById('utilityAddOpBtn').addEventListener('click', () => openUtilityAddRowForm());
  document.getElementById('utilityColVisBtn').addEventListener('click', (e) => {
    showColumnVisibilityMenu('utility-summary-cols', [
      'Здание / Арендатор', 'Объект', 'Тип по арендаторам', 'Тип по зданиям',
      'На начало', 'На конец', 'Тариф', 'Итог', 'Начислено', 'Оплата Эрия',
      'Оплата арендатора фикс-ручная', 'Оплата арендатора по счётчику', 'Оплата итог',
    ], e.target);
  });
  document.getElementById('utilityExtraBldBtn').addEventListener('click', () => openUtilityExtraBuildingsSettings());
  document.getElementById('utilityCollapseAllBtn').addEventListener('click', (e) => {
    // Не прячет блоки-разделы («Свет»/«Газ»/«Вода»/…) целиком, а заменяет разбивку по
    // зданиям внутри каждого блока ОДНОЙ строкой-итогом по всем видимым зданиям сразу —
    // сами блоки (и их заголовки) остаются на месте. Плюс сводная карточка «Итого по
    // коммуналке» по всем разделам сразу.
    utilitySummaryCollapsed = !utilitySummaryCollapsed;
    e.currentTarget.textContent = utilitySummaryCollapsed ? 'Показать все' : 'Свернуть все';
    try {
      if (window.__utilityData) renderUtilitySummaryTable(window.__utilityData);
    } catch (err) {
      showMsg('utilityMsg', 'Ошибка отрисовки: ' + err.message, 'err');
    }
  });

  utilityReferenceData = await getUtilityReference(utilityReadingsPeriod);
  renderUtilityRefStatus();
  await loadUtilitySummary();
}

// "+ Добавить строку" — НЕ операция в Кассе (никак не связана с cash_ledger_raw), а просто
// новая строка в самой таблице Коммуналки, привязанная к зданию, которую дальше правишь
// вручную прямо в таблице (На начало/На конец/Тариф и т.д. — как у обычного арендатора).
// Строка либо привязана к реальному арендатору из CRM (выбор из каскадного списка "Здание
// -> Арендатор", как в Кассе), либо — если арендатора нет — к пункту из настраиваемого
// списка "Оплата службам" (settings, список редактируется тут же через ⚙️). Сами строки
// хранятся в settings (utility_manual_rows) и подмешиваются к обычным строкам арендаторов
// в loadUtilitySummary — поэтому для них работает всё то же самое (Тип, показания,
// редактирование), только Оплата Эрия/арендатора по-прежнему пробуют сматчиться с Кассой
// по имени (findPayment), как и у всех остальных строк.
// ============================================================
async function getUtilityManualRows() {
  const rows = await db(`select value from settings where key='utility_manual_rows'`);
  return rows.length > 0 ? rows[0].value : [];
}
async function saveUtilityManualRows(list) {
  await db(`insert into settings (key, value) values ('utility_manual_rows', $1) on conflict (key) do update set value=$1, updated_at=now()`, [JSON.stringify(list)]);
}
async function getUtilityServiceOptions() {
